schema: gwexpy-v023-reconstruction-authority-v1
release: v0.2.3
purpose: >-
  Classify every reviewed internal TimeSeries/TimeSeriesMatrix reconstruction
  touched by the constructor parity follow-up, and make the authority used by
  each call site auditable.
status: classification-complete-focused-green-runtime-frozen-review-pending
implementation_base: a8085b71446d3ef3417a7e5b5ac8efb156368eac
supersedes_runtime_candidate: 8200a30a9e131cb357b17f0b64f5d6de995a2a26
runtime_candidate: 58559c742e4e2e7a483e72f132f3a84ff5aa626b
oracles:
  - gwpy-4.0.1
  - gwpy-4.0.2
comparison_contract:
  exact:
    - values
    - nan_mask
    - posinf_mask
    - neginf_mask
    - shape
    - dtype
    - x0_or_t0
    - dx_or_dt
    - materialized_axis
    - axis_unit
    - data_unit
  exception_message_exact: false
  parent_exception_retry: forbidden
  materialized_axis_reconstruction: forbidden

authority_rules:
  axis-coordinate:
    authority: x0/dx plus source xunit
    description: >-
      Use for an output whose coordinate is the source sample axis. Preserve
      the source axis unit explicitly, including for matrix constructors.
  absolute-time:
    authority: t0/dt or epoch
    description: >-
      Use only when the output contract is an absolute GPS-time axis or an
      external file supplies an absolute epoch.
  parent-result-wrap:
    authority: parent result x0/dx or t0/dt
    description: >-
      Copy the parent's existing authority directly; never infer it from a
      materialized large-epoch coordinate array.
  unrelated:
    authority: individual API contract
    description: >-
      Logging, display, local index arithmetic, and explicit external-file
      epoch normalization are outside this constructor follow-up.

entries:
  - id: resampling.asfreq.normal
    source: gwexpy/timeseries/_resampling.py:_construct_result
    classification: axis-coordinate
    action: use x0 and source time_unit
    evidence:
      - tests/timeseries/test_resampling.py::test_asfreq_nonsecond_axis_preserves_x0_and_values
      - tests/timeseries/test_resampling.py::test_asfreq_cross_unit_preserves_source_axis_authority
      - tests/timeseries/test_reported_fixes.py::test_align_converts_to_gps_seconds
  - id: resampling.asfreq.empty
    source: gwexpy/timeseries/_resampling.py:TimeSeriesResamplingMixin.asfreq
    classification: axis-coordinate
    action: use x0 for the empty grid boundary
    evidence:
      - tests/timeseries/test_resampling.py::test_asfreq_empty_nonsecond_axis_preserves_grid_x0
      - tests/timeseries/test_resampling.py::test_asfreq_empty_cross_unit_preserves_source_axis_authority
      - tests/timeseries/test_resampling.py::test_asfreq_empty_dimensionless_axis_remains_dimensionless
  - id: resampling.time_bin.normal
    source: gwexpy/timeseries/_resampling.py:TimeSeriesResamplingMixin._resample_time_bin
    classification: axis-coordinate
    action: use x0 and preserve coordinate_unit
    evidence:
      - tests/timeseries/test_resampling.py::test_resample_time_bin_preserves_nonsecond_axis_authority
      - tests/timeseries/test_resampling.py::test_resample_time_bin_cross_unit_preserves_source_axis_authority
      - tests/timeseries/test_resampling.py::test_resample_time_bin_dimensionless_axis_remains_dimensionless
  - id: resampling.time_bin.empty
    source: gwexpy/timeseries/_resampling.py:TimeSeriesResamplingMixin._resample_time_bin
    classification: axis-coordinate
    action: use x0 for the empty grid boundary
    evidence:
      - tests/timeseries/test_resampling.py::test_resample_time_bin_empty_preserves_nonsecond_axis_authority
      - tests/timeseries/test_resampling.py::test_resample_time_bin_empty_cross_unit_preserves_source_axis_authority
  - id: signal.hilbert
    source: gwexpy/timeseries/_signal.py:TimeSeriesSignalMixin.hilbert
    classification: axis-coordinate
    action: use self.x0/self.dt
    evidence:
      - tests/timeseries/test_nonsecond_axis_reconstruction.py::test_signal_reconstruction_preserves_nonsecond_axis
      - tests/timeseries/test_gwpy_audit_signal_compat.py::test_same_axis_signal_methods_preserve_exact_time_authority
  - id: signal.phase-family
    source: gwexpy/timeseries/_signal.py:instantaneous_phase,radian,degree,instantaneous_frequency
    classification: axis-coordinate
    action: use self.x0/self.dt
    evidence:
      - tests/timeseries/test_nonsecond_axis_reconstruction.py::test_signal_reconstruction_preserves_nonsecond_axis
      - tests/timeseries/test_gwpy_audit_signal_compat.py::test_same_axis_signal_methods_preserve_exact_time_authority
  - id: signal.mix-down-lock-in
    source: gwexpy/timeseries/_signal.py:TimeSeriesSignalMixin.mix_down,lock_in
    classification: parent-result-wrap
    action: preserve the parent result exact t0/dt authority for same-axis outputs
    evidence:
      - tests/timeseries/test_gwpy_audit_signal_compat.py::test_same_axis_signal_methods_preserve_exact_time_authority
      - tests/timeseries/test_gwpy_audit_signal_compat.py::test_lock_in_preserves_exact_time_authority
