      - tests/timeseries/test_nonsecond_axis_reconstruction.py::test_lock_in_bandwidth_preserves_nonsecond_axis_after_mix_down
  - id: signal.demodulate-wrap
    source: gwexpy/timeseries/_signal.py:TimeSeriesSignalMixin.demodulate
    classification: parent-result-wrap
    action: use outc.x0/outc.dt
    evidence:
      - tests/timeseries/test_gwpy_audit_signal_compat.py
      - tests/timeseries/test_nonsecond_axis_reconstruction.py::test_signal_reconstruction_preserves_nonsecond_axis
  - id: signal.phase-epoch-model
    source: gwexpy/timeseries/_signal.py:TimeSeriesSignalMixin._build_phase_series
    classification: absolute-time
    action: convert physical axis coordinates to seconds only for phase_epoch arithmetic
