      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_copy_orders_match_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_copy_preserves_private_exact_time_authority

  - id: implementation-437446342322a767
    surface: TimeSeries.crop
    common_state: fixed
    pre_fix: >-
      GWexpy accepted crop(start, end, copy) while both installed GWpy oracles
      raised TypeError; the public descriptor also exposed copy as
      positional-or-keyword. The extension also passed absolute GPS seconds as
      bare values on non-second axes and broadly intercepted ndarray/complex
      inputs that belong to the parent route.
    fix: >-
      Make copy keyword-only, route only explicit time-like extensions, convert
      them exactly into the receiver axis unit, and leave all other inputs and
      the crop algorithm to GWpy.
    fixtures:
      - unbounded and exact-span views
      - inner and one-ULP boundary selection
      - out-of-span clamping
      - copy true and false memory behavior
      - large GPS epoch
      - private exact t0 and dt authority preservation
      - scalar and vector ndarray outcomes
      - complex failure class
      - datetime extension on a nanosecond axis
    evidence:
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_parameter_layout_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_bounds_and_memory_match_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_copy_is_keyword_only_like_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_preserves_private_exact_time_authority
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_nonextension_bound_outcome_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_datetime_extension_converts_to_axis_unit

  - id: implementation-92eb9b7ff87b74f6
    surface: TimeSeries.append
    common_state: fixed
    pre_fix: >-
      GWexpy exposed pad before gap in the public keyword-only layout while
      both installed GWpy oracles expose gap before pad. A resize-false append
      advanced the public nanosecond axis correctly but multiplied its private
      exact epoch by one billion.
    fix: >-
      Restore the GWpy keyword-only order and interpret the parent-owned bare
      epoch update in the receiver axis unit.
    fixtures:
      - contiguous inplace and copy routes
      - discontiguous raise
      - zero and custom padding
      - mutation, return identity, and memory ownership
      - private exact t0 and dt authority preservation
      - resize false with inplace true and false on a nanosecond axis
    evidence:
