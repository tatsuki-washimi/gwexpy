  - id: implementation-437446342322a767
    surface: TimeSeries.crop
    common_state: fixed
    pre_fix: >-
      GWexpy accepted crop(start, end, copy) while both installed GWpy oracles
      raised TypeError; the public descriptor also exposed copy as
      positional-or-keyword. The extension also passed absolute GPS seconds as
      bare values on non-second axes and broadly intercepted ndarray/complex
      inputs that belong to the parent route.
    fix: >-
      Make copy keyword-only, route only explicit time-like extensions, convert
      them exactly into the receiver axis unit, and leave all other inputs and
      the crop algorithm to GWpy.
    fixtures:
      - unbounded and exact-span views
      - inner and one-ULP boundary selection
      - out-of-span clamping
      - copy true and false memory behavior
      - large GPS epoch
      - private exact t0 and dt authority preservation
      - scalar and vector ndarray outcomes
      - complex failure class
      - datetime extension on a nanosecond axis
    evidence:
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_parameter_layout_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_bounds_and_memory_match_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_crop_copy_is_keyword_only_like_gwpy
