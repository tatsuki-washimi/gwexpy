oracles:
  - environment: main
    python: 3.12.12
    gwpy: 4.0.1
  - environment: gwexpy
    python: 3.11.14
    gwpy: 4.0.2
oracle_version_difference: none observed in this fixture matrix
oracle_execution: >-
  Every common-path fixture constructs an independent installed-GWpy input and
  a separate GWexpy input in the same pinned environment. Extension fixtures
  first record the installed-GWpy exception class and do not use a GWexpy
  result as an oracle.

comparators:
  call_layout:
    exact:
      - parameter order and names
      - parameter kinds
      - default values
    annotations: >-
      Excluded from the runtime binding comparator. GWexpy intentionally uses
      its own subclass return annotations and broader extension input types;
      neither changes Python call binding.
  numeric_payload:
    finite_rtol: 0.0
    finite_atol: 0.0
    exact:
      - shape
      - dtype
      - NaN mask
      - positive infinity mask
      - negative infinity mask
  metadata:
    exact:
      - unit
      - name
      - channel
      - t0 and x0 values and units
      - dt value and unit
      - time-axis values and unit
      - spectrogram frequency-axis values and unit
  lifecycle:
    exact:
      - success or failure
      - exception class
      - return identity relative to the receiver
      - input mutation
      - result memory sharing relative to the receiver and new-key source

