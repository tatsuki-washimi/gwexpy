private_exact_time_augmentation:
  cadence_setters:
    - dt
    - dx
    - sample_rate
  contract: >-
    A successful parent cadence update recomputes integral nanoseconds,
    accepting only values within one floating-point ULP of an integer after
    unit conversion. A true non-integral cadence removes stale metadata.
    sample_rate=None and direct dt/dx deletion recompute the parent default in
    the receiver axis unit, so subsequent copy and slicing never use an obsolete
    interval. Nonfinite cadence remains fail-closed.
  evidence:
    - tests/timeseries/test_exact_gps_epoch.py::test_cadence_setters_synchronize_exact_interval_for_copy_and_slice
    - tests/timeseries/test_exact_gps_epoch.py::test_nonintegral_cadence_setter_drops_stale_exact_interval
    - tests/timeseries/test_exact_gps_epoch.py::test_cadence_one_ulp_from_integer_keeps_exact_interval
    - tests/timeseries/test_exact_gps_epoch.py::test_cadence_two_ulps_from_integer_drops_exact_interval
    - tests/timeseries/test_exact_gps_epoch.py::test_sample_rate_setter_keeps_ulp_close_integral_exact_cadence
    - tests/timeseries/test_exact_gps_epoch.py::test_cadence_deletion_recomputes_exact_default_interval
    - tests/timeseries/test_exact_gps_epoch.py::test_nonfinite_cadence_construction_still_fails_closed
    - tests/timeseries/test_exact_gps_epoch.py::test_nonfinite_cadence_setter_clears_exact_interval

