        result: 5 failed, 29 deselected
        observation: >-
          Bare epoch setters and resize-false append interpreted nanosecond-axis
          values as seconds, including both inplace modes and collection append.
      - cycle: exact-cadence-setters
        result: 4 failed, 34 deselected
        observation: >-
          dt, dx, and sample_rate updates left stale exact cadence metadata;
          non-integral cadence did not remove the stale value.
      - cycle: crop-routing
        result: 4 failed, 1 passed, 64 deselected
        observation: >-
          Datetime bounds stayed in GPS seconds on nanosecond axes, while
          vector ndarray and complex bounds did not preserve parent outcomes.
      - cycle: collection-append-input-mutation
        result: 1 failed
        observation: >-
          A mapping key named copy was silently removed and the parent ValueError
          was suppressed.
      - cycle: constructor-layout
        result: 1 failed, 16 passed, 42 deselected
        observation: >-
          TimeSeries.__new__ hid the complete GWpy positional-or-keyword prefix
          behind args and kwargs.
      - cycle: exact-authority-presence
        result: 3 failed, 38 deselected
        observation: >-
          Restoring the explicit constructor prefix initially lost the distinction
          between an omitted authority and an explicitly supplied None authority.
