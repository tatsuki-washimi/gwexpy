private_exact_time_augmentation:
  cadence_setters:
    - dt
    - dx
    - sample_rate
  contract: >-
    A successful parent cadence update recomputes integral nanoseconds. A
    non-integral cadence removes stale private interval metadata; subsequent
    slicing therefore fails closed instead of advancing an exact epoch with an
    obsolete interval.
  evidence:
    - tests/timeseries/test_exact_gps_epoch.py::test_cadence_setters_synchronize_exact_interval_for_copy_and_slice
    - tests/timeseries/test_exact_gps_epoch.py::test_nonintegral_cadence_setter_drops_stale_exact_interval

release_constraints:
  new_public_api: false
  new_dependency: false
  new_data_format: false
  physics_algorithm_changed: false
  human_physics_review_required: false
  human_time_axis_metadata_review_required: true
  workflow_changed: false
  override_inventory_regeneration: deferred until all production lanes are stable

static_validation:
  ruff_changed_files: all checks passed
  ruff_format_changed_files: 8 files already formatted
  mypy_changed_source_files: success, no issues found in 3 source files
  yaml_safe_load: valid
  git_diff_check: no whitespace errors

human_review:
  required: true
  lane: time-axis-metadata
  reason: >-
    The private integer epoch and cadence authority now tracks parent-owned
    setters, buffer-style append, and non-second crop axes. Review must confirm
    the exact-unit conversion, stale-authority removal, and copy/slice behavior.
