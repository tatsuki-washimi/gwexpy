  - id: implementation-92eb9b7ff87b74f6
    surface: TimeSeries.append
    common_state: fixed
    pre_fix: >-
      GWexpy exposed pad before gap in the public keyword-only layout while
      both installed GWpy oracles expose gap before pad. A resize-false append
      advanced the public nanosecond axis correctly but multiplied its private
      exact epoch by one billion. The first follow-up still reconstructed a
      large exact epoch from the parent-rounded public float. The second
      follow-up still resurrected rounded private epoch state when an exact
      epoch existed without a representable integer-nanosecond cadence. The
      fail-closed repair then also discarded that epoch for an empty append,
      even though GWpy treats the operation as a no-op.
    fix: >-
      Restore the GWpy keyword-only order. During a resize-false buffer update,
      let the parent update its public axis once. Advance private authority from
      the existing integer epoch by the appended integer sample count only when
      exact cadence exists; otherwise clear private epoch and cadence authority
      after a successful non-empty parent operation instead of reconstructing
      either from rounded public floats. Preserve the exact epoch and absent
      exact cadence when the appended row count is zero.
    fixtures:
      - contiguous inplace and copy routes
      - discontiguous raise
      - zero and custom padding
      - mutation, return identity, and memory ownership
      - private exact t0 and dt authority preservation
      - resize false with inplace true and false on a nanosecond axis
      - large exact epoch with three appended 125000000-nanosecond samples
      - exact epoch without exact cadence for one-third nanosecond
      - exact epoch without exact cadence two ULPs below eight nanoseconds
      - exact epoch without exact cadence two ULPs above eight nanoseconds
      - empty no-op for all three unavailable-cadence fixtures
    evidence:
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_append_parameter_layout_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_append_contiguous_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_append_gap_failure_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_append_gap_padding_matches_gwpy
      - tests/timeseries/test_gwpy_override_terminal_compat.py::test_timeseries_append_preserves_private_exact_time_authority
      - tests/timeseries/test_exact_gps_epoch.py::test_resize_false_append_advances_exact_epoch_in_axis_units
      - tests/timeseries/test_exact_gps_epoch.py::test_resize_false_append_advances_large_exact_epoch_without_float_roundtrip
      - tests/timeseries/test_exact_gps_epoch.py::test_collection_resize_false_append_advances_large_exact_epochs
      - tests/timeseries/test_exact_gps_epoch.py::test_resize_false_append_does_not_resurrect_unavailable_exact_cadence
      - tests/timeseries/test_exact_gps_epoch.py::test_empty_resize_false_append_preserves_exact_epoch_without_exact_cadence

  - id: implementation-23ef21fcc8b15c31
    surface: TimeSeries.t0
    common_state: fixed
    pre_fix: >-
      Exact-series setters converted private metadata before parent validation,
      rejecting GWpy-valid None and fractional-nanosecond inputs and replacing
      the parent's exception class for invalid vector inputs.
    fix: >-
      Delegate the original value to the parent exactly once. After success,
      update representable integer authority or clear it; never retry a parent
      failure.
    fixtures:
      - getter
      - numeric, Quantity, and LIGOTimeGPS setters
      - deletion outcome and fallback value
      - x0 alias synchronization
      - private exact authority update and deletion
      - bare numeric setter interpreted in the receiver axis unit
