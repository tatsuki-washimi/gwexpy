    - docs_redesign/about/changelog.md
    - tests/docs/test_docs_redesign_release_facts.py
  audit:
    - docs/developers/plans/manifests/audit-manifest-v0.2.4-review-repair.yaml
verification:
  - command: >-
      rtk conda run -n gwexpy python -m pytest -q
      tests/io/test_dttxml_common.py tests/io/test_dttxml_issue726.py
      tests/io/test_dttxml_issue731.py tests/io/test_dttxml_issue732.py
      tests/io/test_dttxml_issue733.py
      tests/test_diaggui_qualification_evidence.py
      tests/test_release_contracts.py tests/test_validate_release_script.py
      tests/docs/test_docs_redesign_release_facts.py
      tests/test_check_release_metadata_script.py
    result: 240 passed, 6 existing skips
  - command: dttxml 1.1.8 selected qualification node list
    result: 88 passed, 0 skipped in an isolated local environment
  - command: rtk conda run -n gwexpy ruff check on changed Python files
    result: passed
  - command: rtk conda run -n gwexpy mypy gwexpy/io/dttxml_common.py
    result: passed
  - command: targeted Sphinx changelog render with notebook execution off
    result: passed; rendered v0.2.3 heading and excluded v0.2.4
  - command: rtk conda run -n gwexpy python scripts/check_release_metadata.py
    result: passed; v0.2.4 version and date remain consistent
pending_or_omitted:
  - check: full PR CI
    status: pending corrective PR
  - check: broad local Sphinx build
    status: stopped while executing unrelated notebooks; target page rendered separately
  - check: scientific owner acceptance of df/ifft tradeoff
    status: pending human decision; do not merge corrective PR automatically
  - check: new-S review lanes and human approval
    status: pending corrective PR merge and new S
  - check: exact-R qualification and candidate dry-run
    status: pending; no R exists
