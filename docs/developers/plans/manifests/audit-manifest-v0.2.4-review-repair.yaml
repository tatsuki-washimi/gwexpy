schema: gwexpy-v024-review-repair-audit-v1
release: v0.2.4
branch: release/v0.2.4-review-repair
reviewed_source_replaced: dc07eb81689f89631dadbfc0775ce2287e239496
release_state:
  decision: HOLD
  new_source_S: pending_corrective_pr_merge
  publishing_R: not_created
  human_scientific_data_model_approval: not_received
  readiness_evidence_state: exact_empty_placeholder
findings_addressed:
  - id: SDM-001
    scope: embedded DiagGUI frequency axes
    resolution: >-
      Use f0/df for an embedded axis only if the constructed FrequencySeries
      reproduces every serialized frequency exactly; otherwise retain the
      explicit frequency array.
  - id: SEC-001
    scope: historical v0.2.3 review provenance
    resolution: >-
      Restore the v0.2.3 contract and readiness evidence bytes from the peeled
      published release source. Keep v0.2.4 review lanes separate.
  - id: DOC-001
    scope: public changelog publication boundary
    resolution: >-
      Remove pre-publication HOLD language from the root changelog so it can be
      tagged after final GO. Keep operational HOLD in the release plan and
      include only published v0.2.3 history in the public Sphinx changelog.
  - id: CI-001
    scope: DiagGUI qualification node coverage in the release workflow
    resolution: >-
      Copy issue726 for the newly selected rounded-axis node and retain issue734
      for the base-mode nodes. A workflow regression requires copied modules to
      equal the union of files referenced by the base and dttxml node lists.
skills:
  - prep_release
  - gwexpy_conda_jobs
  - triage_ci
  - superpowers:systematic-debugging
  - verify_physics
physics_review:
  summary: >-
    The external embedded-axis branch changes only frequency-axis representation.
    It passes the same samples, unit, epoch, and name to both constructors;
    it retains explicit bins whenever f0/df reconstruction would change them.
    No FFT or normalization calculation was changed.
  nontrivial_issue: >-
    Rounded float32 axes can now have df=None, so direct ifft() is unavailable
    for that case. Scientific owner acceptance is required before merge and
    before a new S can be approved.
  design_choice: strict_serialized_axis_preservation_accepted_by_user
  check_physics_status: pr_code_review_and_new_S_approval_required
