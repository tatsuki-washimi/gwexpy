      tests/docs/test_docs_conf_runtime.py
      tests/docs/test_gwpy4_proxy_workflow.py
      tests/test_gwpy_override_inventory.py
      tests/test_release_gate_workflow_contract.py
    result: "Passed: All checks passed."
  - command: >-
      rtk proxy conda run -n gwexpy ruff format --check
