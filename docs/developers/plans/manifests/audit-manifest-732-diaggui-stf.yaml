    channel_b: "Indexed ChannelB labels are exposed in numeric index order"
    subtype_1: "FHz is reconstructed from f0 + df * arange(N)"
    subtype_4: "The first N floatComplex words encode frequencies; response follows as complex64. dttxml FHz retains the real component only."
  evidence_boundary: >-
    Characterization uses synthetic XML that matches the installed parser's
    observed fields. It establishes serialized layout and parser behavior only;
    it does not establish STF physical meaning, channel pair direction, units,
    conjugation, or normalization.
implementation:
  supported_layouts:
    - "TransferFunction/1, Array Type floatComplex, M response rows of N samples, linear f0/df axis"
    - "TransferFunction/4, Array Type floatComplex, one embedded complex64 frequency row followed by M complex64 response rows"
  mapping: "Each validated response row is keyed by (ChannelB[index], ChannelA), using serialized labels without a physical direction claim."
  validation:
    - "M, N, Array dimensions, decoded stream length, response shape, and frequency-axis length must agree."
    - "ChannelB indices must be unique and contiguous from zero; labels must be nonempty and unique; label count must equal M."
    - "Subtype 4 embedded frequency words with nonzero imaginary components raise STF-specific ValueError before external axis projection is trusted."
    - "Only floatComplex storage is characterized; doubleComplex STF raises STF-specific ValueError."
    - "Irregular embedded axes and one-bin axes remain explicit."
  existing_products: "TF, COH, FFT, PSD, CSD, ASD, and TS branches retain their existing subtype mappings; raw STF preflight runs only when dttxml exposes STF results."
