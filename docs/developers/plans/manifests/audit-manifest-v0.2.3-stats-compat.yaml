contracts:
  default_route:
    implementation: direct next-MRO parent dispatch
    routing_predicate: instance is an Astropy Quantity subclass
    exception_retry: false
    nan: propagated exactly as by installed GWpy
    positive_and_negative_infinity: masks and finite values match installed GWpy
    var_unit: input unit squared
  explicit_extension:
    input: ignore_nan=true
    status: retained existing public opt-in
    implementation:
      quantity_no_out: subclass-aware nan reduction followed by the shared metadata postprocessor
      non_quantity_or_ndarray_out: pre-existing raw NumPy reduction route
      quantity_out:
        computation: raw NumPy reduction against a sacrificial Quantity copy
        staged_properties:
          - shape
          - dtype
          - writeable flag
        validation_precedence: NumPy axis, shape, dtype, and read-only errors
        dimensionful_failure: staged result conversion fails without caller mutation
        dimensionless_success: staged values and unit commit to caller after validation
    default: false
    var_unit: input unit squared
  reduction_results:
    normalization_point: after a successful parent default or Quantity no-out nan reduction
    parent_exception_retry: false
    out_behavior:
      default_parent_route: installed GWpy identity, mutation, and exception behavior
      explicit_ndarray: pre-existing mutation and non-identical Quantity return preserved
      explicit_quantity:
        non_convertible_result_unit: atomic UnitConversionError before mutation
        failure_values: unchanged
        failure_unit: unchanged
        validation_errors: exact NumPy exception class precedes unit conversion
        convertible_result_unit:
          values_and_unit: committed to caller out
          return_identity: non-identical Quantity result preserved
    array2d_and_plane2d:
      implicit_indices: follow GWpy result shape and index-access outcome
      explicit_indices: preserve GWpy stale-index behavior where GWpy preserves it
      explicit_default_valued_indices: classified as explicit by private-index provenance
    project_nd_types:
      keepdims_true:
        type: source type
        non_reduced_axes: preserve source names, coordinates, and units
        reduced_axes: preserve names with a dimensionless zero coordinate
      keepdims_false:
        three_dimensions: Array3D
        two_dimensions: Plane2D
        one_dimension: Series with the surviving name on xindex.info
        zero_dimensions: Quantity
      generic_array: preserve Array and surviving axis names
  non_gwpy_matrix_route:
    example: gwexpy.types.seriesmatrix.SeriesMatrix
    implementation: raw NumPy reduction rather than parent ndarray ufunc dispatch
    reason: SeriesMatrix deliberately sets __array_ufunc__ to null
    default_nan: propagated
  signatures:
    mean: parent positional surface plus keyword-only where and ignore_nan
    std: parent positional surface plus keyword-only where and ignore_nan
    var: parent positional surface plus keyword-only where and ignore_nan
    min: NumPy parent positional initial/where surface plus keyword-only ignore_nan
    max: NumPy parent positional initial/where surface plus keyword-only ignore_nan
    median: parent axis-and-keyword surface; ignore_nan consumed from keywords

comparators:
  exact:
    - success or failure
    - exception class
    - parameter order, kind, and default
    - numerical shape
    - dtype
    - unit
    - finite values with rtol 0 and atol 0
    - NaN mask
    - positive-infinity mask
    - negative-infinity mask
    - xindex and yindex success or exception class
    - xindex and yindex unit, length, and values
  calling_forms:
    - axis
    - dtype
    - out
    - ddof
    - keepdims
    - where
    - initial
    - overwrite_input
  exception_message_exact: false

