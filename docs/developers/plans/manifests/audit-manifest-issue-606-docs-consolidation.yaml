schema: gwexpy-issue-606-docs-consolidation-v1
date_utc: 2026-10-26
issue: 606
related_issues:
  - 815
  - 816
  - 822
status: implementation-pending-hosted-ci-and-pages-readback
skills:
  - manage_docs
decision:
  canonical_source: docs_redesign
  legacy_source_disposition: >-
    Retain docs/web as noncanonical input for remaining one-off tutorial
    generators and historical release evidence. The production Pages workflow
    does not build this source tree; it publishes supported old /docs/web/
    routes as generated redirects. Retire the remaining source inputs only
    after their tools and immutable historical references no longer depend on
    them.
  redirect_inventory: >-
    scripts/generate_docs_redirect_stubs.py defines 29 bilingual route pairs
    (58 English/Japanese redirect stubs) and validates that all new-site target
    files exist before publication. No full external URL crawl was run.
implementation:
  migrated_checks:
    - tests/interop/test_interop_docs_contract_sync.py reads docs_redesign English pages and Japanese PO translations
    - tests/io/test_io_docs_contract_sync.py reads docs_redesign English pages and Japanese PO translations
    - scripts/check_terms.py scans active Japanese docs_redesign PO translations; fuzzy, obsolete, API, and glossary entries are excluded
  notebook_source: >-
    scripts/prepare_public_docs.py now prepares notebooks from docs_redesign,
    clears outputs and execution counts, and records public_notebooks in build
    identity. The readback checker accepts the prior notebook_sources field for
    already-published builds.
  routine_docs_pr: >-
    .github/workflows/docs-pr.yml preserves the required Docs build and smoke
    check context for terminology/artifact checks, while the separate
    docs_redesign job builds the canonical site. The redundant legacy Sphinx,
    notebook-generation, quickstart, and heading-sync dependency was removed.
  pages_trigger: >-
    The production Pages push filter no longer rebuilds docs_redesign for
    changes under docs/web/en/user_guide/tutorials; it continues to publish
    for docs_redesign and its actual build inputs.
  redirect_policy: >-
    Supported published legacy URLs remain generated by the existing Pages
    redirect script; no published URL namespace or gh-pages content was changed
    in this PR.
checks:
  - command: >-
      rtk proxy conda run -n gwexpy python -m pytest -q
      tests/docs/test_check_terms.py tests/docs/test_po_utils.py
      tests/docs/test_public_docs_pipeline.py tests/docs/test_docs_conf_runtime.py
      tests/docs/test_check_public_docs_workflow.py
      tests/interop/test_interop_docs_contract_sync.py
      tests/io/test_io_docs_contract_sync.py
      tests/test_generate_docs_redirect_stubs.py
    result: exit 0; 75 passed in 3.30s
  - command: python scripts/check_terms.py
    result: exit 0; no suspicious terminology variants found in Japanese translations
  - command: >-
      ruff check scripts/check_terms.py scripts/po_utils.py
      scripts/prepare_public_docs.py scripts/check_public_docs.py
      tests/docs/test_check_terms.py tests/docs/test_po_utils.py
      tests/docs/test_public_docs_pipeline.py tests/docs/test_docs_conf_runtime.py
      tests/docs/test_check_public_docs_workflow.py
      tests/interop/test_interop_docs_contract_sync.py
      tests/io/test_io_docs_contract_sync.py
    result: exit 0; all checks passed
  - command: >-
      ruff format --check scripts/check_terms.py scripts/po_utils.py
      scripts/prepare_public_docs.py scripts/check_public_docs.py
      tests/docs/test_check_terms.py tests/docs/test_po_utils.py
      tests/docs/test_public_docs_pipeline.py tests/docs/test_docs_conf_runtime.py
      tests/docs/test_check_public_docs_workflow.py
      tests/interop/test_interop_docs_contract_sync.py
      tests/io/test_io_docs_contract_sync.py
    result: exit 0; 12 files already formatted
  - command: >-
      isolated full EN Sphinx build of copied docs_redesign sources
    result: >-
      failed at the existing 600-second notebook-cell timeout in unchanged
      how-to/fitting/advanced_arima.ipynb. This is recorded as a failed local
      full build, not a pass. Earlier notebooks completed; hosted Docs checks
      and post-merge Pages readback remain required.
  - command: git diff --cached --check
    result: exit 0; staged diff is whitespace-clean
omitted:
  - >-
    Repository-wide pytest, Ruff, and MyPy were not run; checks were selected
    for the changed Docs pipeline and contract-sync behavior.
  - >-
    The full external legacy-link crawl was not run. Redirect target existence
    and legacy redirect generation are covered by the existing route-map
    validation; the hosted publication workflow reads back the deployed
    English and Japanese site after merge.
  - >-
    No direct gh-pages write or release publication was performed. The
    existing Docs Pages workflow runs on merge and must complete with its
    bilingual readback before issue closure.
check_physics: not_applicable; no scientific algorithm or data model changed
