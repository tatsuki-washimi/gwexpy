oracle_runs:
  - environment: gwexpy
    python: 3.11.14
    gwpy: 4.0.2
    version_source: importlib.metadata.version
    result: 100 passed
  - environment: main
    python: 3.12.12
    gwpy: 4.0.1
    version_source: importlib.metadata.version
    result: 100 passed
constructor_routing:
  gwpy_supported_pass_through:
    - numeric scalar
    - numeric string
    - decimal.Decimal
    - astropy.units.Quantity
    - astropy.time.Time
    - gwpy.time.LIGOTimeGPS
    - numpy.datetime64
    - float-compatible UTCDateTime
  gwexpy_only_normalized:
    - nonnumeric date string
    - datetime.date and datetime.datetime
    - numeric date-shaped tuple or list of length 3 through 7
  parent_call_contract: exactly once with supported epoch object unchanged
  parent_failure_contract: propagated without retry
focused_tests:
  - tests/timeseries/test_constructor_compat.py
  - tests/timeseries/test_exact_gps_epoch.py
  - tests/timeseries/test_timeseries_fallbacks.py
  - tests/timeseries/test_collections_batch.py
  - tests/timeseries/test_collections_provenance.py
  - tests/frequencyseries/test_filterba_compat.py
