metadata_audit:
  confirmed_finding:
    format: hdf.ndscope
    evidence: >-
      test_seis_ndscope.h5 stores sample_rate, gps_start, unit, and raw in
      each channel group. The previous reader and identifier required rate_hz,
      yielding an empty TimeSeriesDict for explicit reads and no auto-identify.
    resolution: >-
      Read rate_hz as canonical and sample_rate as a compatibility alias;
      reject non-finite, non-positive, or conflicting values.
  reviewed_without_equivalent_fixed-key_defect:
    - formats: [gwf, hdf5, mseed, sac, gse2, knet, win, win32, ats, ats.mth5]
      basis: "GWpy/ObsPy/MTH5 format parsers own external metadata decoding."
    - formats: [nc]
      basis: "Reader derives time from named or datetime coordinates and accepts units/unit."
    - formats: [zarr]
      basis: "Reader already accepts sample_rate or dt, validates timing, and exposes explicit overrides."
    - formats: [csv, txt, gbd, sdb, sqlite, sqlite3]
      basis: "Text/header/database readers use format-specific parsing or explicit user configuration."
    - formats: [tdms]
      basis: "Reader uses the documented npTDMS waveform properties wf_increment and wf_start_time."
    - formats: [wav, flac, ogg, mp3, m4a]
      basis: "Audio codecs supply sample rate in their standard container headers."
    - formats: [xml.diaggui]
      basis: "Product-specific parser normalizes XML fields before TimeSeries construction."
    - formats: [pickle, root]
      basis: "No externally named TimeSeries sampling-rate attribute is interpreted by this public route."
