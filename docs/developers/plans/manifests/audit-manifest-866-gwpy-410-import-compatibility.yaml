    - Add GWpy 4.1.0 to the compatibility workflow matrix.
    - Skip the GWpy 4.0.x override inventory oracle check in the 4.1.0 matrix cell while retaining proxy and timeseries compatibility checks.
    - Skip the 4.0.x-only GWOSC live-test inventory audit in the 4.1.0 matrix cell so the filtered timeseries suite can run.
