root_cause: >-
  The production Docs publisher deployed the verified artifact and passed the
  EN/JA build-identity readback. The subsequent per-file SHA-256 readback used a
  single HTTP request per file. Two runs returned transient HTTP 503 responses
  for different image files even though both URLs later returned HTTP 200 and
  EN/JA build-info matched the deployed source. The second failed publisher
  attempt reused the same attempt-1 artifact ID and digest.
implementation:
  retryable_http_statuses:
    - 408
    - 425
    - 429
    - 5xx
  maximum_attempts_per_file: 4
  backoff_seconds:
    - 1
    - 2
    - 4
  integrity_contract: >-
    Retry only transient HTTP responses. A final transport/HTTP error or any
    successful response whose bytes do not match the expected SHA-256 fails
    readback; source SHA and the exact build artifact remain unchanged.
