comparison_contract:
  binding:
    exact:
      - common parameter order and names
      - common parameter kinds and defaults
      - every supported positional prefix
      - duplicate positional and keyword outcome
      - excess positional outcome
    annotations: excluded because subclass return and extension input annotations do not change binding
  result:
    exact:
      - success or failure
      - exception class
      - values, shape, and dtype
      - unit, name, epoch, and channel
      - regular two-dimensional and frequency axes
      - copy-false memory sharing
  exception_message_exact: false
  presentation_pixels_style_layout: excluded

constructor_rows:
  - public_class: gwexpy.types.array.Array
    member: __new__
    gwpy_counterpart: gwpy.types.Array.__new__
    state: fixed
    pre_fix: >-
      The override collapsed the GWpy keyword-only constructor into data,
      positional axis_names, and kwargs, rejected the GWpy value= form, and
      exposed the extension as a positional slot.
    fix: expose the complete GWpy Array prefix and make axis_names keyword-only
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_keyword_route_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_failure_class_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_gwpy_array_keyword_only_binding_is_not_hijacked

  - public_class: gwexpy.types.array2d.Array2D
    member: __new__
    gwpy_counterpart: gwpy.types.Array2D.__new__
    state: fixed
    pre_fix: >-
      The positional axis_names extension occupied GWpy's unit slot and the
      remaining x/y constructor prefix was hidden behind kwargs.
    fix: restore the complete GWpy Array2D positional prefix and isolate axis_names as keyword-only
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array2d_family_full_positional_prefix_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array2d_family_explicit_indices_match_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_failure_class_matches_gwpy

  - public_class: gwexpy.types.array3d.Array3D
    member: __new__
    gwpy_counterpart: gwpy.types.Array.__new__
    state: fixed
    pre_fix: >-
      The specialized axis parameters were positional, the GWpy value= form
      failed, and a positional unit succeeded although GWpy raises TypeError.
    fix: expose the GWpy Array keyword-only prefix before explicit axis extensions
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_keyword_route_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_gwpy_array_keyword_only_binding_is_not_hijacked

  - public_class: gwexpy.types.array4d.Array4D
    member: __new__
    gwpy_counterpart: gwpy.types.Array.__new__
    state: fixed
    pre_fix: >-
      The specialized axis parameters were positional, the GWpy value= form
      failed, and a positional unit succeeded although GWpy raises TypeError.
    fix: expose the GWpy Array keyword-only prefix before explicit axis extensions
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_keyword_route_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_gwpy_array_keyword_only_binding_is_not_hijacked

  - public_class: gwexpy.types.plane2d.Plane2D
    member: __new__
    gwpy_counterpart: gwpy.types.Array2D.__new__
    state: fixed
    pre_fix: >-
      A GWpy-valid second positional unit was silently consumed as axis1_name,
      leaving the result dimensionless, and the rest of the parent prefix was unavailable.
    fix: restore the GWpy Array2D prefix and keep semantic names keyword-only
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array2d_family_full_positional_prefix_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array2d_family_explicit_indices_match_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_failure_class_matches_gwpy

  - public_class: gwexpy.fields.scalar.ScalarField
    member: __new__
    gwpy_counterpart: gwpy.types.Array.__new__
    state: fixed
    pre_fix: >-
      FieldBase hid the GWpy Array parameter layout, rejected value=, and
      accepted positional metadata that the counterpart rejects.
    fix: expose the GWpy Array keyword-only prefix before explicit field-axis and domain options
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_common_keyword_route_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_array_family_copy_false_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_gwpy_array_keyword_only_binding_is_not_hijacked

  - public_class: gwexpy.frequencyseries.frequencyseries.FrequencySeries
