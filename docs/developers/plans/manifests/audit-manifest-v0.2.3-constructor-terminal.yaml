  - public_class: gwexpy.plot.skymap.SkyMap
    member: __init__
    gwpy_counterpart: gwpy.plot.Plot.__init__
    state: fixed
    ownership: existing SkyMap constructor lane
    pre_fix: >-
      The implicit all-sky projection was injected into a GWpy-valid
      data-bearing TimeSeries constructor call and failed.
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_plot_constructor_variadic_binding_matches_gwpy
      - tests/plot/test_skymap_gwpy_constructor_compat.py::test_skymap_accepts_parent_timeseries_constructor_surface

explicit_extensions:
  GWexpy-only:
    - Array axis_names
    - Array2D axis_names
    - Array3D and Array4D named physical axes
    - Plane2D semantic axis names
    - ScalarField axis and domain metadata
    - FrequencySeries fmin and fmax noise-generation hints
    - FieldPlot last_field_colorbar state
    - SkyMap empty-constructor all-sky projection
    - TimeSeries t0_ns exact epoch authority
  GWpy-fails: >-
    Each installed oracle rejects the listed extension keywords with TypeError;
    those concrete extension fixtures must not be used as evidence of a common parent success route.
  exception_retry: false

