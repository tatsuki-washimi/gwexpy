    gwpy_counterpart: gwpy.frequencyseries.FrequencySeries.__new__
    state: no-finding
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_constructor_common_parameter_layout_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_frequencyseries_common_constructor_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_frequencyseries_common_failure_class_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_frequencyseries_explicit_frequency_index_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_frequencyseries_explicit_noise_range_extension_is_isolated

  - public_class: gwexpy.timeseries.timeseries.TimeSeries
