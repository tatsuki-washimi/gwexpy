    gwpy_counterpart: gwpy.timeseries.TimeSeries.__new__
    state: fixed
    ownership: existing phase-1 and TimeSeries terminal lanes
    pre_fix: >-
      GWpy-supported epochs could be normalized before the parent call and the
      override hid the public positional prefix behind args and kwargs.
    evidence:
