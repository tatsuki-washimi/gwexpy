  - public_class: gwexpy.plot.field.FieldPlot
    member: __init__
    gwpy_counterpart: gwpy.plot.Plot.__init__
    state: no-finding
    evidence:
      - tests/test_gwpy_constructor_terminal_compat.py::test_plot_constructor_variadic_binding_matches_gwpy
      - tests/test_gwpy_constructor_terminal_compat.py::test_plot_family_data_constructor_matches_gwpy
