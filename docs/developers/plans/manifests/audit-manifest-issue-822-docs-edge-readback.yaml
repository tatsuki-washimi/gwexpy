root_cause: >-
  Production run 40332937262 reported an EN/JA manifest byte mismatch for
  ja/how-to/calibration/index.html. The attempt-1 artifact file and the
  gh-pages blob both had SHA-256 da233d37e0152364e66cf5509a2951038146017882d390a26b5290406b185194.
  A later uncached read from the public URL returned the same digest, and the
  full deployed manifest readback passed with the bounded retry implementation.
  The exact bytes returned during the failed request were not retained; a
  transient Pages edge response is consistent with the observed change.
implementation:
  retryable_http_statuses:
    - 408
    - 425
    - 429
    - 5xx
  retry_on_sha256_mismatch: true
  maximum_attempts_per_file: 4
  backoff_seconds:
    - 1
    - 2
    - 4
  integrity_contract: >-
    Every attempt uses the same expected digest from the source-bound artifact
    manifest. A file passes only when a response's SHA-256 equals that digest.
    Exhausted mismatches, nonretryable HTTP errors, and transport errors fail.
