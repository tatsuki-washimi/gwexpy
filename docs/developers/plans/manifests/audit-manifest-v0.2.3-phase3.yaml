oracle_isolation:
  research_working_directory: /tmp
  python_flags: -I -S
  environment_removed:
    - PYTHONPATH
    - PYTHONHOME
  user_site_disabled: true
  purelib_added_explicitly: true
  assertions:
    - no GWexpy module was imported by the oracle process
    - no repository or worktree path was present on the oracle sys.path
  note: >-
    Differential pytest runs execute GWexpy and the installed GWpy in the same
    pinned cell. The expected results were first established independently in
    the pristine oracle processes described here.

oracles:
  - environment: main
    python: 3.12.12
    gwpy: 4.0.1
    numpy: 1.26.4
    scipy: 1.13.1
  - environment: gwexpy
    python: 3.11.14
    gwpy: 4.0.2
    numpy: 1.26.4
    scipy: 1.12.0
oracle_version_difference: none observed in the Phase 3 fixture matrix

comparators:
  parent_spectral_exact:
    finite_rtol: 0.0
    finite_atol: 0.0
    exact:
      - shape
      - dtype
      - unit
      - name
      - channel
      - epoch jd1 and jd2
      - frequency axis values and unit
      - time axis values and unit when present
    nonfinite_masks:
      - isnan on real and imaginary components
      - isposinf on real and imaginary components
      - isneginf on real and imaginary components
  gwexpy_explicit_epsilon_formula:
    finite_rtol: 1.0e-12
    finite_atol: 0.0
    exact:
      - output unit
      - name
      - channel
  failure_outcome:
    exact:
      - success or failure
      - exception class

contracts:
  csd:
    issue: 698
    default: parent result and parent unit are authoritative
    same_unit_fixture: no-finding
    mixed_unit_fixture: fixed
    corrected_unit_opt_in_added: false
  rayleigh_spectrogram:
    issue: 699
    default: parent segment selection and numerical result are authoritative
    fixtures:
      even_exact_half_overlap: no-finding
      even_three_quarter_overlap: fixed
      odd_recommended_overlap: fixed
    corrected_route:
      visibility: private
      consumer: TimeSeries.rayleigh_test
      public_export_added: false
  transfer_function:
    issue: 702
    parent_compatible_routes:
      - steady with epsilon omitted
      - steady with epsilon=None
      - deprecated method=gwpy
      - deprecated method=csd_psd
      - deprecated method=auto with fftlength
    parent_operation: csd[:size] / psd[:size]
    exact_metadata:
      - unit
      - name
      - channel
      - epoch
    extensions_preserved:
      - steady with explicit numeric epsilon including 0.0
      - transient mode
      - transient alignment and downsampling
  regularity_guards:
    issue: 703
    parent_default_routes:
      TimeSeries.fft: parent AttributeError on a true irregular time axis
      TimeSeries.psd: parent AttributeError on a true irregular time axis
      TimeSeries.asd: parent AttributeError on a true irregular time axis
      TimeSeries.csd: parent AttributeError on a true irregular time axis
      TimeSeries.coherence: parent AttributeError on a true irregular time axis
      FrequencySeries.ifft: parent AttributeError on a true irregular frequency axis
    extension_guards_preserved:
      - TimeSeries.fft mode=transient
      - FrequencySeries.ifft mode=transient
      - TimeSeries.rfft
    terminal_fixtures:
      parametric_regular: no-finding
      explicit_regular_quantity_axis: no-finding
      true_irregular_seconds: GWpy-fails
      true_irregular_milliseconds: GWpy-fails
      nearly_regular_float_axis: GWpy-fails
      TimeSeries.rfft: GWexpy-only

from_gps_differential_evidence:
  parent_issue: 704
  terminal_application: deferred-to-phase4
  evidence_source:
    - docs/developers/plans/manifests/audit-manifest-v0.2.3-phase2.yaml
    - tests/time/test_gwpy_phase2_compat.py
  entries:
    ordinary_integer:
      proposed_terminal_state: no-finding
    numeric_string:
      proposed_terminal_state: no-finding
    scientific_numeric_string:
      proposed_terminal_state: no-finding
    ordinary_fractional_gps:
      proposed_terminal_state: no-finding
    half_microsecond_float:
      proposed_terminal_state: fixed
      issue: 704
      pre_fix: rounded to 125299 microseconds instead of the parent 125298
    LIGOTimeGPS_like:
      proposed_terminal_state: fixed
      issue: 704
      boundaries:
        - ordinary nanoseconds
        - 500 nanoseconds
        - 1500 nanoseconds
      pre_fix: rejected by the Astropy scalar route while the parent succeeded
    exact_leap_second_1167264017:
      proposed_terminal_state: GWpy-fails
      exception: ValueError
    ndarray_vectorization:
      proposed_terminal_state: GWpy-fails
      exception: TypeError
      gwexpy_extension_outcome: maps the parent scalar route element by element
    astropy_time_input:
      proposed_terminal_state: GWpy-fails
      exception: TypeError
      gwexpy_extension_outcome: successful vector conversion

