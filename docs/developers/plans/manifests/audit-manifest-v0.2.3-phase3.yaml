      gwpy_4_0_2: 57 passed, 1 pre-existing skip, 2 expected failures

physics:
  parent_finite_values: bit-identical in every parent-backed fixture
  mixed_unit_csd: >-
    The parent unit is intentionally preserved even where a cross-unit label
    may be scientifically preferable; a correction requires a later explicit
    opt-in.
  rayleigh: >-
    Public compatibility uses the parent segment count. The GWexpy-only
    rayleigh_test retains the corrected hop count, and its complete null-model,
    odd-length, segment-layout, and calibration suite remains green.
  explicit_epsilon: >-
    The existing regularized formula and physical response unit are preserved.
    A bare numeric epsilon still has an implicit PSD-scale interpretation and
    remains an explicit GWexpy-only option.
  transfer_epoch: >-
    Direct parent arithmetic preserves numerator axis authority and avoids the
    one-second drift observed when reconstructing a FrequencySeries from an
    Astropy Time epoch near GPS 1000.
  human_review: >-
    Historically approved on candidate
    c7b79db7fee2e646069679a0efe3d65c7ed4e562 and reapproved on current
    candidate 0a3d09a117827113b02e4a2ce73bccd3b1ba95d2 strictly for the
    mixed-unit CSD and public-Rayleigh parent-parity risks, including the
    finite-Monte-Carlo limitations.

