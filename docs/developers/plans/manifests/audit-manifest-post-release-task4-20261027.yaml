final_followup_20261027:
  findings:
    - An independent security review found that Jinja control tags inside YAML comment lines were removed before the restricted recipe parser checked them.
    - Scheduled resume had no observer to advance Docs and Pages from pending after deployment, leaving those objectives pending indefinitely.
    - The initial Pages completion test exposed that durable merge did not promote a reviewer-owned docs item from pending_review even when verified Pages and merged-PR evidence were present.
  red:
    - The YAML-comment Jinja conditional fixture failed before raw-line validation was added.
    - Docs/Pages state-transition and merge tests failed before the scheduled Pages observer and narrow pending_review-to-complete merge rule were added.
  changes:
    - Validate Jinja control syntax on original recipe lines before stripping YAML comments or skipping block scalar content.
    - Scheduled resume now verifies bilingual build-info, changelog presence, source-commit release assets, live asset hashes, the successful Pages workflow attempt, its public HTML/hash verification steps, and the merged default-branch PR association.
    - Pages delivery and Docs review advance independently; conda and Zenodo waits do not gate them, human decisions and blocks remain sticky, and evidence deduplicates on rerun.
    - Durable merge accepts the docs reviewer-owned pending_review-to-complete transition only when the docs observer emitted complete evidence and no human decision or block exists.
  verification:
