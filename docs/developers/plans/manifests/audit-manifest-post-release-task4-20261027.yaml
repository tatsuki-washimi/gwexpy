final_independent_review_followup_20261027:
  findings:
    - YAML explicit-indentation block scalars such as |2 and >+2 are ignored as data, not scanned for recipe identity.
    - The active source mapping must contain exactly one direct URL and sha256 at the same child indentation; the URL must resolve to the exact PyPI sdist filename and the direct digest must match its frozen distribution identity.
    - JSON-decoded prior Zenodo evidence must be an object; malformed snapshots block only the affected release and later versions continue.
    - Overall status must exactly match the precedence-ordered objective statuses. A stale aggregate is recomputed only when every objective state is well-formed; missing aggregate status remains invalid.
    - Non-whitelisted Jinja control structures and unsupported inline/flow `source` forms cannot supply active version, URL, or hash identity; the literal conda recipe `${{ version }}` placeholder is supported.
    - Jinja comment markers and quoted `source` keys are rejected before the restricted line reader can mistake commented or alternate YAML syntax for the active mapping.
  red:
    - Recipe identity only inside |2, >2, |2-, |-2, and >+2 block content is rejected.
    - Wrong sdist filename, foreign URL, duplicate source mapping, and mismatched direct hash are rejected.
    - null, array, and numeric Zenodo snapshots block v0.2.6 while v0.2.7 still completes its observer readback.
    - Both complete-over-pending and pending-over-complete aggregate states are rejected; a valid stale stored aggregate is normalized before merge/resume.
    - Jinja conditional/comment content and quoted/inline source mappings cannot hide a competing active URL/hash; `${{ version }}` resolves to the exact target sdist.
  verification:
    - command: conda run -n gwexpy pytest tests/test_post_release_observers.py tests/test_post_release_controller.py tests/test_post_release_qualification_workflow.py tests/test_publish_release_workflow.py -q
