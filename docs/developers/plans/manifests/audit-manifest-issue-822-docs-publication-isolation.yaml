schema: gwexpy-issue-822-docs-publication-isolation-v1
date_utc: 2026-10-26
issue: 822
related_issues:
  - 606
  - 821
source_base_sha: fd567f3cfacfdc5beaa1589c20588add832b7eb8
status: draft_pending_owner_adoption
change_summary: >-
  Separate read-only EN/JA Docs builds from write-capable gh-pages publishers.
  Bind same-run artifacts to the source SHA and full file-hash manifest; reject
  stale publication ordering before replacing either production or preview site.
implementation:
  artifact_schema: gwexpy-docs-pages-artifact-v1
  build_job_permissions: contents:read
  publish_job_permissions:
    - actions:read
    - contents:write
  source_binding: exact full commit SHA with clean bilingual build-info.json
  artifact_integrity:
    - pinned same-run artifact ID
    - upload/download digest mismatch fails the job
    - per-file SHA-256 inventory verified before gh-pages checkout
  publication_order:
    - current fetched main tip must equal the candidate SHA
    - deployed source SHA must be an ancestor of the candidate
    - intentional rollback is a new descendant commit with reverted Docs content
    - source tip is rechecked before gh-pages push
  legacy_preview_binding: >-
    Existing preview output predates build-info.json. Its latest gh-pages path
    commit has the historical deploy(preview): docs_redesign <source-SHA> subject;
    only that exact format is accepted, and the source SHA must exist in main
    history and be an ancestor of the candidate. Unknown state fails closed.
checks:
  - command: >-
      rtk proxy conda run -n gwexpy python -m pytest -q
      tests/docs/test_docs_pages_publish.py tests/docs/test_docs_conf_runtime.py
    result: exit 0; 18 passed
  - command: >-
      ruff check scripts/ci/docs_publish_guard.py
      tests/docs/test_docs_pages_publish.py tests/docs/test_docs_conf_runtime.py
    result: exit 0; all checks passed
  - command: >-
      ruff format --check scripts/ci/docs_publish_guard.py
      tests/docs/test_docs_pages_publish.py tests/docs/test_docs_conf_runtime.py
    result: exit 0; 3 files already formatted
  - command: >-
      rtk proxy conda run -n gwexpy mypy scripts/ci/docs_publish_guard.py
      --ignore-missing-imports
    result: exit 0; success, no issues found in 1 source file
  - command: git diff --check
    result: exit 0
  - command: >-
      isolated A-to-B-to-stale-A, idempotent B, descendant rollback C, legacy
      preview commit binding, unknown legacy state, artifact tampering, and
      bilingual source mismatch regression tests
    result: exit 0 within the 18 focused tests; no production gh-pages write
omitted:
