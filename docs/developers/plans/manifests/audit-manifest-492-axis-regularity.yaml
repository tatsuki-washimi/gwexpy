scope:
  summary: "Make AxisDescriptor linear-regularity detection scale-aware without changing coordinate-order validity."
  runtime_code_changed: true
  public_api_changed: false
  physics_behavior_changed: false
  metadata_behavior_changed: false
decisions:
  - "Compare represented linear coordinate intervals with rtol=2e-14."
  - "Use an absolute tolerance of one ULP at the largest represented interval magnitude in the input floating dtype."
  - "Bound ordinary float64 accumulated round-off with rtol=2e-14, while not deriving the absolute tolerance from the coordinate offset."
  - "Use equal_nan=False and classify non-finite coordinates as irregular without rejecting construction."
  - "Preserve integer coordinate dtype and compare integer intervals exactly using Python integers to avoid float precision loss and unsigned-difference overflow."
  - "Preserve complex coordinate dtype so regularity comparison includes imaginary components."
  - "Keep equal-ratio logarithmic axes irregular under the linear-spacing contract."
  - "Preserve descending, repeated, and non-finite coordinate acceptance at AxisDescriptor construction."
  - "Document that only iloc_slice start/stop bounds require an ascending axis."
