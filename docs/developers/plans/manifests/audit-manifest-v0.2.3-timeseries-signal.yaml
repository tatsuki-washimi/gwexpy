physics:
  numerical_authority: >-
    Default numerical kernels are the installed GWpy implementations. Finite
    heterodyne, demodulate, RMS, and resample payloads are bit-identical in all
    differential fixtures.
  heterodyne_and_demodulate_unit: >-
    GWpy finalization labels complex and amplitude trends dimensionless even
    when the input has a physical unit. v0.2.3 intentionally preserves that
    observable public behavior; a physically motivated alternative must be a
    later explicit opt-in.
  demodulate_quantity_semantics: >-
    GWpy accepts arbitrary frequency Quantity units but discards the unit when
    converting its generated phase to an ndarray. Consequently 1000 mHz is
    treated with raw magnitude 1000 rather than converted to 1 Hz, while
    dimensionless and even length Quantities also succeed. v0.2.3 preserves
    this behavior exactly and does not reinterpret parent-supported inputs.
  rms_float32: >-
    GWpy squares float32 input without promotion, so sufficiently small finite
    amplitudes underflow to zero. The default now preserves that behavior. The
    explicit ignore_nan=true extension retains promoted arithmetic.
  resample_axis: >-
    The parent-selected samples, cadence, and visible epoch are unchanged. The
    private exact integer-nanosecond epoch augmentation is restored afterward.
  exact_time: >-
    Derived signal trends keep the supplied integer-nanosecond epoch and set
    private cadence authority from their visible dt, so slicing advances by
    the output stride rather than the input sample period.
  human_review: >-
    Approved on candidate c7b79db7fee2e646069679a0efe3d65c7ed4e562
    for dimensionless trend units, raw-magnitude frequency Quantity semantics,
    and float32 RMS underflow parity.

