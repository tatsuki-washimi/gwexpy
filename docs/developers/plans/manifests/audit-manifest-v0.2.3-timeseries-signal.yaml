  GWpy implementation rather than copied constants.

implementation_groups:
  heterodyne:
    id: 5a5dee
    issues: [639, 704]
    terminal_state: fixed
    pre_fix:
      - unit was inherited from the input instead of becoming dimensionless
      - scalar and two-dimensional phase inputs raised TypeError instead of ValueError
      - stride default and public annotations differed from GWpy
      - all Quantity strides were normalized, changing parent-supported dimensionless behavior
      - exact output cadence authority remained at the input sample period
    default_route: direct installed GWpy implementation
    parent_quantity_routes:
      - dimensionless Quantity stride is passed unchanged
      - non-time dimensionful Quantity stride is passed unchanged, preserving parent failure
    explicit_extensions:
      - only a time-equivalent Quantity stride, which raises parent TypeError, is classified before the parent call and converted to seconds
    exact_time_augmentation: >-
      Exact input epoch authority is retained and output cadence authority is
      derived from the parent result, including after slicing.
  demodulate:
    id: 8ea74
    issues: [639, 704]
    terminal_state: fixed
    pre_fix:
      - the non-GWpy phase parameter changed positional and keyword binding
      - exp and deg were not keyword-only and appeared in the wrong order
      - complex and amplitude outputs inherited the input unit
      - frequency Quantities were converted to Hz, changing GWpy raw-magnitude behavior
      - all Quantity strides were normalized instead of preserving parent routes
      - exact output cadence authority remained at the input sample period
    default_route: direct installed GWpy implementation
    parent_quantity_routes:
      - every frequency Quantity is passed unchanged, including mHz, dimensionless, and length units
      - dimensionless and non-time dimensionful Quantity strides are passed unchanged
      - GWpy strips the frequency unit through its phase array conversion and uses the raw magnitude
    explicit_extensions:
      - only a time-equivalent Quantity stride, which raises parent TypeError, is classified before the parent call and converted to seconds
    exact_time_augmentation: >-
      Complex, amplitude, degree-phase, and radian-phase outputs retain the
      exact input epoch and derive their exact cadence from the parent result.
  rms:
    id: c7b130
    issues: [451, 639, 704]
    terminal_state: fixed
    pre_fix:
      - NaNs were omitted by default instead of propagated
      - integer stride names were rendered with a forced decimal suffix
      - zero, sub-sample, irregular-axis, float32, and unnamed outcomes differed
      - default and explicit ignore_nan outputs reconstructed a rounded large epoch
    default_route: direct installed GWpy implementation when ignore_nan is omitted or false
    explicit_extensions:
      - ignore_nan=true retains finite-sample windowing and promoted arithmetic
    exact_time_augmentation: >-
      Both default and ignore_nan=true results retain the exact input epoch and
      derive exact output cadence, including slice advancement.
  resample:
    id: 8c5dcc
    issues: [639, 703, 704]
    terminal_state: fixed
    pre_fix:
      - numeric signature hid window, ftype, and n behind variadic arguments
      - an early regularity guard changed true-irregular failure from AttributeError to ValueError
      - numeric calls silently consumed the time-bin-only ignore_nan keyword
    default_route: direct installed GWpy implementation for numeric and frequency-Quantity rates
    exact_time_augmentation: >-
      Existing integer-nanosecond epoch state is restored on the parent result
      without changing the GWpy-visible time axis.
    explicit_extensions:
      - string time-bin rule
      - time Quantity bin rule

