  decision: >-
    The human physics reviewer accepted this contract and judged it better than
    the original markdown proposal.

contract:
  supported_operands:
    multiplication_and_division: [python_scalar, numpy_scalar, scalar_Quantity, Unit]
    addition_and_subtraction: [python_scalar, numpy_scalar, scalar_Quantity]
  constraints:
    - "Bare scalar addition/subtraction requires dimensionless components."
    - "Quantity addition/subtraction requires units equivalent to every component."
    - "Unit is restricted to multiplication and division."
    - "ndarray, container operands, and direct NumPy ufuncs fail closed."
    - >-
      "FieldList + [] fails closed, but [] + FieldList retains Python's
      unavoidable left-list concatenation behavior and returns a built-in list."
    - "Supported in-place operations compute all component results before replacing any component."
  preserved:
    - collection subclass
    - VectorField basis
    - TensorField rank
    - key order
    - component name, unit, values, axes, and domain metadata

design_decisions:
  quantity_dispatch: >-
    Field collections use a higher __array_priority__ and explicit reflected
    operators so that Quantity * collection and Unit * collection retain the
    collection rather than returning a bare Quantity.
  ufunc_policy: >-
    FieldDict and FieldList set __array_ufunc__ to None.  ScalarField retains
    its existing ufunc implementation because this issue concerns collection
    dispatch and ScalarField arithmetic is an established GWpy-compatible API.
  rollback: >-
    _inplace_operation builds a complete replacement collection before the
    original dict/list is modified.  A dimensional incompatibility therefore
    raises UnitConversionError without a partial component update.
  list_family_compatibility: >-
    TimeSeriesList, FrequencySeriesList, and SpectrogramList use native-list
    binary concatenation/repetition semantics and return a built-in list.
    HistogramList deliberately rejects repetition because it would duplicate
    measurements.  FieldList implements its separate, signed-off physical
    arithmetic contract.

physics_validation:
  dimensional_analysis:
    - "V * m yields V m for Quantity/Unit multiplication."
    - "V / m and m / V are preserved for both division directions."
    - "1000 mV added to a V component yields a V result with converted value."
  rejection:
    - "V plus s raises UnitConversionError before any collection replacement."
    - "A bare scalar cannot be added to a unitful component."
  excluded: "No Fourier, PSD, or domain-transform algorithm changes."

