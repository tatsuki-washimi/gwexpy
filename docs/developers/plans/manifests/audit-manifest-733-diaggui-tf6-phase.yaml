behavior:
  external_repair: "Requires one matching raw Result[n]/TransferFunction/Subtype=6 candidate for the pair, external subtype_raw=6, matching ChannelA and ChannelB, exact FHz and t0 equality, and xfer equal to either raw complex64 values or their real projection."
  native: "Retains the native complex64 decode and runs the same raw candidate/collision preflight for requested TF products."
  collision_policy: "Rejects same-pair subtype 6 combined with TF/0 or TF/3 in either XML order; also rejects duplicate TF/6 candidates and multiple raw TF result blocks sharing a TF/6 ChannelA parser key."
  reference_policy: "Rejects an external TF/6 Reference[n] result with a subtype-specific ValueError before returning its real-only values."
  axis_policy: "Constructs repaired external FrequencySeries with explicit raw frequencies= to avoid near-uniform classification rounding a serialized float64 bin."

