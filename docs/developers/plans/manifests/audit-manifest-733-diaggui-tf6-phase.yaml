scope:
  summary: >-
    Recover the characterized, single-row TransferFunction subtype 6 response
    from its serialized stream when dttxml 1.1.8 returns a matching real-only
    projection. Reject collisions and identities/layouts that cannot authorize
    that recovery.
  included:
    - "External and native TF preflight for same-pair TF/0 or TF/3 plus TF/6 ambiguity."
    - "External TF/6 phase recovery only for a unique Result[n] raw block whose subtype, ChannelA, ChannelB, axis, epoch, and real projection match the dttxml object."
    - "Preserve exact serialized float64 frequency values through FrequencySeries and FrequencySeriesMatrix construction."
    - "Fail closed for duplicate candidates, ambiguous ChannelA parser keys, missing subtype identity, mismatched parser identity, malformed streams, unsupported byte order, unsupported row count, and TF/6 Reference results."
  excluded:
    - "No TF/6 Reference recovery; dttxml 1.1.8 exposes reference TF results with decorated ChannelA identity, and this route is not independently characterized for phase repair."
    - "No support claim for M != 1, doubleComplex, non-little-endian streams, or layouts other than float64 frequency words followed by complex64 samples."
    - "No claim about transfer-function direction, units, conjugation, calibration meaning, or normalization."
    - "No TF matrix epoch guarantee for multiple Result blocks with differing t0 values."

