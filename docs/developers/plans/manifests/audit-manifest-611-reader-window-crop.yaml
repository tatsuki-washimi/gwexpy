superseded_in_v0_2_3:
  scope: generic TimeSeriesDict HDF5 gap and coverage outcomes only
  reason: >-
    The v0.2.3 patch policy makes installed-GWpy success/failure and selected
    samples authoritative for counterpart APIs. The earlier fast-path
    divergence below was explicitly deferred to v0.2.0 and can no longer remain
    an implicit default extension. The one completely disjoint successful-read
    outcome described below is now a named, human-approved safety exception,
    not a general restoration of that earlier fast path.
  replacement_contract: >-
    Plain format="hdf5" delegates names, group, start, end, gap, pad,
    open-handle, and merge outcomes to the installed GWpy 4.0.x public reader.
    Exception classes are compared; message text is not contracted. Only after
    a successful parent read, a mathematically completely disjoint explicit
    start/end window is converted to a zero-length entry under the named
    non_intersecting_window_safety exception. Partial overlap, pad, parent
    errors, keys/order, lifecycle, explicit GWexpy collection-manifest route
    selection, exact-time sidecar route selection, and all outcomes outside the
    named safety subcase retain their contracts.
  compatibility_exception:
    name: non_intersecting_window_safety
    inventory_state: fixed
    runtime_freeze: 8bfe36f9684989188c2f32e65ba429fe8bdfaf29
    evidence_hardening:
      - 012f49b02adddaebc732df49f51f101db653d150
      - ceb14862d86f15f04f80c408f094995845dd4bab
    before: >-
      GWpy 4.0.1/4.0.2 can return eight samples wholly outside the requested
      interval because a negative stop index wraps.
    after: >-
      GWexpy returns a zero-length, key-preserving entry only for that complete
      non-intersection and drops private exact-time authority from the
      safety-created empty.
  evidence:
    - tests/io/test_gwpy_override_terminal_io.py::test_timeseriesdict_read_matches_gwpy
    - tests/io/test_reader_start_end_contract.py::TestChannelsThatDoNotCoverTheWindow
    - tests/io/test_reader_start_end_contract.py::TestWindowsTheFileDoesNotCover
    - tests/io/test_reader_start_end_contract.py::TestNonNanosecondGrids
    - tests/io/test_hdf5_timeseries_family.py::test_native_hdf5_auto_read_keeps_disjoint_window_safety
  human_data_model_signoff:
    status: approved
    decision_date: "2026-09-03"
    approver_role: release owner
    scope: >-
      The non-nanosecond HDF5 request ending before the stored data returns
      eight outside-window samples in both installed GWpy oracles. The release
      owner approved the zero-length safety result because the mathematical
      intersection is empty; this approval does not extend to partial overlap,
      padding, parent errors, or any other API result.
    evidence:
      - tests/io/test_reader_start_end_contract.py::TestNonNanosecondGrids::test_window_before_data_with_non_ns_epoch_returns_metadata_empty

# Recorded as a repo-relative marker on purpose: this file is published, and an
# absolute worktree path leaks a local username and does not reproduce.
worktree: "<local worktree for branch codex/v0113-lane-h>"

contract:
  summary: >-
    Every TimeSeries reader either applies start/end (result equals
    full_read.crop(start, end)) or raises IoNotImplementedError. Accepting and
    ignoring them is the defect; warning and returning the full span is not an
    acceptable substitute.
  applies:
    [nc, netcdf4, zarr, "generic hdf5 (TimeSeries and TimeSeriesDict)", hdf.ndscope,
     wav, audio, ats, csv, gbd, tdms, sdb, mseed, sac, gse2, knet,
     "collection directory (TimeSeriesDict and TimeSeriesList)",
     "TimeSeriesList from hdf5"]
  rejects: [ats.mth5, xml.diaggui]
  unchanged: [gwf, win, "stub formats"]
  rejects_rationale: >-
    Only these two lack any in-repo fixture (ats.mth5 needs an mth5-conformant
    filename, xml.diaggui a real DiagGUI product file), so a windowed result
    could not be verified before shipping. Every other backend reads whole files
    already, making the crop the same two lines used everywhere else.

# Every row of the contract table was executed against a fixture, not inferred
# from source. The first pass of this audit classified from source alone and got
# three rows wrong; see the report appendix.
method: executed_against_fixtures
fixture: "10 samples @ 10 Hz, span [0.0, 1.0); bounds (0.2, 0.5); oracle = 3 samples"
inferred_not_executed:
  - ats.mth5   # no usable fixture in-repo
  - dttxml     # checked-in xml is a stub; fails before selectors are examined

lane_n_scope_correction:
  planned_files: [gwexpy/timeseries/io/hdf5.py, gwexpy/timeseries/io/__init__.py]
  actual_file: gwexpy/timeseries/collections.py
  reason: >-
    gwpy's read_hdf5_dict forwards kwargs correctly; the bounds were dropped by
    GWexpy's own TimeSeriesDict.read override, whose hdf5 branch reopens the file
    and re-reads each dataset without them. gwexpy/timeseries/io/hdf5.py is a
    45-line re-export shim and contains no defect.

breaking_changes: []
breaking_changes_note: >-
  An earlier revision made nine backends refuse start/end, which would have been
  a breaking change for gbd and sdb (their docstrings advertised the selectors as
  "accepted and ignored") and a gwpy-compatibility regression for wav and csv,
  whose gwpy counterparts crop. Those backends now crop instead, so no public
  behaviour is removed: arguments that were silently dropped now work.

second_review_round:
  # Three read-only reviewers (physics, python-quality, gwpy-compatibility)
  # over the frozen first commit; every finding re-measured in-session before
  # being acted on. 19 regression tests added; 10 fail against the first fix.
  - id: clamp-synthesised-bounds-lose-the-final-sample
    severity: CRITICAL
    measured: >-
      GWexpy's crop wrapper round-trips bounds through to_gps (integer ns); a
      synthesised span edge like 64/30 s rounds down, so a start-only read
      returned 47 samples where full_read.crop(start) returns 48 (hdf5, zarr,
      csv, wav). Same mechanism re-created the negative-index wrap at a
      non-ns t0 (nine samples for a window before the data) and a spurious
      "crop given end larger" warning.
    action: >-
      _crop_to_span never synthesises a bound: missing/out-of-span sides are
      forwarded as None, empty intersections are built by direct slicing
      (matrix: its own searchsorted crop). Pinned by TestNonNanosecondGrids.
  - id: fast-paths-crash-on-documented-bound-types
    severity: HIGH
    measured: >-
      TimeSeriesDict.read(..., start=0.2*u.s) raised TypeError and a date
      string raised ValueError on the bypass branches, while the registry
      path (which runs to_gps first) handled both.
    action: >-
      apply_time_selection normalises bounds once at its entry (numeric input
      passes through float() untouched). Pinned by TestBoundTypes.
  - id: headerless-csv-in-span-read-raises
    severity: HIGH
    measured: >-
      TimeSeriesDict.read(csv, start=0.5, end=1.5) on a headerless 2-column
      file raised ValueError from gwpy 4's registry coverage check: the
      median-of-diffs dt carries ~1 ulp of decimal-parse noise, enough for
      crop to land one sample early. gwpy's own ascii reader succeeds.
    action: >-
      csv dt reconstruction prefers the end-to-end average when it agrees
      with the median (uniform grid); median kept for gappy columns. Also
      removes the 1-sample offset vs gwpy on the bypass single-series path.
      Pinned by TestHeaderlessCsv.
  - id: minor
    detail: >-
      provenance dict now copied instead of aliased (TestProvenanceCopy);
      docstring exception corrected (TypeError, not UnitConversionError);
      hasattr(data, "items") replaced by isinstance(data, MutableMapping);
      report over-generalisation about crop dt perturbation corrected.
  - id: verified-clean
    detail: >-
      IoNotImplementedError propagation through the astropy/gwpy registry
      (no swallow-and-fallback path, verified against source and by
      execution); wav bit-parity with gwpy including out-of-span
      warning/pad behaviour; no new nproc/gwpy.io.mp/gprint usage.

review_driven_corrections:
  - id: fail-closed-was-wrong-for-most-backends
    measured: >-
      gwpy.timeseries.io.wav.read(path, start=0.2, end=0.5) on a 1000-sample file
      returns 300 samples spanning [0.2, 0.5). GWexpy shadows the wav format, so
      refusing would return an error where the base library returns correct data.
    action: nine backends moved from reject to apply
  - id: crop-negative-index-wraparound
    measured: >-
      A series spanning [10, 20) cropped to (0.2, 0.5) returns 5 samples covering
      [10.0, 10.5). gwpy's Series.crop computes floor((end - x0)/dx) with no guard
      for end < x0; the negative index wraps from the end of the array.
    action: >-
      apply_time_selection clamps each series to its own span before cropping,
      mirroring gwpy's own read_hdf5_timeseries. Pinned by
      TestChannelsThatDoNotCoverTheWindow.
  - id: remaining-silent-ignore-holes
    measured: >-
      TimeSeriesDict.read(collection_dir, start=, end=) and
      TimeSeriesList.read(hdf5, start=, end=) both returned all 10 samples.
    action: both branches now crop; TimeSeriesList coverage added to the tests
  - id: provenance-dropped-on-windowed-read
    measured: "_gwexpy_io present on a full read, absent on a bounded read"
    action: apply_time_selection carries provenance across explicitly

out_of_scope_findings:
  - id: zarr-first-channel-nondeterministic
    detail: >-
      zarr open_group().keys() is not order-stable, so read_timeseries_zarr
      ("return the first channel") returns a different channel on repeated reads
      of the same store, and read_timeseriesdict_zarr key order varies.
    measured_at_base: true
    introduced_by_this_change: false
    action: needs its own issue
  - id: gap-pad-divergence-on-early-return-paths
    detail: >-
      zarr and generic hdf5 bypass the gwpy registry via early-return branches in
      TimeSeriesDict.read, so they do not get gwpy's gap="raise" coverage check
      and do not honour pad/gap. nc and hdf.ndscope do.
    action: pinned by tests; unify in v0.2.0 reader-contract work
  - id: backend-pushdown
    detail: >-
      read-whole-then-crop is intentional for a bug-fix release; slice pushdown is
      a v0.2.0 performance change. ObsPy's read() natively accepts
      starttime/endtime, so seismic is the easiest candidate.
  - id: crop-perturbs-dt-by-one-ulp
    detail: >-
      A series with dt=0.1 cropped anywhere returns dt=0.10000000000000003; crop
      re-derives dx from the sliced index. Breaks the project's
      assert result.dt == input.dt metadata rule.
    measured_at_base: true
    introduced_by_this_change: false
  - id: timeseriesdict-crop-drops-provenance
    detail: >-
      TimeSeriesDict.crop builds a fresh instance and never copies _gwexpy_io.
      Worked around inside apply_time_selection; direct callers of crop still
      lose it.
    measured_at_base: true
    introduced_by_this_change: false
  - id: netcdf4-lossy-t0-and-dt-roundtrip
    detail: >-
      The writer quantises dt to integer nanoseconds, so 1/16384 s becomes
      61035 ns (-2.6e-6 relative), accumulating to ~172 samples of offset over
      4096 s; a separate defect shifts t0=10.0 to 9.0 on write/read. Writer-side
      and pre-existing, but these now decide which samples a windowed read
      returns rather than only the reported axis.
    measured_at_base: true
    introduced_by_this_change: false
  - id: reject-message-names-canonical-format-not-alias
    detail: >-
      format="miniseed" reported 'mseed', sqlite3 reported 'sdb', dttxml reported
      'xml.diaggui'. Cosmetic, and now affects only the two refusing backends.
  - id: ats-mth5-routing
    detail: >-
      collections.py direct_readers maps format="ats.mth5" to
      read_timeseriesdict_ats (the native header parser), so the mth5-specific
      reader is never reached through TimeSeriesDict.read. Pre-existing routing
      bug, unrelated to selectors, found while tracing them.

