tests_fail_on_base: 49
tests_fail_on_base_note: >-
  Reproducing this needs care: pyproject.toml sets pythonpath = ["."] under
  [tool.pytest.ini_options], which pytest places at sys.path[0] and which
  silently defeats a PYTHONPATH= override whenever the test file lives under the
  worktree. Copy the test file to a directory with no pytest config to make the
  base comparison real.
second_round_tests_fail_on_first_fix: 10
second_round_tests_note: >-
