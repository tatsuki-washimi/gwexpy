compatibility_summary:
  current_gwpy_source: >-
    GWpy 4.0.1 uses int(stride * sample_rate.value), drops trailing partial
    windows, computes sqrt(mean(abs(window)**2)), allocates np.zeros(nsteps),
    and constructs self.__class__ with sample_rate=1/stride, t0, channel, and
    a formatted name.
  gwexpy_matches: >-
    Numeric stride conversion, floor windowing, sqrt(mean(abs(x)**2)) values,
    float64 output dtype for float32 and complex64 input, complex values,
    output class, t0, dt, sample_rate, channel, and integer/float numeric name
    formatting match GWpy 4.0.1 in committed tests.
  intentional_gwexpy_extensions: >-
    Input unit is preserved; time and dimensionless Quantity strides are
    accepted; irregular, sub-sample, zero, and negative strides raise clear
    ValueError exceptions.
  documentation: >-
    Scalar RMS tutorial call sites remain explicit NumPy reductions, the
    generic Series/Matrix RMS tests remain separate from TimeSeries.rms, and
    the compatibility note records the float64 dtype contract.

