evidence:
  - source: "numpy 2.4.2 / astropy 7.2.0 / gwpy 4.0.1 (conda env gwexpy)"
    finding: >-
      An ndarray subclass with __array_ufunc__ = None raises
      "operand does not support ufuncs" from the *inherited* operators rather
      than returning NotImplemented, so every supported dunder must be
      declared explicitly.  Measured with /tmp/laned_probe1.py.
  - source: /tmp/laned_probe2.py
    finding: >-
      With explicit dunders declared, Quantity/Unit/int/float/np.float64/
      ndarray on the left all reflect into the subclass for *, +, -, and the
      four ordering comparisons.  == and != never reflect.
  - source: gwexpy/types/seriesmatrix_base.py (pre-change lines 566-581)
    finding: >-
      The uniform-unit metadata fast path was dead code: the guard
      `np.all(meta_mat.units == first.unit)` compares an object ndarray with a
      single Unit, which evaluates to the scalar False.  Traced with
      /tmp/laned_probe_uniform2.py, where np.full was never reached.  The path
      was removed rather than repaired, which resolves #577a and #577b by
      construction.
  - source: /tmp/laned_baseline.py (run before and after the change)
    finding: >-
      Before: `(2*u.s) * fsm` returned a bare Quantity with unit s;
      `sgm(unit=m) + 1*u.cm` produced 2.0 m.  After: both keep the matrix type
      with units V s and the value 1.01 m respectively.
  - source: /tmp/laned_probe_ufunc_matrix.py
    finding: >-
      With the opt-out in place but no method overrides, `np.clip(m, ...)` fell
      through NumPy's _wrapfunc/_wrapit path and returned an object whose
      `meta` was literally the source's object.  Explicit clip/round/conj/
      cumprod overrides were added to close that aliasing hole.

design_decisions:
  577a_metadata_aliasing: >-
    Resolved by deleting the dead uniform fast path and by rebuilding metadata
    cell by cell (_copy_meta_cells) instead of using MetaDataMatrix.copy(),
    which only duplicates object references.
  577b_per_cell_names: >-
    Resolved with 577a.  The remaining per-cell path already takes each cell's
    own name/channel, so the uniform and non-uniform cases now agree.  A
    regression test asserts both.
  577c_out_and_where: >-
    They are no longer silently discarded.  _ufunc_dispatch raises TypeError
    when `out` is given or `where` is not True.  `np.multiply(a, b, out=c)`
    itself now raises at the NumPy level because of the opt-out, so it cannot
    be made to update `c`; this deviates from the plan's acceptance item, which
    is unachievable under option A.  The user-facing half of the defect -- that
    `a *= b` was not actually in place -- is fixed and tested by asserting that
    an aliasing view of the buffer observes the change.
  577d_non_call_methods: >-
    Documented and made explicit rather than supported.  reduce/accumulate/at
    on a matrix now raise TypeError at the NumPy level instead of silently
    dropping metadata, and _ufunc_dispatch raises TypeError for any method
    other than "__call__".  The reduction-shaped public methods
    (sum/prod/cumsum/cumprod/any/all) are provided as documented metadata-free
    overrides so the public API does not regress.
  577e_power: >-
    _ufunc_meta_operands passes the raw exponent to the metadata layer instead
    of broadcasting it into a dimensionless matrix, so `matrix ** 2` now yields
    V**2 and matches np.square on the raw values.  A non-scalar exponent is
    accepted only when every base unit is dimensionless; otherwise it raises
    UnitConversionError, because one unit per cell cannot express a per-sample
    exponent.
  577e_power_correction_2026_08_04: >-
    The scalar-exponent classifier (_scalar_power_exponent) excluded
    bool/np.bool_ (`return None` instead of the integer value), which routed
    `matrix ** True` and `matrix ** False` into the non-scalar,
    dimensionless-only branch above and made them raise UnitConversionError
    for any non-dimensionless matrix -- a regression against Python/NumPy
    semantics (True == 1, False == 0) introduced by this lane, not a
    pre-existing defect. Fixed by returning int(operand) for bool/np.bool_,
    so `matrix ** True` preserves the original value and unit and
    `matrix ** False` yields value 1 with a dimensionless result, matching
    `matrix ** 1` / `matrix ** 0`. See merge_blocker_corrections_2026_08_04.
  577f_unary_table: >-
    Extended rather than merely documented.  metadata.py now has three tables:
    _UFUNC_UNIT_PRESERVING (abs, fabs, negative, positive, real, imag,
    conjugate, floor, ceil, trunc, rint), _UFUNC_TRANSCENDENTAL (exp, exp2,
    expm1, log, log2, log10, log1p, sin, cos, tan, arcsin, arccos, arctan,
    sinh, cosh, tanh, arcsinh, arccosh, arctanh) and _UFUNC_UNARY_POWERS
    (sqrt 0.5, square 2, cbrt 1/3, reciprocal -1).  np.sign is deliberately
    absent so that MetaData does not contradict the matrix layer, which treats
    sign as a unit-preserving pass-through.
  add_sub_unit_policy: >-
    check_add_sub_compatibility now requires equivalence instead of identity,
    and convert_add_sub_values rescales each cell into the first operand's
    unit.  The left operand fixes the result unit, matching astropy:
    m + cm stays in metres, cm + m stays in centimetres.

