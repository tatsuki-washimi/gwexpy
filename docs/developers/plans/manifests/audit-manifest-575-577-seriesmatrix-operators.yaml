contract_results:
  issue_575_acceptance: >-
    PASS for (2*u.s)*m, m*(2*u.s), u.s*m, m*u.s, 2*m, np.float64(2)*m and a
    plain ndarray on the left, parametrized over TimeSeriesMatrix,
    FrequencySeriesMatrix and SpectrogramMatrix.  rows, cols, per-cell units,
    per-cell names, the sample axis and name are all preserved and V*s composes
    correctly.
  issue_576_acceptance: >-
    PASS. sgm(unit=m) + 1*u.cm now adds 0.01 m (measured value 1.01), and the
    reflected form 1*u.cm + sgm(unit=m) yields 101 cm, i.e. the same physical
    quantity with the left operand's label.  Incompatible units (m vs s) raise
    UnitConversionError.
  issue_576_acceptance_correction_2026_08_04: >-
    RETRACTED as an unqualified PASS. The add/sub/comparison behaviour
    described directly above is still correct and unchanged -- this
    correction narrows the claim, it does not reverse it. A maintainer-driven
    merge-blocker audit on 2026-08-04 found that SpectrogramMatrix.clip()
    carried an unfixed instance of the exact defect #576 targeted ("ignore
    the unit, operate on the raw value"): a bare-number bound such as
    `clip(1, 2)` was silently accepted against a unit-bearing matrix while an
    equivalent-but-differently-scaled Quantity bound (e.g. clip(1*u.cm,
    2*u.cm) against a metre matrix) was handled incorrectly -- the inverse of
    the intended contract. #576 is therefore PASS only for the operators
    covered by issue_576_acceptance above (add, sub, comparison); it was not
    exhaustively closed across every operation that shares the same defect
    class. See merge_blocker_corrections_2026_08_04 below for the fix,
    its tests, and the corrected clip() unit contract.
  issue_577a: "PASS: result metadata cells are distinct objects; mutating one leaves the others and the source unchanged."
  issue_577b: "PASS: per-cell names and channels survive both the uniform and the non-uniform unit case."
  issue_577c: >-
    PARTIAL by design.  out=/where= are rejected instead of discarded, and
    in-place operators genuinely write the buffer.  np.multiply(a, b, out=c)
    cannot update c under option A; it raises TypeError.
  issue_577d: "PASS as documented: ufunc methods other than __call__ raise; the reduction methods are explicit overrides."
  issue_577e: "PASS: matrix ** 2 yields V**2 and matches np.square on the raw values."
  issue_577f: "PASS: the unary tables were extended and the omission of sign is documented."
  in_place_atomicity: "PASS for incompatible unit, zero divisor, bad shape and unsafe dtype; values and units are byte-identical afterwards."
  comparisons: "PASS: same subclass, bool dtype, dimensionless units, deep-copied per-cell metadata."
  zero_division: "PASS for /, //, %, divmod and the reflected form; the operand is left intact."
  zero_division_correction_2026_08_04: >-
    The PASS above described that //, %, and divmod raised ZeroDivisionError
    without corrupting the operand; that remains true for the
    dimensionless case. It did not disclose that all three also silently
    ignored units on non-zero divisors (a separate defect from zero
    division, found in the same 2026-08-04 audit): //  and % copied the
    left operand's unit onto the result without ever converting the raw
    values into a common unit first, and divmod (composed from // and %)
    inherited the same defect. Fixed: divmod is reverted to an explicit
    TypeError (unsupported, matching its pre-#623 behaviour on main --
    not a functional regression), and unit-bearing operands to // and %
    now raise TypeError explicitly instead of computing a silently wrong
    value. Dimensionless // and % are unaffected and keep working. See
    merge_blocker_corrections_2026_08_04 below.
  reductions: "PASS: sum, prod, cumsum, cumprod, any, all return plain NumPy values with no warning and match np.asarray(matrix).<op>()."
  quantity_left_equality: >-
    Pinned as astropy behaviour, not as a gwexpy contract: == and != never
    reflect.  Incompatible units short-circuit to a scalar bool; a successful
    conversion yields a bare ndarray.  SpectrogramMatrix exposes a single
    .unit so a V Quantity converts, while the 3-D classes look dimensionless.

api_reduction_disclosure:
  note: >-
    Direct NumPy ufunc application to a matrix now raises TypeError.  This is
    a public API reduction shipping in a patch release; Lane Z owns the
    CHANGELOG entry.  The table below was produced by /tmp/laned_disclosure.py
    against the modified tree.
  note_correction_2026_08_04: >-
    The two rows below for np.floor_divide and np.mod/np.remainder are now
    only accurate for a dimensionless matrix. As of the 2026-08-04
    merge-blocker fixes, `m // x` and `m % x` themselves raise TypeError
    when m is unit-bearing and x is not equivalent-unit-dimensionless
    (see zero_division_correction_2026_08_04 above) -- there is no operator
    alternative for a unit-bearing floor-divide/modulo in v0.1.x, only an
    explicit failure. A correct unit-aware implementation is deferred to the
    v0.2.0 semantic redesign (#637). np.divmod was never listed here because
    it has no ufunc form for a subclass with __array_ufunc__ = None; the
    explicit __divmod__/__rdivmod__ this lane added has since been removed
    and divmod(m, x) now raises TypeError unconditionally, matching main's
    pre-#623 behaviour (not a functional regression). For finiteness checks
    (np.isfinite, listed below with no operator alternative), the officially
    documented v0.1.13 idiom is `mask = np.isfinite(matrix.value)`; v0.2.0 may
    add matrix.isfinite()/matrix.isnan() returning shape-preserving boolean
    matrices, but no new API is added in this patch release.
  with_alternative:
    - {lost: "np.abs / np.absolute", alternative: "abs(m), m.abs()"}
    - {lost: "np.negative", alternative: "-m"}
    - {lost: "np.positive", alternative: "+m"}
    - {lost: "np.conj / np.conjugate", alternative: "m.conj(), m.conjugate()"}
    - {lost: "np.sqrt", alternative: "m ** 0.5"}
    - {lost: "np.square", alternative: "m ** 2"}
    - {lost: "np.add / np.subtract", alternative: "m + x, m - x"}
    - {lost: "np.multiply / np.divide", alternative: "m * x, m / x"}
    - {lost: "np.floor_divide", alternative: "m // x (dimensionless only as of 2026-08-04; see note_correction_2026_08_04)"}
    - {lost: "np.mod / np.remainder", alternative: "m % x (dimensionless only as of 2026-08-04; see note_correction_2026_08_04)"}
    - {lost: "np.power", alternative: "m ** x"}
    - {lost: "np.matmul", alternative: "m @ other"}
    - {lost: "np.rint", alternative: "m.round()"}
    - {lost: "comparison ufuncs (np.less etc.)", alternative: "<, <=, ==, !=, >, >="}
  without_alternative:
    - np.exp
    - np.sin
    - np.cos
    - np.log
    - np.sign
    - np.logical_and
    - np.logical_or
    - np.logical_xor
    - np.logical_not
    - np.isclose
    - np.allclose
    - "np.isfinite (supported alternative: mask = np.isfinite(matrix.value) -- see note_correction_2026_08_04)"
    - np.isnan
    - np.isinf
    - np.maximum
    - np.minimum
    - np.floor
    - np.ceil
    - np.trunc
    - "divmod(m, x) (explicit TypeError as of 2026-08-04; see zero_division_correction_2026_08_04)"
  still_working:
    - {entry: "np.real / np.imag", why: "not ufuncs; they read the .real/.imag attributes"}
    - {entry: "np.clip and m.clip", why: "explicit clip override added in this lane; unit-judgement and SpectrogramMatrix frequency-axis-loss defects fixed 2026-08-04, see merge_blocker_corrections_2026_08_04"}
    - {entry: "np.round and m.round", why: "explicit round override added in this lane; SpectrogramMatrix frequency-axis-loss defect fixed 2026-08-04, see merge_blocker_corrections_2026_08_04"}
    - {entry: "np.array_equal", why: "converts with asarray before comparing"}
    - {entry: "sum, prod, cumsum, cumprod, any, all", why: "explicit metadata-free overrides"}
    - {entry: "mean, std, var, min, max, median", why: "already routed through np.asarray by StatisticalMethodsMixin"}
