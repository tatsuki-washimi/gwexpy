decision:
  option: "A - ufunc opt-out plus an explicit operator suite"
  rationale: >-
    SeriesMatrix inherits np.ndarray directly and cannot subclass Quantity,
    because its units are per cell.  With __array_ufunc__ present, NEP 13
    dispatches Quantity first for a left-hand Quantity or Unit; astropy then
    unwraps the matrix through its public .value and returns a bare Quantity
    carrying only the operand's unit.  Setting __array_ufunc__ = None makes
    every ndarray binary operator on the foreign side return NotImplemented, so
    Python's reflected-operator protocol hands the operation back to gwexpy.
  rejected_option_d: >-
    Making the `unit` property raise TypeError so astropy defers was rejected
    upstream of this lane: getattr(matrix, "unit", default) would then raise
    instead of returning the default, because getattr only suppresses
    AttributeError.

scope:
  included:
