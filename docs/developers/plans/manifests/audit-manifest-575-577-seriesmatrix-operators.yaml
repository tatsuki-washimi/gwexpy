    - "Add explicit + - * / // % divmod ** @ operators, their reflected and in-place forms, six comparisons, and unary + - abs()."
    - "Reject @=, reverse power, bitwise, shift and invert with an explanatory TypeError."
    - "Convert the right operand into the left operand's per-cell units for add/sub/comparison; raise UnitConversionError only for dimensionally incompatible units."
    - "Make in-place operators atomic: validate values, shape and dtype before writing the buffer."
    - "Raise ZeroDivisionError, including for reflected forms, instead of producing inf/nan."
    - "Fix the metadata defects listed in #577 (a, b, c, d, e, f)."
    - "Keep sum/prod/cumsum/any/all (and cumprod) working as documented metadata-free NumPy returns."
