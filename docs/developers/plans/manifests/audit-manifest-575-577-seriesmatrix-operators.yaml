decision:
  option: "A - ufunc opt-out plus an explicit operator suite"
  rationale: >-
    SeriesMatrix inherits np.ndarray directly and cannot subclass Quantity,
    because its units are per cell.  With __array_ufunc__ present, NEP 13
    dispatches Quantity first for a left-hand Quantity or Unit; astropy then
    unwraps the matrix through its public .value and returns a bare Quantity
    carrying only the operand's unit.  Setting __array_ufunc__ = None makes
    every ndarray binary operator on the foreign side return NotImplemented, so
    Python's reflected-operator protocol hands the operation back to gwexpy.
  rejected_option_d: >-
    Making the `unit` property raise TypeError so astropy defers was rejected
    upstream of this lane: getattr(matrix, "unit", default) would then raise
    instead of returning the default, because getattr only suppresses
    AttributeError.

scope:
  included:
    - "Set SeriesMatrix.__array_ufunc__ = None and rename the existing implementation to _ufunc_dispatch."
    - "Add explicit + - * / // % divmod ** @ operators, their reflected and in-place forms, six comparisons, and unary + - abs()."
    - "Reject @=, reverse power, bitwise, shift and invert with an explanatory TypeError."
    - "Convert the right operand into the left operand's per-cell units for add/sub/comparison; raise UnitConversionError only for dimensionally incompatible units."
    - "Make in-place operators atomic: validate values, shape and dtype before writing the buffer."
    - "Raise ZeroDivisionError, including for reflected forms, instead of producing inf/nan."
    - "Fix the metadata defects listed in #577 (a, b, c, d, e, f)."
    - "Keep sum/prod/cumsum/any/all (and cumprod) working as documented metadata-free NumPy returns."
    - "Fold SpectrogramMatrix's separate __array_ufunc__ into the same operator suite and fix its value-conversion defect (#576)."
  excluded:
    - "Field collections and Histogram operator contracts (Lanes E and F)."
    - "CHANGELOG (owned by Lane Z)."
    - "New public API such as .sign() or .isclose() replacements for the lost direct ufuncs."
    - "gwexpy/types/series_matrix_core.py (read-only for this lane)."
    - "Commits, pushes, PRs and GitHub contact."
