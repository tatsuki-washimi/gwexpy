physics_and_data_model:
  finite_difference_values_and_units: delegated unchanged to GWpy
  finite_difference_coordinates: trailing source endpoints retained for each order
  field_comparison_values_and_units: >-
    Equivalent RHS data units are converted to the LHS unit; incompatible units
    fail closed; diff, ratio, and percent return LHS, dimensionless, and percent
    units respectively.
  field_comparison_grid_authority: >-
    Shape, axis0 domain, spatial domains, and all four physical grids must align;
    equivalent coordinate units are accepted with an order-invariant 1e-12
    canonical-base-unit absolute tolerance and result metadata comes from the LHS.
  field_comparison_dispatch_authority: >-
    RHS-only subclasses and masks cannot replace LHS metadata; Astropy operand
    masks are unioned while name, channel, epoch, domains, axes, and _gwex_
    attributes are deterministically restored from the LHS.
  scalarfield_epoch_authority: >-
    Reconstructed comparison and numeric-diff results receive the LHS private
    epoch directly, preserving small integral GPS values and nanosecond precision.
  field_comparison_nonfinite_and_mask_semantics: >-
    No epsilon is introduced; NumPy IEEE nonfinite classification and Astropy
    Masked operand masks are retained.
  bifrequency_plot_axis_order: aligned to GWpy xindex/yindex authority
  binned_projection: only explicit opt-in can select the specialized calculation
  human_review: approved
  human_review_required: true
  approved_candidate_sha: c7b79db7fee2e646069679a0efe3d65c7ed4e562
  scalarfield_independent_review:
    code: ready, no Critical or Important findings
    physics_and_data_model: ready, no Critical or Important findings
    human_release_signoff: historical-approval-only
  human_review_reasons:
    - BifrequencyMap plot source orientation and frequency-axis authority changed
    - ScalarField finite-difference results use trailing physical coordinates on the reduced axis
    - ScalarField comparison unit conversion, fail-closed grid alignment, and percent scaling require sign-off
    - numeric Array2D permutation intentionally retains GWpy stale axis metadata

