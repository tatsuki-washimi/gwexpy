contracts:
  bifrequencymap_diagonal:
    default_route: GWpy Array2D diagonal with offset, axis1, and axis2
    default_result: diagonal view with GWpy values, unit, metadata, and memory sharing
    extension_predicate:
      - explicit method keyword
      - explicit bins keyword
      - explicit absolute keyword
      - legacy string first positional argument
      - legacy callable first positional argument
    extension_result: existing binned FrequencySeries projection
    legacy_positional_binding:
      bins: explicit None and falsey zero remain distinguishable from omission
      absolute: explicit false remains distinguishable from omission
      duplicate_positional_keyword: TypeError for both string and callable methods
      zero_bins: ValueError, matching the explicit keyword extension route
    exception_retry: false
  bifrequencymap_crop:
    default_route: GWpy Array2D crop over xindex/frequency2
    common_signature: start, end, keyword-only copy
    extension_predicate:
      - explicit low2 or high2 keyword
      - a third or fourth legacy positional bound
    extension_result: existing inclusive two-axis selection
    copy_and_view_identity: matched to installed GWpy on the common route
    exception_retry: false
  bifrequencymap_plot:
    qualified_methods:
      - imshow
      - pcolormesh
    common_route: GWpy Plot constructor distributes figure, axes, and artist kwargs
    artist_source: exact masked data and mask from the GWpy Array2D plot route
    unnamed_map: succeeds without constructing a label from null
    invalid_method: AttributeError, matching installed GWpy
    one_point_axis: ValueError, matching installed GWpy
    explicit_imshow_norm: remains imshow and preserves interpolation
    nonfinite_log_norm: exact artist source data and mask match GWpy
    default_geometry_signoff_evidence:
      fixture:
        shape: [3, 4]
        xindex_hz: [11, 23, 47]
        yindex_hz: [2, 5, 9, 14]
      extent_and_effective_limits: exact GWpy match at x=[11, 71], y=[2, 19]
      artist: AxesImage with lower origin and exact transposed source payload
      input_nonmutation: values, xindex, and yindex remain unchanged
      axis_label_text:
        gwpy: 'Frequency [$\mathrm{Hz}$] on both axes'
        gwexpy: 'Frequency 2 [Hz] on x; Frequency 1 [Hz] on y'
        classification: domain-specific text-only presentation difference pending human sign-off
    presentation_defaults_retained:
      - inferno colour map
      - background colour
      - colour bar
      - existing layout keyword routing
  scalarfield_diff:
    default_route: GWpy Array.diff with n and axis
    reduced_axis_coordinates: source trailing endpoints beginning at index n
    metadata_preserved:
      - axis units and names
      - time and space domains
      - all unreduced physical coordinates
    extension_predicate: first argument is a ScalarField
    extension_modes:
      - diff
      - ratio
      - percent
    exception_retry: false
    numpy_prepend_append:
      provider_support: NumPy 1.26.4 supports both options
      gwpy_surface: GWpy Array.diff does not expose either option
      required_outcome: TypeError parity, not successful extension
  array2d_axis_permutation:
    numeric_swapaxes_and_transpose: direct GWpy Array2D route
    numeric_metadata: xindex and yindex remain unchanged, matching GWpy
    named_axes: existing explicit GWexpy metadata-aware extension
    property_T: distinct GWpy route with swapped xindex/yindex and semantic names
    other_axis_hosts:
      - ScalarField
      - Array
      - Array3D
      - Array4D
    other_axis_host_numeric_route: parent-first without exception retry
    numeric_edge_contracts:
      - identity calls preserve parent view sharing
      - numpy integer axes succeed
      - bool axes and invalid, duplicate, or excess axes match parent outcomes
      - out-of-range axes raise numpy AxisError like the parent
      - transpose None uses the parent reverse-order view
      - tuple, list, numpy array, range, and memoryview single arguments use the parent route
    transpose_metadata: canonical integer order is derived only after parent acceptance

comparators:
  exact:
    - success or failure
    - exception class
    - parameter order, kind, and default for GWpy common parameters
    - numerical values
    - numerical shape and dtype
    - unit and name
    - xindex and yindex values and units
    - field axis names, lengths, and domains
    - view versus copy memory sharing where applicable
    - plotted artist source array and label
    - plotted masked-array data and mask
    - default plot extent and effective x/y limits
    - default plot input values and axis metadata remain unmodified
  recorded_presentation_difference:
    - default BifrequencyMap axis-label text, with axis semantics asserted separately
  exception_message_exact: false
  presentation_pixels_style_layout: excluded

tdd:
  red:
    environment: gwexpy
    gwpy: 4.0.2
    selected_cases: 59
    result: 43 failed, 16 passed
    primary_causes:
      - BifrequencyMap diagonal default selected the binned extension
      - BifrequencyMap crop selected both axes and rejected copy
      - unnamed BifrequencyMap plot failed while artist orientation diverged
      - numeric Array2D and Plane2D permutations rewrote GWpy metadata
      - ScalarField diff required another field and hid GWpy finite differences
    followup_invalid_plot_method_cycle:
      result: 2 failed, 1 passed
      cause: non-string methods raised AttributeError instead of GWpy TypeError
    independent_review_followup:
      environment: gwexpy
      gwpy: 4.0.2
      result: 30 failed, 78 passed
      primary_causes:
        - non-Array2D numeric axis routes copied identity results and rejected numpy integers
        - BifrequencyMap plot leaked axes kwargs and changed imshow to pcolormesh for norms
        - ScalarField finite differences replaced physical coordinates with dimensionless arange
        - callable legacy diagonal methods collided with the numeric parent route
    second_review_followup:
      environment: gwexpy
      gwpy: 4.0.2
      result: 26 failed, 120 passed
      primary_causes:
        - transpose metadata consumed None and single non-tuple sequence inputs as axis scalars
        - falsey legacy diagonal positional values were mistaken for omitted arguments
  green:
    differential_and_contract_set:
      gwpy_4_0_1: 151 passed
      gwpy_4_0_2: 151 passed
    focused_affected_regressions:
      gwpy_4_0_1: 224 passed
      gwpy_4_0_2: 224 passed
    related_regression_suite:
      environment: gwexpy
      result: 3082 passed, 37 pre-existing optional skips, 1 expected failure
      warnings: 17 dependency or pre-existing metadata warnings
    unexpected_required_skips: 0
    bifrequency_plot_signoff_evidence:
      gwpy_4_0_1: 1 passed
      gwpy_4_0_2: 1 passed
    bifrequency_related_tests:
      gwpy_4_0_1: 59 passed
      gwpy_4_0_2: 59 passed

