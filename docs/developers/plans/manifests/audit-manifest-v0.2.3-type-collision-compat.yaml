        - field-comparison reconstruction discarded left-hand native metadata
    scalarfield_comparison_independent_review_followup:
      parent: c53df8da1a7ae601d64bb6d5b990f69b0068928f
      environment: gwexpy
      gwpy: 4.0.2
      result: 21 failed, 54 passed
      intended_failure_causes:
