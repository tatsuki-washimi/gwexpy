        - numeric frequency-domain diff reset domains or failed on spatial axes
        - RHS-only subclasses and masks could become NumPy metadata authority
        - display-unit-scaled axis tolerance was operand-order asymmetric
    scalarfield_comparison_second_review_zero_order:
