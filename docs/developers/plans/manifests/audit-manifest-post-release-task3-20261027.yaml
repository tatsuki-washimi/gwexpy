  - superpowers:verification-before-completion
  - gwexpy_conda_jobs
scope:
  - Publication readback handoff after the unchanged exact-byte verifier
  - Trusted default-branch automatic/manual resolver with a read-only backfill
  - Durable version manifest and one active review PR on a stable branch
  - Evidence-preserving non-force Git ref retry and sequential post-merge review
  - Recovery after PR creation failures, closed-PR race guards, and safe successor tree checks
files:
  - .github/workflows/publish-release.yml
  - .github/workflows/post-release.yml
  - scripts/ci/post_release.py
  - tests/test_post_release_controller.py
  - tests/test_publish_release_workflow.py
  - RELEASING.md
  - docs/developers/plans/manifests/audit-manifest-post-release-task3-20261027.yaml
verification:
  red:
    - Missing controller/workflow assertions failed before implementation
    - Missing objective validation and timestamp-preserving merge assertions failed before fixes
    - Later-time no-op and merged-PR successor tests failed before persistence changes
    - Missing exact Release asset-set helper failed before implementation
    - Missing-PR recovery regression failed with no PR API write before the retry fix
    - Closed-during-persist and unreviewed-tree race regressions failed before owner-intervention guards
    - New-default successor retry regression caught a duplicate commit before stable-manifest reuse
  commands:
    - command: conda run -n gwexpy python -m pytest tests/test_post_release_controller.py tests/test_publish_release_workflow.py -q --tb=short
      result: 83 passed
    - command: conda run -n gwexpy ruff check scripts/ci/post_release.py tests/test_post_release_controller.py tests/test_publish_release_workflow.py
      result: passed
    - command: conda run -n gwexpy ruff format --check scripts/ci/post_release.py tests/test_post_release_controller.py tests/test_publish_release_workflow.py
      result: passed
    - command: conda run -n gwexpy mypy scripts/ci/post_release.py --follow-imports=silent
      result: passed
    - command: YAML BaseLoader parse of post-release.yml
      result: passed; resolve and persist jobs present
    - command: git diff --check
      result: passed
  baseline_failure:
    test: tests/test_publish_release_workflow.py::test_releasing_documents_future_build_once_promotion_contract
    observation: Existing assertion expected obsolete unpublished candidate wording after Task 2 updated RELEASING.md
    disposition: Updated assertion to the selected frozen source and successful publication run; related suite passes
  omitted:
    - Actionlint unavailable in the environment; static workflow contract and YAML parsing used
    - Full suite and docs build omitted because this task changes only release controller/workflow and developer procedure
    - No live GitHub writes or workflow dispatch; Git Data API persistence and races exercised in memory
    - Independent service timestamps, frozen notes/review hashes, Zenodo, conda, docs, Pages and cleanup completion belong to later tasks
  physics_review: not applicable; no scientific/data-model behavior changed
live_read_only_backfill:
  release_run_id: 40439962941
  release_tag: v0.2.6
  readback_job_id: 121979381040
  candidate_run_id: 40161240805
  promotion_manifest_sha256: 8b517b336d503ebedc1f6ac92070dc73bf9c144b091d01a3b680a80e70f64a8d
  source_sha: a1ff8e2f18ef4e599727d6df6fdff61fce7019bd
  tag_object_sha: e9f30e6b410d6c599880f741f188f48db4067869
  result: Successful resolver only; exact five Release assets and both distribution byte streams reverified against PyPI
  evidence_url: https://github.com/tatsuki-washimi/gwexpy/actions/runs/40439962941/job/121979381040
review_followups:
  - finding: Repeated reconcile returned a manifest URL instead of retrying PR creation after a branch update
    disposition: Fixed; same-content unreviewed branch now retries only POST pulls and merged identical state remains a no-op
  - finding: Concurrent closure of an open PR could create an unapproved replacement
    disposition: Fixed; the final PR reread rejects a closed unmerged PR and requires owner action
  - finding: CAS successor refresh could discard a competing non-manifest edit
    disposition: Fixed; non-manifest tree changes must match a reviewed or current-default ancestor, otherwise persistence stops
  - finding: Retry after a successor commit and PR API failure could append a duplicate manifest commit
    disposition: Fixed; stable-branch manifest content is reused before attempting PR creation
  - finding: Default advancement between branch read and successor write could block a safe reviewed tree
    disposition: Fixed; verified ancestry of the stable head/current default is accepted and preserved
constraints:
  - No publication rerun, rebuild, upload, retag, immutable asset mutation or package smoke
  - Existing objective state and human fields are preserved by initializer merges; later observer updates require explicit transition handling
  - Local-host cleanup remains pending_external until supplied by the maintainer host
  - Human review is required; GITHUB_TOKEN-created PR checks may need explicit maintainer action
