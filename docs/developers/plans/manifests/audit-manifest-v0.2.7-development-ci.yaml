summary: >-
  The PR 845 GWpy inventory failure was caused by source line metadata shifts
  after adding the local GWF missing-path preflight at the TimeSeries and
  TimeSeriesDict call sites. Public roots, exports, counterparts and signatures
  did not change. The preflight now lives in the shared source preparation
  helper and is enabled only for TimeSeries and TimeSeriesDict, preserving
  StateVector behavior and the reviewed inventory without regenerating it.
changed_files:
  - gwexpy/timeseries/_gwf_io.py
  - gwexpy/timeseries/collections.py
  - gwexpy/timeseries/timeseries.py
  - tests/timeseries/test_io_gwf_timeseriesdict.py
  - docs/developers/plans/manifests/audit-manifest-v0.2.7-development-ci.yaml
checks:
  - name: focused-regression-original-red
    command: >-
      conda run -n gwexpy pytest -q
      tests/timeseries/test_io_gwf_timeseriesdict.py::test_gwf_source_preparation_preflights_resolved_gwf_paths
    result: failed-as-expected-before-fix
    detail: This initial mock-based regression failed because the helper returned the
      resolved format without preflighting. It was then replaced by a real filesystem
      behavior regression to avoid mirroring implementation calls.
  - name: focused-regression-final-green
    command: >-
      conda run -n gwexpy pytest -q
      tests/timeseries/test_io_gwf_timeseriesdict.py::test_gwf_source_preparation_only_preflights_when_requested
    result: passed
    detail: Default mode returns the missing .gwf path unchanged; opt-in mode raises
      FileNotFoundError with the missing filename.
  - name: gwf-reader-and-parallel-contracts
    command: >-
      conda run -n gwexpy pytest -q
      tests/timeseries/test_io_gwf_timeseriesdict.py
      tests/timeseries/test_gwf_parallel_contract.py
      tests/timeseries/test_statevector_gwf_parallel_contract.py
    result: passed
    detail: 712 passed, 1 skipped; missing-path cases cover single/list sources,
      extensionless and renamed paths, and FrameL, LALFrame and automatic backend selection.
  - name: post-fix-integrated-10-file-suite
    command: >-
      memcap -m 6G -- conda run -n gwexpy python -m pytest
      tests/test_v027_release_support.py
      tests/test_v026_review_evidence_v2.py
      tests/test_release_contracts.py
      tests/test_validate_release_script.py
      tests/test_release_promotion.py
      tests/test_release_human_approval.py
      tests/test_release_integration_evidence.py
      tests/timeseries/test_io_gwf_timeseriesdict.py
      tests/timeseries/test_gwf_parallel_contract.py
      tests/timeseries/test_statevector_gwf_parallel_contract.py -q
    result: passed
    detail: 1098 passed, 1 skipped in 70.94 seconds; focused 10-file integration suite,
      not the full repository test suite.
  - name: isolated-timeseriesdict-default-serial-missing-paths
    command: >-
      ulimit -c 0; timeout --signal=KILL 90s env
      PYTHONPATH=<development worktree> PYTHONFAULTHANDLER=1
      conda run -n gwexpy python -X faulthandler
      <TMPDIR>/gwexpy-v027-missing-dict-isolated-v2.py
    result: passed
    detail: >-
      12 of 12 actual TimeSeriesDict.read calls raised FileNotFoundError for the
      expected filename without passing a parallel argument: single/list,
      extensionless/renamed inputs x FrameL/LALFrame/automatic backend. Imports
      resolved to the current development worktree; tracebacks included the GWF
      preflight and no GWpy backend frames.
  - name: qualification-profile-and-inventory-regressions
    command: >-
      memcap -m 4G -- conda run -n gwexpy python -m pytest
      tests/test_diaggui_qualification_evidence.py
      tests/test_qualification_skip_evidence.py
      tests/test_gwpy_override_inventory.py -q
    result: passed
    detail: 276 passed in 100.03 seconds. Coverage includes registry-backed v0.2.7
      qualifier profiles, fail-closed rejection of an unregistered version, and the
      full inventory unit file.
  - name: initial-shared-helper-integration-check
    command: >-
      conda run -n gwexpy pytest -q
      tests/timeseries/test_io_gwf_timeseriesdict.py
      tests/timeseries/test_statevector_gwf_parallel_contract.py
    result: failed-during-diagnostic-iteration
    detail: The first helper draft preflighted StateVector sources as well; 12 StateVector
      tests caught the behavior change. The final helper takes an opt-in flag, and only
      the original TimeSeries and TimeSeriesDict callers enable it; the final three-suite
      integration run passed.
  - name: gwpy-override-inventory-gwpy-4.0.2
    command: >-
      conda run -n gwexpy python scripts/audit_gwpy_overrides.py --check
      --require-terminal --execute-evidence
      --manifest docs/developers/plans/manifests/audit-manifest-v0.2.3-gwpy-overrides.json
      --oracle-python '4.0.2=@current'
    result: passed
    detail: 62 evidence selectors, 396 evidence cases, 575 inventory members.
  - name: gwpy-override-inventory-gwpy-4.0.1
    command: >-
      conda run -p <pre-existing GWpy 4.0.1 environment> python
      scripts/audit_gwpy_overrides.py --check --require-terminal --execute-evidence
      --manifest docs/developers/plans/manifests/audit-manifest-v0.2.3-gwpy-overrides.json
      --oracle-python '4.0.1=@current'
    result: passed
    detail: 62 evidence selectors, 396 evidence cases, 575 inventory members;
      upstream Matplotlib emitted 11 pending-deprecation warnings.
  - name: ruff
    command: >-
      conda run -n gwexpy ruff check gwexpy/timeseries/_gwf_io.py
      gwexpy/timeseries/collections.py gwexpy/timeseries/timeseries.py
      tests/timeseries/test_io_gwf_timeseriesdict.py
    result: passed
  - name: ruff-format
    command: >-
      conda run -n gwexpy ruff format --check gwexpy/timeseries/_gwf_io.py
      gwexpy/timeseries/collections.py gwexpy/timeseries/timeseries.py
      tests/timeseries/test_io_gwf_timeseriesdict.py
    result: passed
  - name: mypy-changed-production-files
    command: >-
      conda run -n gwexpy mypy gwexpy/timeseries/_gwf_io.py
      gwexpy/timeseries/collections.py gwexpy/timeseries/timeseries.py
    result: passed
    detail: No issues found in the three changed production files.
  - name: development-core-suite-before-inventory-fix
    result: passed
    detail: 1097 passed, 1 skipped.
  - name: mypy-before-inventory-fix
    result: baseline-only-errors
    detail: 31 errors matched the recorded pre-existing baseline; no new errors.
