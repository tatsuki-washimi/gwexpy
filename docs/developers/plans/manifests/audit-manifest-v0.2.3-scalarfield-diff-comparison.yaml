physics_and_data_model:
  dimensional_analysis:
    diff: subtraction after RHS-to-LHS conversion retains the LHS physical unit
    ratio: equivalent units cancel to a scale-normalized dimensionless result
    percent: dimensionless fractional change is converted to the percent scale
  grid_safety: >-
    Comparison is rejected before arithmetic when temporal/spatial domains or
    any physical coordinate grid differ; no implicit regridding is performed.
    The absolute tolerance is evaluated in an unscaled decomposed physical base
    unit so equivalent display units and operand order cannot change acceptance.
  domain_authority: >-
    Frequency-domain comparison and numeric finite-difference results are
    reconstructed with the LHS axis0 and spatial domains before validation.
  metadata_authority: >-
    Arithmetic is performed on validated unit-aware magnitudes and the result is
    rebuilt from LHS metadata, preventing RHS-only NumPy subclass dispatch from
    replacing name, channel, epoch, physical axes, domains, or _gwex_ attributes.
    The original private epoch value is passed directly into reconstruction so
    small GPS seconds and nanosecond precision are not reparsed through a float.
  numerical_behavior: >-
    Division uses NumPy and Astropy semantics without an epsilon, preserving
    signed infinities, NaNs, finite values, and Astropy operand masks.
  input_nonmutation: verified for values, units, native metadata, domains, and axes
  human_review:
    required: true
    status: pending maintainer sign-off; independent code and physics reviews ready
    requested_decisions:
      - accept LHS as unit and metadata authority
      - accept equivalent coordinate-unit conversion with 1e-12 canonical-base-unit tolerance
      - accept fail-closed behavior for domain and physical-grid mismatches
      - accept unregularized IEEE zero-denominator and Astropy mask semantics
      - accept percent output scaling where 100 percent equals one dimensionless

