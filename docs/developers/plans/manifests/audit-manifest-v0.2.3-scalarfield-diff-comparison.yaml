scope:
  included:
    - ScalarField.diff with a ScalarField first argument
    - diff, ratio, and percent comparison modes
    - data-unit conversion and incompatibility rejection
    - shape, domain, and four-axis physical-grid validation
    - LHS metadata authority and input nonmutation
    - deterministic LHS metadata authority against RHS-only subclasses and masks
    - IEEE nonfinite and Astropy Masked behavior at zero denominators
    - GWpy numeric Array.diff calculation with LHS physical-domain reconstruction
    - GWpy zero-order numeric diff short-circuit without post-parent axis coercion
    - lossless LHS private epoch authority for reconstructed results
    - coordinate tolerance in an order-invariant canonical physical unit
  excluded:
    - issue "#611" reader-window selection
    - changes to general FieldBase ufunc dispatch or arithmetic result construction
    - changes to the generated GWpy override inventory
    - new alignment, interpolation, or regridding APIs
    - release version, date, changelog, and publication metadata

contract:
  routing:
    numeric_first_argument: >-
      unchanged GWpy Array.diff calculation and failure route, followed by
      deterministic reconstruction of LHS physical domains and axes
    scalarfield_first_argument: explicit GWexpy field-comparison extension
    exception_retry: false
    zero_order_numeric_axis_validation: none after the GWpy parent succeeds
  validation_order:
    - existing Python binding
    - exact shape check
    - comparison mode check
    - shared FieldBase domain, spatial-domain, and coordinate validation
    - Astropy data-unit validation and conversion
  alignment:
    shape: exact
    axis0_domain: exact
    space_domains: exact
    axes: all four physical coordinate grids
    coordinate_units: equivalent units accepted after conversion
    coordinate_tolerance:
      relative: 0
      absolute: 1e-12 in the unscaled decomposed physical base unit
      operand_order_invariant: true
    mismatch_exception: ValueError
  data_units:
    requirement: RHS must be equivalent to the LHS unit
    conversion_authority: LHS unit
    incompatible_exception: astropy.units.UnitConversionError
  outputs:
    diff:
      expression: self.value - other.to_value(self.unit)
      unit: LHS unit
    ratio:
      expression: self.value / other.to_value(self.unit)
      unit: dimensionless_unscaled
    percent:
      expression: >-
        (self.value - other.to_value(self.unit)) /
        other.to_value(self.unit) * 100
      unit: percent
      scale_identity: 100 percent equals one dimensionless
  metadata:
    authority: LHS
    preserved:
      - shape and dtype
      - native name, channel, and epoch
      - exact private epoch without a public Time-to-GPS round trip
      - all axis values, units, and names
      - axis0 and spatial domains
      - _gwex_ prefixed attributes
      - LHS metadata when only the RHS is a ScalarField subclass or Astropy Masked
    input_mutation: none
  zero_denominator:
    epsilon_or_regularization: none
    required_outcomes:
      - finite values
      - NaN
      - positive infinity
      - negative infinity
      - Astropy Masked union mask

