supported_native_subtypes:
  spectrum:
    1: PSD
    2: CSD
    3: COH
  transfer_function:
    0: "TF with linear f0/df axis"
    2: COH
    3: "TF with embedded complex frequency row"
    5: "COH with embedded real frequency row"
    6: "TF with embedded frequency axis"
  limitation: >-
    This lists the native normalization layouts implemented for the frequency
    reader. It does not claim support for every DiagGUI subtype; additional
    layouts require separate coverage.
  storage_precision: >-
    Supported real-sample layouts accept float and double; supported complex
    layouts without embedded frequencies accept floatComplex and doubleComplex.
    TransferFunction subtype 6 is limited to its verified mixed float64-frequency
    and complex64-sample stream. A doubleComplex variant has no verified layout.
  missing_array_type: >-
    The frozen native parser defaulted a missing Array Type to float. The #726
    native parser requires an explicit supported Array Type and rejects its
    absence. An XML block without Array Type is not guaranteed as a valid
    DiagGUI frequency layout by this patch; its old fallback is not retained.
  legacy_spectrum_embedded_frequency_audit: >-
    Installed dttxml classifies Spectrum subtype 4 as FFT (f,Y), subtype 5 as
    PSD (f,Y), and subtype 6 as CSD (f,Y). The frozen native parser mislabeled
    all three as TF and did not separate the embedded frequency column. These
    layouts are intentionally excluded from this #726 correction pending
    dedicated axis and row-shape fixtures; their exclusion is not caused by
    Array Type precision checking.

unit_policy:
  synthetic_fixture: "The reader regression fixture carries BUnit values; native parsing reads them, while explicit unit= overrides are verified for both backends. The tutorial uses a separate unitless synthetic fixture."
  real_sample: "The inspected TransferFunction export omits AUnit and BUnit. The user confirms DiagGUI removes unit metadata and plot-axis labels are manual. Both readers expose unitless samples by default; a local unit= override check for both parser modes preserved values and axes."
  per_pair_unit_matrix: "Deferred; no per-pair mixed-unit matrix contract is claimed by this patch."
  external_parser: "The installed dttxml parser can lose phase for TransferFunction subtype 6; native parsing is the documented workaround."

release_notes:
  target: "v0.2.3-compatible patch"
  user_visible_change: >-
    Supported DiagGUI XML ASD and transfer-function products can be loaded by
    the FrequencySeries, FrequencySeriesDict, and FrequencySeriesMatrix readers
    through either parser path.

limitations:
  - "No Japanese web notebook exists in the checkout; the generator's JA template is corrected for future generation."
  - "Tutorial notebooks were edited directly because running the generator would replace newer notebook content."
  - "A real TF subtype 3/COH subtype 5 export confirms serialization and numerical parity; DiagGUI omits file unit metadata, so callers must supply known units explicitly."
  - "The native parser covers only the subtype layouts listed above; other DTT layouts are outside the verified scope."
