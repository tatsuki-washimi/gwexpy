intentional_extensions_and_exceptions:
  exact_projection_oracle: >-
    The native-attribute check intentionally derives only GWpy's public t0/dt
    input from the exact GWexpy object. All ordinary fixtures are built
    independently from a shared literal specification.
  non_intersecting_window_safety:
    inventory_marker: non_intersecting_window_safety
    member: gwexpy.timeseries.collections.TimeSeriesDict/read
    terminal_state: fixed
    issue: "#611"
    before: >-
      GWpy 4.0.1 and 4.0.2 return eight samples outside the requested window
      when a non-nanosecond HDF5 epoch makes a completely disjoint end bound
      become a negative wrapped stop index.
    after: >-
      GWexpy returns a zero-length, key-preserving entry for that completely
      disjoint subcase only.
    invariants: >-
      The parent must first return normally. Parent exceptions are not caught
      or reinterpreted; partial overlap, pad, other results, source ownership,
      and source position are preserved.
  evidence:
    - tests/io/test_reader_start_end_contract.py::TestNonNanosecondGrids::test_window_before_data_with_non_ns_epoch_returns_metadata_empty
    - tests/io/test_reader_start_end_contract.py::TestNativeHdf5NonIntersectingSafety
    - tests/io/test_reader_start_end_contract.py::TestLegacyHdf5NonIntersectingRoutes

tdd:
  red:
    hdf5_auto_identification:
      gwpy_4_0_1: 15 failed, 8 passed
      failing_boundaries:
        - native .h5 had no exact GWexpy HDF5 identifier
        - native .hdf5 fell through to the extension-only NDScope route
        - auto-write either failed or emitted NDScope topology
        - named binary handles and content-identifiable .hdf reads failed
        - auto-format-omitted #611 normalization was unreachable
      already_green_guards:
        - bare BytesIO auto-identification fails while explicit HDF5 succeeds
        - structurally valid NDScope reads auto-identify for both suffixes
        - TimeSeriesList remains explicit-only
    caller_owned_ndscope_source_followup:
      initial_probe: 4 failed, 4 passed
      mismatches:
        - >-
          Caller-owned h5py.File objects bypassed the path-only structural
          identifier, so native HDF5 won instead of NDScope.
        - >-
          After identification, the NDScope reader reopened .filename instead
          of consuming the supplied object, which failed for an in-memory core
          driver file with backing_store=False.
    exact_dict_adapter_followup:
      initial_probe: 4 failed, 6 passed
      mismatches:
        - >-
          Repeated registration and reload recreated the exact
          TimeSeriesDict reader adapter instead of preserving handler identity.
        - >-
          Registering the parent writer directly bypassed the explicit-route
          manifest reconciliation and hid appended entries from later reads.
        - >-
          Direct parent-writer delegation before registry dispatch omitted
          Astropy target preprocessing, including tilde expansion.
    initial_direct_matrix:
      gwpy_4_0_1: 3 failed, 6 passed
      gwpy_4_0_2: 3 failed, 6 passed
      mismatches:
        - TimeSeriesDict names/group selection returned an empty result
        - TimeSeriesDict rejected an open HDF5 handle with TypeError
        - TimeSeriesDict native write returned a Path instead of GWpy's None
    exact_sidecar_followup:
      gwpy_4_0_1: 2 failed
      gwpy_4_0_2: 2 failed
      mismatches:
        - exact-sidecar names/group selection returned an empty result
        - exact-sidecar open-handle selection raised TypeError
    superseded_611_expectations:
      gwpy_4_0_1: 5 failed, 219 passed
      gwpy_4_0_2: 5 failed, 219 passed
      historical_observation: >-
        Five historical tests expected the old custom HDF5 gap behavior. Four
        expected empty output where both GWpy oracles raise ValueError, and one
        expected empty output where both return eight samples. The expectations
        initially changed to compare installed GWpy outcomes directly. The
        eight-sample completely disjoint case was later approved as the named
        non_intersecting_window_safety exception; the four parent-error cases
        continue to preserve the GWpy exception class.
    non_intersecting_window_safety:
      gwpy_4_0_1: expected eight outside-window samples, GWexpy initially returned eight
      gwpy_4_0_2: expected eight outside-window samples, GWexpy initially returned eight
      red_contract: >-
        The approved safety test requires a zero-length result, key retention,
        explicit public empty metadata, and no inherited private exact-time
        authority, so the pre-exception runtime was red in both oracle
        environments.
    independent_review_followup:
      gwpy_4_0_1: 5 failed
      gwpy_4_0_2: 5 failed
      mismatches:
        - >-
          Four path/open-handle by dataset/group cases appended a native
          dataset without refreshing the pre-existing GWexpy manifest, hiding
          the new entry from the default GWexpy reader.
        - >-
          A seekable exact-sidecar BytesIO followed the native public result
          but lost its private exact authority because augmentation inspection
          only recognised paths and open h5py objects.
      fixture_adjustment: >-
        Both GWpy oracles reject a multi-source list of BytesIO objects with
        TypeError, so the merge-authority test uses two exact-sidecar Paths.
        Single-source BytesIO covers lossless names/group/start/end and padded
        selection, position, and lifecycle behavior directly.
    explicit_merge_mode_followup:
      gwpy_4_0_1: 12 failed, 12 passed
      gwpy_4_0_2: 12 failed, 12 passed
      mismatches:
        - >-
          Four mode/target combinations with a stored group layout and omitted
          layout rewrote the manifest as dataset layout and hid the old entries.
        - >-
          Eight stored-layout/mode/target combinations with an explicitly
          mismatching layout wrote new objects and replaced the manifest rather
          than rejecting the request before mutation.
  green:
    hdf5_auto_identification:
      gwpy_4_0_1: 47 passed
      gwpy_4_0_2: 47 passed
      required_skips: 0
      repeated_resource_probe: >-
