    gwpy: 4.0.2
oracle_version_difference: >-
  No difference was observed in the required direct matrix. Optional-backend
  skips in the full I/O suite differ with the installed environments and are
  not skips of a required compatibility node.
oracle_execution: >-
  Each direct test constructs independent installed-GWpy and GWexpy objects in
  the same pinned environment. Files are written independently except where a
  cross-read is the fixture under test. No result from GWexpy is used to build
  the GWpy oracle.

scope:
  counterpart_rows: 6
  public_api_change: false
  new_dependency: false
  scientific_or_data_model_review_required: false
  production_change: >-
    Restore native TimeSeriesDict HDF5 binding and outcomes for ordinary files,
    and overlay grandfathered exact-time authority only after GWpy resolves an
    exact-sidecar file's public selection. TimeSeries and FrequencySeries CSV
    and HDF5 fixes from the reviewed Phase 0 and Phase 4 work are reused.

route_contract:
  csv:
    plain_suffix_or_format_csv: installed GWpy native reader and writer
    enhanced_opt_in: >-
      Existing TimeSeries reader keywords config, channels, timezone,
      resample, or resample_method, and the existing direct csv_enhanced
      helpers. No new public selector was added.
    collections: existing explicit collection-directory extension
  hdf5:
    plain_format_hdf5: >-
      Installed GWpy owns names, group, start, end, gap, pad, open-handle,
      append, overwrite, existing-file, and error behavior.
    exact_sidecar_only: >-
      GWpy first resolves the public collection result. GWexpy then restores
      only marker-authorized private exact epoch/cadence state on lossless
      selected slices; uncertain padded or merged projections remain without
      private exact authority.
    collection_manifest: >-
      Existing explicit GWexpy collection layouts and mode= routes retain their
      enhanced implementation and manifest semantics.
    exact_authority: >-
      The dataset-local epoch marker plus file _gwexpy_sidecar_json_v2 remain
      the grandfathered private authority. This lane does not redesign or
      remove that protocol.

comparators:
  binding_and_outcome:
    exact:
      - accepted positional and keyword calling forms
      - positional and keyword duplicate rejection
      - success or failure
      - exception class
    exception_message: excluded unless an existing public test contracts it
  series:
    exact:
      - values and dtype
      - unit and shape
      - time or frequency axis values and unit
      - name and channel
      - FrequencySeries epoch
  lifecycle:
    exact:
      - input object mutation
      - source file mutation on reads and failed writes
      - open HDF5 handle validity after reads
      - writer return behavior
  hdf5:
    exact:
      - dataset and group topology
      - logical paths including colon and slash keys
      - dataset values, dtype, and shape
      - native attribute keys and values
    exact_time_native_attribute_oracle: >-
      The GWpy file is written from the GWexpy object's actual public projected
      t0, dt, xunit, unit, and name. Native dx, unit, xunit, and name compare
      exactly; x0 compares by float.hex, which also pins the binary64 bits.
    private_marker_exclusions:
      file_attributes:
        - _gwexpy_sidecar_json_v1
        - _gwexpy_sidecar_json_v2
      dataset_attributes:
        - epoch, only when it is the marker linked to the exact sidecar record
    not_excluded: >-
      Topology, logical paths, native-key additions/removals, and mutations of
      unrelated native attributes are never hidden by the marker exclusions.
  csv_complex_data: >-
    Native write output and default-read failure class are compared. A
    round-trip is required only for dtype=complex, where both installed GWpy
    releases themselves successfully read the native output.

tdd:
  red:
    initial_direct_matrix:
      gwpy_4_0_1: 3 failed, 6 passed
      gwpy_4_0_2: 3 failed, 6 passed
      mismatches:
        - TimeSeriesDict names/group selection returned an empty result
        - TimeSeriesDict rejected an open HDF5 handle with TypeError
        - TimeSeriesDict native write returned a Path instead of GWpy's None
    exact_sidecar_followup:
      gwpy_4_0_1: 2 failed
      gwpy_4_0_2: 2 failed
      mismatches:
        - exact-sidecar names/group selection returned an empty result
        - exact-sidecar open-handle selection raised TypeError
    superseded_611_expectations:
      result: 5 failed, 219 passed
      observation: >-
        Five historical tests expected the old custom HDF5 gap behavior. Four
        expected empty output where both GWpy oracles raise ValueError, and one
        expected empty output where both return eight samples. The expectations
        now compare the installed GWpy outcome and exception class directly.
  green:
    direct_terminal_suite:
      file: tests/io/test_gwpy_override_terminal_io.py
      gwpy_4_0_1: 9 passed, 0 skipped
      gwpy_4_0_2: 9 passed, 0 skipped
    focused_affected_suite:
      gwpy_4_0_1: 224 passed, 0 skipped
      gwpy_4_0_2: 224 passed, 0 skipped
    exact_time_hdf5_regression:
      gwpy_4_0_1: 806 passed, 0 skipped
      gwpy_4_0_2: 806 passed, 0 skipped
    full_io_suite:
      gwpy_4_0_1: 1163 passed, 8 approved optional skips
      gwpy_4_0_2: 1149 passed, 23 approved optional skips
    unexpected_required_skips: 0

