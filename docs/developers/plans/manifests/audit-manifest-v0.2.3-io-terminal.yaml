human_data_model_signoff:
  status: required
  release_gate: true
  scope: >-
    For a non-nanosecond HDF5 series whose requested end precedes the stored
    epoch, both installed GWpy oracles return eight samples rather than an empty
    result or an exception. v0.2.3 compatibility preserves that measured
    selection, but a human must explicitly accept its scientific/data-model
    meaning before release.
  evidence:
    - tests/io/test_reader_start_end_contract.py::TestNonNanosecondGrids::test_window_before_data_with_non_ns_epoch_matches_gwpy

