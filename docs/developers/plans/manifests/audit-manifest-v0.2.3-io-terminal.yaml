oracle_version_difference: >-
  No difference was observed in the required direct matrix. Optional-backend
  skips in the full I/O suite differ with the installed environments and are
  not skips of a required compatibility node.
oracle_execution: >-
  Each direct test constructs independent installed-GWpy and GWexpy objects in
  the same pinned environment. Files are written independently except where a
  cross-read is the fixture under test. The sole deliberate exception is the
  exact-time native-attribute comparator: its GWpy input is constructed from
  the GWexpy object's actual public projection so x0 has identical binary64
  input. That comparator is isolated from the common independent fixtures.

scope:
  counterpart_rows: 6
  public_api_change: false
  new_dependency: false
  scientific_or_data_model_review_required: true
  production_change: >-
    Restore native TimeSeriesDict HDF5 binding and outcomes for ordinary files,
    and overlay grandfathered exact-time authority only after GWpy resolves an
    exact-sidecar file's public selection. TimeSeries and FrequencySeries CSV
    and HDF5 fixes from the reviewed Phase 0 and Phase 4 work are reused. A
    default append or explicit mode="a"/"r+" merge into an existing GWexpy
    collection manifest is reconciled by its existing explicit layout rather
    than leaving the manifest stale.

route_contract:
  csv:
    plain_suffix_or_format_csv: installed GWpy native reader and writer
    enhanced_opt_in: >-
      Existing TimeSeries reader keywords config, channels, timezone,
      resample, or resample_method, and the existing direct csv_enhanced
      helpers. No new public selector was added.
    collections: existing explicit collection-directory extension
  hdf5:
    plain_format_hdf5: >-
      Installed GWpy owns names, group, start, end, gap, pad, open-handle,
      append, overwrite, existing-file, and error behavior.
    exact_sidecar_only: >-
      GWpy first resolves the public collection result. GWexpy then restores
      only marker-authorized private exact epoch/cadence state on lossless
      selected slices; uncertain padded or merged projections remain without
      private exact authority.
    exact_filelike: >-
      Seekable file-like inspection restores the caller's position before the
      GWpy read, never closes the caller-owned object, and restores the
      post-GWpy position after the private overlay inspection. Lossless
      names/group/start/end selections retain exact authority; padded and
      multi-source merged results clear it.
    collection_manifest: >-
      Existing explicit GWexpy collection layouts and mode= routes retain their
      enhanced implementation and manifest semantics. A later default
      append=True or explicit mode="a"/"r+" detects those root attrs, reuses
      the stored dataset/group layout, and refreshes keymap/order after
      successful entry writes so old and new entries stay visible. A
      conflicting explicit merge layout fails before mutation. An ordinary
      write without append or an explicit merge mode retains its prior route.
    exact_authority: >-
      The dataset-local epoch marker plus file _gwexpy_sidecar_json_v2 remain
      the grandfathered private authority. This lane does not redesign or
      remove that protocol.

comparators:
  binding_and_outcome:
    exact:
      - accepted positional and keyword calling forms
      - positional and keyword duplicate rejection
      - success or failure
      - exception class
    exception_message: excluded unless an existing public test contracts it
  series:
    exact:
      - values and dtype
      - unit and shape
      - time or frequency axis values and unit
      - name and channel
      - FrequencySeries epoch
  lifecycle:
    exact:
      - input object mutation
      - source file mutation on reads and failed writes
      - raw bytes, topology, and attributes after rejected merge-layout mismatch
      - seekable file-like position and ownership
      - open HDF5 handle validity after reads
      - writer return type, validity, path, owning handle, and dataset payload
  hdf5:
    exact:
      - dataset and group topology
      - logical paths including colon and slash keys
      - dataset values, dtype, and shape
      - native attribute keys and values
    exact_time_native_attribute_oracle: >-
      The GWpy file is written from the GWexpy object's actual public projected
      t0, dt, xunit, unit, and name. Native dx, unit, xunit, and name compare
      exactly; x0 compares by float.hex, which also pins the binary64 bits.
    private_marker_exclusions:
      file_attributes:
        - _gwexpy_sidecar_json_v1
        - _gwexpy_sidecar_json_v2
      dataset_attributes:
        - epoch, only when it is the marker linked to the exact sidecar record
    not_excluded: >-
      Topology, logical paths, native-key additions/removals, and mutations of
      unrelated native attributes are never hidden by the marker exclusions.
  csv_complex_data: >-
    Native write output and default-read failure class are compared. A
    round-trip is required only for dtype=complex, where both installed GWpy
    releases themselves successfully read the native output.

intentional_extensions_and_exceptions:
  exact_projection_oracle: >-
    The native-attribute check intentionally derives only GWpy's public t0/dt
    input from the exact GWexpy object. All ordinary fixtures are built
    independently from a shared literal specification.
  hdf5_suffix_auto_identification: >-
    Existing GWexpy TimeSeries-family contract requires explicit
    format="hdf5" even for an .h5 suffix. This is a documented intentional
    exception to GWpy auto-identification, not a hidden differential pass.
  evidence:
    - tests/io/test_hdf5_timeseries_family.py::test_timeseries_hdf5_requires_explicit_format
    - tests/io/test_hdf5_timeseries_family.py::test_timeseriesdict_hdf5_requires_explicit_format

tdd:
  red:
    initial_direct_matrix:
      gwpy_4_0_1: 3 failed, 6 passed
      gwpy_4_0_2: 3 failed, 6 passed
      mismatches:
        - TimeSeriesDict names/group selection returned an empty result
        - TimeSeriesDict rejected an open HDF5 handle with TypeError
        - TimeSeriesDict native write returned a Path instead of GWpy's None
    exact_sidecar_followup:
      gwpy_4_0_1: 2 failed
      gwpy_4_0_2: 2 failed
      mismatches:
        - exact-sidecar names/group selection returned an empty result
        - exact-sidecar open-handle selection raised TypeError
    superseded_611_expectations:
      gwpy_4_0_1: 5 failed, 219 passed
      gwpy_4_0_2: 5 failed, 219 passed
      observation: >-
        Five historical tests expected the old custom HDF5 gap behavior. Four
        expected empty output where both GWpy oracles raise ValueError, and one
        expected empty output where both return eight samples. The expectations
        now compare the installed GWpy outcome and exception class directly.
    independent_review_followup:
      gwpy_4_0_1: 5 failed
      gwpy_4_0_2: 5 failed
      mismatches:
        - >-
          Four path/open-handle by dataset/group cases appended a native
          dataset without refreshing the pre-existing GWexpy manifest, hiding
          the new entry from the default GWexpy reader.
        - >-
          A seekable exact-sidecar BytesIO followed the native public result
          but lost its private exact authority because augmentation inspection
          only recognised paths and open h5py objects.
      fixture_adjustment: >-
        Both GWpy oracles reject a multi-source list of BytesIO objects with
        TypeError, so the merge-authority test uses two exact-sidecar Paths.
        Single-source BytesIO covers lossless names/group/start/end and padded
        selection, position, and lifecycle behavior directly.
    explicit_merge_mode_followup:
      gwpy_4_0_1: 12 failed, 12 passed
      gwpy_4_0_2: 12 failed, 12 passed
      mismatches:
        - >-
          Four mode/target combinations with a stored group layout and omitted
          layout rewrote the manifest as dataset layout and hid the old entries.
        - >-
          Eight stored-layout/mode/target combinations with an explicitly
          mismatching layout wrote new objects and replaced the manifest rather
          than rejecting the request before mutation.
  green:
    direct_terminal_suite:
      file: tests/io/test_gwpy_override_terminal_io.py
      gwpy_4_0_1: 38 passed, 0 skipped
      gwpy_4_0_2: 38 passed, 0 skipped
    focused_affected_suite:
      gwpy_4_0_1: 253 passed, 0 skipped
      gwpy_4_0_2: 253 passed, 0 skipped
    exact_time_hdf5_regression:
      gwpy_4_0_1: 806 passed, 0 skipped
      gwpy_4_0_2: 806 passed, 0 skipped
    full_io_suite:
