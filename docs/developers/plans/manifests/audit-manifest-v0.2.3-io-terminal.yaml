canonical_plan_text_followup: >-
  Clarify that exact-sidecar native-attribute parity compares the GWpy-native
  key subset from the same projected public input, excluding only the named
  marker-linked private attrs. It does not require byte-identical private attrs
  and does not permit topology, path, or unrelated native-key differences.
