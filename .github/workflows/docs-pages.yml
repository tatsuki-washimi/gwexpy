name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "docs_redesign/**"
      - "scripts/generate_docs_redirect_stubs.py"
      - "environment.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with docs-redesign-preview.yml so a preview build and a production
# deploy never push to the gh-pages branch at the same time.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-pages:
    name: Publish docs_redesign to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
      MPLCONFIGDIR: /tmp/matplotlib
      # docs_redesign/conf.py reads GWEXPY_DOCS_LANG_BASEURL to compute the
      # language-switcher's counterpart-language URL (shared by EN and JA);
      # GWEXPY_DOCS_BASEURL is the per-build canonical base and is set
      # separately for the EN and JA build steps below, since the JA build's
      # canonical must point at .../docs/ja/, not at the EN root.
      GWEXPY_DOCS_LANG_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: gwexpy
          create-args: >-
            python=3.11
          init-shell: bash

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Provision docs_redesign build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install -r docs_redesign/requirements.txt

      - name: Build EN HTML
        working-directory: docs_redesign
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
        run: |
          sphinx-build -b html -d _build/doctrees_en . _build/html

      - name: Build JA HTML
        working-directory: docs_redesign
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/ja/"
        run: |
          sphinx-build -b html -D language=ja -d _build/doctrees_ja . _build/html/ja

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="${RUNNER_TEMP}/gwexpy-gh-pages"

          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${publish_dir}"

          mkdir -p "${publish_dir}/docs"
          rsync -a --delete "docs_redesign/_build/html/" "${publish_dir}/docs/"

          # Regenerate the old-site redirect stubs *after* the --delete above,
          # since they live under the same docs/ tree it just wiped (Step F-3
          # design, Step F-4 cutover).
          python scripts/generate_docs_redirect_stubs.py "${publish_dir}"

          cat > "${publish_dir}/index.html" <<'EOF'
          <html><head><meta http-equiv="refresh" content="0; url=docs/index.html"></head><body>Redirecting to documentation...</body></html>
          EOF
          touch "${publish_dir}/.nojekyll"

          cd "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish"
            exit 0
          fi

          git commit -m "deploy: switch website to docs_redesign (${GITHUB_SHA})"
          git push origin gh-pages
