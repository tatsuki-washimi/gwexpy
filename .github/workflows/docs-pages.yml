name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "docs_redesign/**"
      - "scripts/prepare_public_docs.py"
      - "scripts/check_public_docs.py"
      - "scripts/verify_public_examples.py"
      - "scripts/ci/docs_publish_guard.py"
      - "gwexpy/**"
      - "pyproject.toml"
      - "scripts/generate_docs_redirect_stubs.py"
      - "environment.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Shared with docs-redesign-preview.yml so a preview build and a production
# deploy never update gh-pages at the same time. Queue rather than cancel:
# cancel-in-progress could discard a production update midway through publish.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  build-pages:
    name: Build and validate Docs (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
      MPLCONFIGDIR: /tmp/matplotlib
      GWEXPY_DOCS_LANG_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
    outputs:
      artifact_id: ${{ steps.upload-site.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-site.outputs.artifact-digest }}
    steps:
      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: environment.yml
          environment-name: gwexpy
          create-args: >-
            python=3.11
          init-shell: bash

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Provision docs_redesign build environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install -r docs_redesign/requirements.txt

      - name: Prepare isolated docs_redesign source
        id: prepare_docs_redesign
        run: |
          docs_root="${RUNNER_TEMP}/gwexpy-docs-redesign-pages"
          docs_src="${docs_root}/docs_redesign"
          mkdir -p "${docs_root}"
          python scripts/prepare_public_docs.py "${docs_src}"
          python scripts/verify_public_examples.py "${docs_src}"
          echo "docs_src=${docs_src}" >> "${GITHUB_OUTPUT}"

      - name: Verify introductory examples on their target release
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          release_env="${RUNNER_TEMP}/gwexpy-intro-release"
          release_version=$(python -c 'import json; print(json.load(open("docs_redesign/release_status.json"))["intro_examples_release"])')
          python -m venv "${release_env}"
          "${release_env}/bin/python" -m pip install "gwexpy==${release_version}"
          cd "${RUNNER_TEMP}"
          env -u PYTHONPATH "${release_env}/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/verify_public_examples.py" "${docs_src}" \
            --expected-version "${release_version}"
          cd "${GITHUB_WORKSPACE}"
          python scripts/verify_public_examples.py "${docs_src}"

      - name: Build EN HTML
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python -m sphinx -b html -d "${docs_src}/_build/doctrees_en" \
            "${docs_src}" "${docs_src}/_build/html"

      - name: Build JA HTML
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/ja/"
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python -m sphinx -b html -D language=ja -d "${docs_src}/_build/doctrees_ja" \
            "${docs_src}" "${docs_src}/_build/html/ja"

      - name: Check rendered EN and JA paths
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python scripts/check_public_docs.py "${docs_src}/_build/html" \
            --expected-revision "${GITHUB_SHA}"

      - name: Package and hash the exact site tree
        id: package-site
        run: |
          set -euo pipefail
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          artifact_root="${RUNNER_TEMP}/gwexpy-docs-pages-artifact"
          mkdir -p "${artifact_root}/site"
          cp -a "${docs_src}/_build/html/." "${artifact_root}/site/"
          python scripts/ci/docs_publish_guard.py create-manifest \
            --site-dir "${artifact_root}/site" \
            --manifest "${artifact_root}/manifest.json" \
            --expected-revision "${GITHUB_SHA}"
          echo "artifact_root=${artifact_root}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact Docs site
        id: upload-site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docs-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package-site.outputs.artifact_root }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Retain Docs build diagnostics
        if: failure() && steps.prepare_docs_redesign.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docs-pages-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.prepare_docs_redesign.outputs.docs_src }}/_build/**
            /tmp/sphinx-err-*.log
          retention-days: 7

  publish-pages:
    name: Publish verified Docs artifact
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GWEXPY_DOCS_LANG_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
    steps:
      - name: Checkout current main history (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact same-run Docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          artifact-ids: ${{ needs.build-pages.outputs.artifact_id }}
          path: ${{ runner.temp }}/gwexpy-docs-pages-artifact
          merge-multiple: true
          digest-mismatch: error

      - name: Require artifact identity and digest
        env:
          DOCS_ARTIFACT_ID: ${{ needs.build-pages.outputs.artifact_id }}
          DOCS_ARTIFACT_DIGEST: ${{ needs.build-pages.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${DOCS_ARTIFACT_ID}" =~ ^[0-9]+$ ]] || {
            echo "Missing upload-artifact identity" >&2
            exit 1
          }
          [[ "${DOCS_ARTIFACT_DIGEST}" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "Missing or malformed upload-artifact SHA-256 digest" >&2
            exit 1
          }

      - name: Verify exact EN and JA artifact contents
        run: |
          set -euo pipefail
          python scripts/ci/docs_publish_guard.py verify-artifact \
            --artifact-root "${RUNNER_TEMP}/gwexpy-docs-pages-artifact" \
            --expected-revision "${GITHUB_SHA}"

      # This is the first step that receives the write-scoped token. It runs
      # after artifact digest, source identity, and every site-file hash pass.
      - name: Checkout gh-pages for the isolated publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: .gh-pages-publish
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh main before Docs publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Reject stale or unapproved source ordering
        run: |
          set -euo pipefail
          python scripts/ci/docs_publish_guard.py check-order \
            --repository "${GITHUB_WORKSPACE}" \
            --candidate-revision "${GITHUB_SHA}" \
            --deployed-site "${GITHUB_WORKSPACE}/.gh-pages-publish/docs" \
            --main-ref refs/remotes/origin/main

      - name: Prepare the gh-pages update
        id: prepare-publish
        run: |
          set -euo pipefail
          publish_dir="${GITHUB_WORKSPACE}/.gh-pages-publish"
          artifact_site="${RUNNER_TEMP}/gwexpy-docs-pages-artifact/site"

          mkdir -p "${publish_dir}/docs"
          rsync -a --delete "${artifact_site}/" "${publish_dir}/docs/"
          python scripts/generate_docs_redirect_stubs.py "${publish_dir}"

          cat > "${publish_dir}/index.html" <<'EOF'
          <html><head><meta http-equiv="refresh" content="0; url=docs/index.html"></head><body>Redirecting to documentation...</body></html>
          EOF
          touch "${publish_dir}/.nojekyll"

          git -C "${publish_dir}" add -A
          if git -C "${publish_dir}" diff --cached --quiet; then
            echo "No gh-pages changes to publish"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            git -C "${publish_dir}" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "deploy: docs_redesign ${GITHUB_SHA}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Recheck main before gh-pages push
        if: steps.prepare-publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/ci/docs_publish_guard.py check-order \
            --repository "${GITHUB_WORKSPACE}" \
            --candidate-revision "${GITHUB_SHA}" \
            --deployed-site "${GITHUB_WORKSPACE}/.gh-pages-publish/docs" \
            --main-ref refs/remotes/origin/main

      - name: Publish to gh-pages
        if: steps.prepare-publish.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git -C "${GITHUB_WORKSPACE}/.gh-pages-publish" push origin HEAD:gh-pages

      - name: Verify published EN and JA HTML
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            echo "Pages readback attempt ${attempt}/18"
            if python scripts/check_public_docs.py \
              --url "${GWEXPY_DOCS_LANG_BASEURL}" \
              --expected-revision "${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 20
          done
          echo "Pages did not serve the verified EN/JA artifact within the verification window"
          exit 1
