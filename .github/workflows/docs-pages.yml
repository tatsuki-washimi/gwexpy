name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "docs_redesign/**"
      - "docs/web/en/user_guide/tutorials/**"
      - "scripts/prepare_public_docs.py"
      - "scripts/check_public_docs.py"
      - "scripts/verify_public_examples.py"
      - "gwexpy/**"
      - "pyproject.toml"
      - "scripts/generate_docs_redirect_stubs.py"
      - "environment.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with docs-redesign-preview.yml so a preview build and a production
# deploy never push to the gh-pages branch at the same time. Queue rather
# than cancel: cancel-in-progress would let a preview push abort an
# in-flight production deploy before it reaches git push, silently
# dropping the production update.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Small notebook fits otherwise oversubscribe BLAS threads on large runners.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  publish-pages:
    name: Publish docs_redesign to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
      MPLCONFIGDIR: /tmp/matplotlib
      # docs_redesign/conf.py reads GWEXPY_DOCS_LANG_BASEURL to compute the
      # language-switcher's counterpart-language URL (shared by EN and JA);
      # GWEXPY_DOCS_BASEURL is the per-build canonical base and is set
      # separately for the EN and JA build steps below, since the JA build's
      # canonical must point at .../docs/ja/, not at the EN root.
      GWEXPY_DOCS_LANG_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          environment-name: gwexpy
          create-args: >-
            python=3.11
          init-shell: bash

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: Provision docs_redesign build environment
        run: |
          python -m pip install --upgrade pip
          # Public notebook pages exercise optional integrations; install the
          # full runtime set before executing them into the HTML build cache.
          python -m pip install -e ".[all]"
          python -m pip install -r docs_redesign/requirements.txt

      # Keep executed notebooks and MyST-NB's cache outside the checkout.
      # The generated HTML retains outputs, but Git continues to track only
      # clean notebook source.
      - name: Prepare isolated docs_redesign source
        id: prepare_docs_redesign
        run: |
          docs_root="${RUNNER_TEMP}/gwexpy-docs-redesign-pages"
          docs_src="${docs_root}/docs_redesign"
          mkdir -p "${docs_root}"
          python scripts/prepare_public_docs.py "${docs_src}"
          python scripts/verify_public_examples.py "${docs_src}"
          echo "docs_src=${docs_src}" >> "${GITHUB_OUTPUT}"

      - name: Verify introductory examples on their target release
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          release_env="${RUNNER_TEMP}/gwexpy-intro-release"
          release_version=$(python -c 'import json; print(json.load(open("docs_redesign/release_status.json"))["intro_examples_release"])')
          python -m venv "${release_env}"
          "${release_env}/bin/python" -m pip install "gwexpy==${release_version}"
          # Run away from the checkout with base dependencies only. The main
          # build regenerates its figure afterward using the editable package.
          cd "${RUNNER_TEMP}"
          env -u PYTHONPATH "${release_env}/bin/python" \
            "${GITHUB_WORKSPACE}/scripts/verify_public_examples.py" "${docs_src}" \
            --expected-version "${release_version}"
          cd "${GITHUB_WORKSPACE}"
          python scripts/verify_public_examples.py "${docs_src}"

      - name: Build EN HTML
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/"
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python -m sphinx -b html -d "${docs_src}/_build/doctrees_en" \
            "${docs_src}" "${docs_src}/_build/html"

      - name: Build JA HTML
        env:
          GWEXPY_DOCS_BASEURL: "https://tatsuki-washimi.github.io/gwexpy/docs/ja/"
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python -m sphinx -b html -D language=ja -d "${docs_src}/_build/doctrees_ja" \
            "${docs_src}" "${docs_src}/_build/html/ja"

      - name: Check rendered entry paths
        run: |
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          python scripts/check_public_docs.py "${docs_src}/_build/html" --expected-revision "${GITHUB_SHA}"

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir="${RUNNER_TEMP}/gwexpy-gh-pages"

          git clone --branch gh-pages --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "${publish_dir}"

          mkdir -p "${publish_dir}/docs"
          docs_src="${{ steps.prepare_docs_redesign.outputs.docs_src }}"
          rsync -a --delete "${docs_src}/_build/html/" "${publish_dir}/docs/"

          # Regenerate the old-site redirect stubs *after* the --delete above,
          # since they live under the same docs/ tree it just wiped (Step F-3
          # design, Step F-4 cutover).
          python scripts/generate_docs_redirect_stubs.py "${publish_dir}"

          cat > "${publish_dir}/index.html" <<'EOF'
          <html><head><meta http-equiv="refresh" content="0; url=docs/index.html"></head><body>Redirecting to documentation...</body></html>
          EOF
          touch "${publish_dir}/.nojekyll"

          cd "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No gh-pages changes to publish"
          else
            git commit -m "deploy: switch website to docs_redesign (${GITHUB_SHA})"
            git push origin gh-pages
          fi

      - name: Verify published HTML
        timeout-minutes: 10
        run: |
          # gh-pages publication is asynchronous. Read the expected commit back
          # from Pages, including the actual figure, before reporting success.
          # Returning from a function avoids login-shell logout hooks on exit.
          verify_publication() {
            for attempt in $(seq 1 18); do
              echo "Pages readback attempt ${attempt}/18"
              if python scripts/check_public_docs.py \
                --url "${GWEXPY_DOCS_LANG_BASEURL}" --expected-revision "${GITHUB_SHA}" \
                2>&1 | tee -a "${{ steps.prepare_docs_redesign.outputs.docs_src }}/_build/deploy-readback.log"; then
                return 0
              fi
              sleep 20
            done
            echo "Pages did not serve the expected EN/JA build within the verification window"
            return 1
          }
          verify_publication

      - name: Retain documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-build-diagnostics
          path: |
            ${{ steps.prepare_docs_redesign.outputs.docs_src }}/_build/**
            /tmp/sphinx-err-*.log
          retention-days: 7
