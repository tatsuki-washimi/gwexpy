name: PR Fast

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/pull_request_template.md"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    name: Ruff, mypy, pytest, and smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7
        # Review evidence is bound to the parent S commit, which must remain
        # available when this job validates the resulting R commit.
        with:
          fetch-depth: 0

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          # tests/docs/test_docs_redesign_release_facts.py reads the JA
          # changelog catalog with babel.messages.pofile (the same library
          # sphinx-intl uses internally).
          extras: "babel docutils sphinx"

      - name: Run PR-fast gate
        run: python scripts/ci/run_gate.py pr-fast

      - name: Check release artifact hygiene
        run: |
          python -m build --sdist --wheel --no-isolation
          python scripts/check_release_artifacts.py dist

  io-contract-gate:
    name: Core I/O contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy

      - name: Run I/O contract tests
        run: python scripts/ci/run_gate.py io-contract

  io-conformance-gate:
    name: I/O conformance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy

      - name: Run I/O conformance tests
        run: python scripts/ci/run_gate.py io-conformance

  io-optional-gate:
    name: Optional dependency gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          extras: "freezegun xarray netCDF4 nptdms pydub tinytag"

      - name: Run optional dependency tests
        run: python scripts/ci/run_gate.py io-optional

  io-gwf-gate:
    name: GWF I/O release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          extras: "lalsuite"

      - name: Run GWF I/O release gate
        run: python scripts/ci/run_gate.py io-gwf

  io-netcdf-gate:
    name: NetCDF I/O release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          extras: "xarray netCDF4"

      - name: Run NetCDF I/O release gate
        run: python scripts/ci/run_gate.py io-netcdf

  io-mth5-gate:
    name: MTH5 I/O gate (${{ matrix.mth5-spec }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mth5-spec: ["mth5==0.6.8", "mth5"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          # mt-io 0.0.4 declares ObsPy as optional but imports its MiniSEED
          # reader eagerly. Match gwexpy's existing seismic extra so the
          # isolated mth5 cells exercise the published installation contract.
          extras: "${{ matrix.mth5-spec }} 'obspy<2'"

      - name: Run MTH5 I/O release gate
        run: python scripts/ci/run_gate.py io-mth5

  interop-root-gate:
    name: ROOT interoperability release gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
      GWEXPY_RUN_ROOT: "1"
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          conda-packages: "root_base=6.36.*"

      - name: Run ROOT interoperability release gate
        run: python scripts/ci/run_gate.py interop-root

  interop-contract-gate:
    name: Interop contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy

      - name: Run interop contract tests
        run: python scripts/ci/run_gate.py interop-contract

  interop-mne-gate:
    name: Interop MNE gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        # Fail fast: a hung `git fetch` must not consume the whole job budget
        # while masquerading as a cancelled run (#629).
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up gwexpy environment
        uses: ./.github/actions/setup-gwexpy
        with:
          # Pinned to a known-good major range (see #493) so an unannounced
          # mne major bump can't silently change epoch/meas_date behavior.
          # Quoted: unquoted "mne<2" is parsed by the run step's shell as
          # stdin redirection ("pip install mne <2"), not a version pin.
          extras: "'mne<2'"

      - name: Run MNE interop tests
        run: python scripts/ci/run_gate.py interop-mne
