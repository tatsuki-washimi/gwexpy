name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing final-release tag or full 40-character candidate SHA
        required: true
        type: string
      expected_tag:
        description: Final-release tag expected from the checked-out source
        required: true
        type: string
      review_evidence:
        description: Repository-relative canonical review evidence at reviewed commit S
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
      version: ${{ steps.validate.outputs.version }}
      artifact_prefix: ${{ steps.validate.outputs.artifact_prefix }}
      review_evidence: ${{ steps.validate.outputs.review_evidence }}
      tag_object_sha: ${{ steps.validate.outputs.tag_object_sha }}
      promotion_enabled: ${{ steps.profile.outputs.promotion_enabled }}
      qualify: ${{ steps.profile.outputs.qualify }}
      diaggui_qualification: ${{ steps.profile.outputs.diaggui_qualification }}
      cross_format_io: ${{ steps.profile.outputs.cross_format_io }}
    steps:
      - name: Check out workflow revision for validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: control

      - name: Check out requested source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          # Full history is required for release ancestry validation.
          fetch-depth: 0
          path: source

      - name: Enforce manual control revision
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "workflow_dispatch must run with --ref main" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Fetch frozen protected branch tips
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
        run: |
          if ! protected_refs_output="$(python control/scripts/ci/release_contract.py --protected-ref "$EXPECTED_TAG")"; then
            echo "release contract lookup failed" >&2
            exit 1
          fi
          if [[ -z "$protected_refs_output" ]]; then
            echo "release contract has no protected refs" >&2
            exit 1
          fi
          mapfile -t protected_refs <<< "$protected_refs_output"
          if (( ${#protected_refs[@]} == 0 )); then
            echo "release contract has no protected refs" >&2
            exit 1
          fi
          for protected_ref in "${protected_refs[@]}"; do
            git -C source fetch origin "+refs/heads/${protected_ref}:refs/remotes/origin/${protected_ref}"
          done

      - name: Validate metadata, tag mode, ancestry, and frozen tips
        id: validate
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
          REVIEW_EVIDENCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.review_evidence || '' }}
        run: |
          canonical_review_evidence="$(python control/scripts/ci/release_contract.py --review-evidence-path "$EXPECTED_TAG")"
          if [[ -z "$canonical_review_evidence" ]]; then
            echo "release contract has no review evidence path" >&2
            exit 1
          fi
          if [[ -n "$REVIEW_EVIDENCE_INPUT" && "$REVIEW_EVIDENCE_INPUT" != "$canonical_review_evidence" ]]; then
            echo "review evidence input does not match the configured path" >&2
            exit 1
          fi
          result="$(python control/scripts/validate_release.py --repo-root source --release-ref "$RELEASE_REF" --expected-tag "$EXPECTED_TAG" --review-evidence "$canonical_review_evidence" --frozen-tip)"
          printf '%s\n' "$result"
          printf '%s\n' "$result" | awk -F= '
            /^source_sha=/ {print "source_sha=" $2}
            /^version=/ {print "version=" $2}
            /^artifact_prefix=/ {print "artifact_prefix=" $2}
          ' >> "$GITHUB_OUTPUT"
          tag_object_sha=""
          if git -C source cat-file -e "refs/tags/$EXPECTED_TAG^{tag}" 2>/dev/null; then
            tag_object_sha="$(git -C source rev-parse "refs/tags/$EXPECTED_TAG")"
          fi
          printf 'tag_object_sha=%s\n' "$tag_object_sha" >> "$GITHUB_OUTPUT"
          printf 'review_evidence=%s\n' "$canonical_review_evidence" >> "$GITHUB_OUTPUT"

      - name: Resolve contract-selected candidate qualification profile
        id: profile
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: python control/scripts/ci/release_promotion.py profile --version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub human approval for the reviewed source
        if: steps.validate.outputs.version == '0.2.4' || steps.validate.outputs.version == '0.2.5' || steps.profile.outputs.promotion_enabled == 'true'
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
          REVIEW_EVIDENCE: ${{ steps.validate.outputs.review_evidence }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python control/scripts/ci/verify_release_human_approval.py \
            --repo-root source \
            --evidence "$REVIEW_EVIDENCE" \
            --expected-tag "$EXPECTED_TAG" \
            --repository "$GITHUB_REPOSITORY"

  build:
    name: Build and check release artifacts
    needs: verify
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Build a two-file payload and detached sidecars
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python -m pip install --require-hashes -r requirements/release-build.txt
          mkdir release-payload release-sidecars
          python -m build --no-isolation --sdist --wheel --outdir release-payload
          python scripts/ci/validate_release_payload.py \
            --payload-dir release-payload \
            --manifest release-sidecars/distribution-sha256.json \
            --expected-version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --write-manifest
          python scripts/ci/validate_release_payload.py \
            --payload-dir release-payload \
            --manifest release-sidecars/distribution-sha256.json \
            --expected-version "$VERSION"
          python scripts/check_release_artifacts.py release-payload
          twine check --strict release-payload/*
          sha256sum LICENSE.txt | awk '{print $1}' > release-sidecars/LICENSE.sha256

      - name: Upload PyPI payload only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: source/release-payload
          if-no-files-found: error
          retention-days: 90

      - name: Upload release sidecars separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sidecar-distribution-sha256.json-${{ needs.verify.outputs.source_sha }}
          path: source/release-sidecars/distribution-sha256.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload license sidecar separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sidecar-LICENSE.sha256-${{ needs.verify.outputs.source_sha }}
          path: source/release-sidecars/LICENSE.sha256
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Smoke-test ${{ matrix.distribution }} on Python ${{ matrix.python-version }}
    needs: [verify, build]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        distribution: [wheel, sdist]
    steps:
      - name: Check out frozen validator revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          path: control

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download PyPI payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download detached sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Install and attest the exact selected distribution
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          DISTRIBUTION: ${{ matrix.distribution }}
          REPORT: ${{ runner.temp }}/python-${{ matrix.python-version }}-${{ matrix.distribution }}.json
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          artifact_name="$(python control/scripts/ci/validate_release_payload.py --payload-dir "${{ runner.temp }}/release-payload" --manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" --expected-version "$EXPECTED_VERSION" --kind "$DISTRIBUTION")"
          artifact="${{ runner.temp }}/release-payload/$artifact_name"
          expected_license_hash_file="${{ runner.temp }}/release-sidecars/LICENSE.sha256"
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$artifact"
          "$smoke_dir/venv/bin/python" - "$artifact" "$expected_license_hash_file" "$REPORT" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import tarfile
          import zipfile
          import gwexpy
          from gwexpy import TimeSeries

          artifact, expected_license_hash_file, report_path = map(Path, sys.argv[1:])
          expected_license_hash = expected_license_hash_file.read_text(encoding="ascii").strip()
          if artifact.suffix == ".whl":
              with zipfile.ZipFile(artifact) as archive:
                  copies = [archive.read(info) for info in archive.infolist() if Path(info.filename).name == "LICENSE.txt"]
          else:
              with tarfile.open(artifact, "r:*") as archive:
                  copies = [archive.extractfile(info).read() for info in archive.getmembers() if Path(info.name).name == "LICENSE.txt" and info.isfile()]
          assert len(copies) == 1
          embedded_license_hash = hashlib.sha256(copies[0]).hexdigest()
          assert embedded_license_hash == expected_license_hash
          assert gwexpy.__version__ == os.environ["EXPECTED_VERSION"]
          gwexpy.register_all()
          assert Path(gwexpy.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert len(TimeSeries([0.0, 1.0], t0=0, dt=1)) == 2
          report_path.write_text(json.dumps({
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"], "python": os.environ["PYTHON_VERSION"],
              "distribution": {"kind": os.environ["DISTRIBUTION"], "file": artifact.name, "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest()},
              "repository_license_sha256": expected_license_hash,
              "embedded_license_sha256": embedded_license_hash, "installed_version": gwexpy.__version__,
              "import_ok": True, "register_all_ok": True, "smoke_ok": True,
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload fixed-name smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-smoke-${{ needs.verify.outputs.source_sha }}-python-${{ matrix.python-version }}-${{ matrix.distribution }}
          path: ${{ runner.temp }}/python-${{ matrix.python-version }}-${{ matrix.distribution }}.json
          if-no-files-found: error
          retention-days: 90

  qualify:
    name: Qualify ${{ matrix.cell }}
    needs: [verify, build]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && (needs.verify.outputs.version == '0.2.2' || needs.verify.outputs.version == '0.2.3' || needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.qualify == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: install-ubuntu-3.11-wheel, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.11-sdist, os: ubuntu-latest, python: "3.11", distribution: sdist, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.12-wheel, os: ubuntu-latest, python: "3.12", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.12-sdist, os: ubuntu-latest, python: "3.12", distribution: sdist, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.13-wheel, os: ubuntu-latest, python: "3.13", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.13-sdist, os: ubuntu-latest, python: "3.13", distribution: sdist, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.14-wheel, os: ubuntu-latest, python: "3.14", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-ubuntu-3.14-sdist, os: ubuntu-latest, python: "3.14", distribution: sdist, runtime: pip, extras: pytest}
          - {cell: install-macos-3.11-wheel, os: macos-latest, python: "3.11", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-macos-3.14-wheel, os: macos-latest, python: "3.14", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-windows-3.11-wheel, os: windows-latest, python: "3.11", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: install-windows-3.14-wheel, os: windows-latest, python: "3.14", distribution: wheel, runtime: pip, extras: pytest}
          - {cell: gwpy-4.0.1-wheel, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: pip, extras: "pytest gwpy==4.0.1"}
          - {cell: gwpy-4.0.2-wheel, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: pip, extras: "pytest gwpy==4.0.2"}
          - {cell: sdist-3.12-claims, os: ubuntu-latest, python: "3.12", distribution: sdist, runtime: pip, extras: pytest}
          - {cell: conda-3.11, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: conda, extras: pytest}
          - {cell: conda-3.14, os: ubuntu-latest, python: "3.14", distribution: wheel, runtime: conda, extras: pytest}
          - {cell: scientific-3.11-wheel, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: pip, extras: "pytest mne lalsuite"}
          - {cell: docs-en-ja-3.11-wheel, os: ubuntu-latest, python: "3.11", distribution: wheel, runtime: pip, extras: "pytest matplotlib"}
    steps:
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out verified qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        if: matrix.runtime == 'pip'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Set up conda runtime
        if: matrix.runtime == 'conda'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-name: qualification
          create-args: python=${{ matrix.python }} pip
          init-shell: bash
          generate-run-shell: false

      - name: Download PyPI payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download detached sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Verify qualification payload digest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          python source/scripts/ci/validate_release_payload.py \
            --payload-dir "${{ runner.temp }}/release-payload" \
            --manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" \
            --expected-version "$EXPECTED_VERSION" \
            --kind "$DISTRIBUTION"

      - name: Install digest-checked distribution and qualification dependencies
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
        run: |
          artifact_name="$(python source/scripts/ci/validate_release_payload.py --payload-dir "${{ runner.temp }}/release-payload" --manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" --expected-version "$EXPECTED_VERSION" --kind "$DISTRIBUTION")"
          artifact="${{ runner.temp }}/release-payload/$artifact_name"
          if [[ "${{ matrix.runtime }}" == "conda" ]]; then
            micromamba run -n qualification python -m pip install --disable-pip-version-check --no-cache-dir "$artifact" ${{ matrix.extras }}
            micromamba run -n qualification python -m pip check
          else
            python -m pip install --disable-pip-version-check --no-cache-dir "$artifact" ${{ matrix.extras }}
            python -m pip check
          fi

      - name: Run installed candidate compatibility contracts
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          JUNIT: ${{ runner.temp }}/qualification-report/pytest.xml
        run: |
          runner=(python)
          if [[ "${{ matrix.runtime }}" == "conda" ]]; then runner=(micromamba run -n qualification python); fi
          cp -R source/tests "${{ runner.temp }}/qualification-tests"
          "${runner[@]}" -c "import gwexpy; assert gwexpy.__version__ == '$EXPECTED_VERSION'; assert 'site-packages' in gwexpy.__file__; print(gwexpy.__file__)"
          tests=(
            "${{ runner.temp }}/qualification-tests/test_import_order.py"
            "${{ runner.temp }}/qualification-tests/io/test_frequencyseries_registration.py"
            "${{ runner.temp }}/qualification-tests/timeseries/test_exact_gps_epoch.py"
            "${{ runner.temp }}/qualification-tests/timeseries/test_hdf5_exact_epoch_codec.py"
            "${{ runner.temp }}/qualification-tests/timeseries/test_gwpy_behavioral_compatibility.py"
          )
          case "$EXPECTED_VERSION" in
            0.2.2)
              "${runner[@]}" -m pytest --import-mode=importlib -q "${tests[@]}"
              ;;
            0.2.3)
              python -c 'import os; from pathlib import Path; Path(os.environ["JUNIT"]).parent.mkdir(parents=True, exist_ok=True)'
              "${runner[@]}" -m pytest --junitxml="$JUNIT" --import-mode=importlib -q "${tests[@]}"
              ;;
            0.2.4|0.2.5)
              python -c 'import os; from pathlib import Path; Path(os.environ["JUNIT"]).parent.mkdir(parents=True, exist_ok=True)'
              "${runner[@]}" -m pytest --junitxml="$JUNIT" --import-mode=importlib -q "${tests[@]}"
              ;;
            *)
              profile="$(python source/scripts/ci/release_promotion.py profile --version "$EXPECTED_VERSION")"
              if ! grep -Fxq 'qualification_profile=gwexpy-standard-v1' <<< "$profile" || ! grep -Fxq 'qualify=true' <<< "$profile"; then
                echo "unsupported qualification profile for $EXPECTED_VERSION" >&2
                exit 1
              fi
              python -c 'import os; from pathlib import Path; Path(os.environ["JUNIT"]).parent.mkdir(parents=True, exist_ok=True)'
              "${runner[@]}" -m pytest --junitxml="$JUNIT" --import-mode=importlib -q "${tests[@]}"
              ;;
          esac

      - name: Record qualification cell digest evidence (v0.2.2 historical)
        if: needs.verify.outputs.version == '0.2.2'
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPORT: ${{ runner.temp }}/qualification-report/qualification.json
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
        run: |
          mkdir -p "$(dirname "$REPORT")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ["PAYLOAD_MANIFEST"]).read_text(encoding="utf-8"))
          report = {"cell": os.environ["CELL"], "source_sha": os.environ["SOURCE_SHA"], "version": os.environ["VERSION"], "files": payload["files"], "status": "passed"}
          Path(os.environ["REPORT"]).write_text(json.dumps(report, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Record qualification cell skip evidence (v0.2.3)
        if: needs.verify.outputs.version == '0.2.3'
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPORT: ${{ runner.temp }}/qualification-report/qualification.json
          JUNIT: ${{ runner.temp }}/qualification-report/pytest.xml
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          EXPECTED_SKIPS: source/scripts/ci/v023_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py record \
            --version "$VERSION" \
            --cell "$CELL" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --report "$REPORT" \
            --junit "$JUNIT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Record qualification cell skip evidence (v0.2.4)
        if: needs.verify.outputs.version == '0.2.4'
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPORT: ${{ runner.temp }}/qualification-report/qualification.json
          JUNIT: ${{ runner.temp }}/qualification-report/pytest.xml
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          EXPECTED_SKIPS: source/scripts/ci/v024_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py record \
            --version "$VERSION" \
            --cell "$CELL" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --report "$REPORT" \
            --junit "$JUNIT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Record qualification cell skip evidence (v0.2.5)
        if: needs.verify.outputs.version == '0.2.5'
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPORT: ${{ runner.temp }}/qualification-report/qualification.json
          JUNIT: ${{ runner.temp }}/qualification-report/pytest.xml
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          EXPECTED_SKIPS: source/scripts/ci/v025_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py record \
            --version "$VERSION" \
            --cell "$CELL" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --report "$REPORT" \
            --junit "$JUNIT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Record contract-selected future qualification evidence
        if: needs.verify.outputs.promotion_enabled == 'true'
        shell: bash
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPORT: ${{ runner.temp }}/qualification-report/qualification.json
          JUNIT: ${{ runner.temp }}/qualification-report/pytest.xml
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
        run: |
          python source/scripts/ci/qualification_evidence.py record \
            --version "$VERSION" \
            --cell "$CELL" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --report "$REPORT" \
            --junit "$JUNIT"

      - name: Upload qualification cell evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-qualification-${{ needs.verify.outputs.source_sha }}-${{ matrix.cell }}
          path: ${{ runner.temp }}/qualification-report/qualification.json
          if-no-files-found: error
          retention-days: 90

  qualification_evidence:
    name: Aggregate nineteen qualification cells
    needs: [verify, build, qualify]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && (needs.verify.outputs.version == '0.2.2' || needs.verify.outputs.version == '0.2.3' || needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.qualify == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verified qualification source
        if: needs.verify.outputs.version == '0.2.3' || needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.promotion_enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        if: needs.verify.outputs.version == '0.2.3' || needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.promotion_enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Download all qualification cell evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-qualification-${{ needs.verify.outputs.source_sha }}-*
          path: ${{ runner.temp }}/qualification-cells

      - name: Download detached sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Select qualification evidence contract
        id: qualification_contract
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          case "$VERSION" in
            0.2.2)
              printf '%s\n' 'evidence_schema=gwexpy-v022-qualification-evidence-v1' 'artifact_prefix=v022-qualification-evidence' >> "$GITHUB_OUTPUT"
              ;;
            0.2.3)
              python source/scripts/ci/qualification_evidence.py contract \
                --version "$VERSION" >> "$GITHUB_OUTPUT"
              ;;
            0.2.4|0.2.5)
              python source/scripts/ci/qualification_evidence.py contract \
                --version "$VERSION" >> "$GITHUB_OUTPUT"
              ;;
            *)
              python source/scripts/ci/qualification_evidence.py contract --version "$VERSION" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Assert historical v0.2.2 same-payload qualification ledger
        if: needs.verify.outputs.version == '0.2.2'
        env:
          CELLS: ${{ runner.temp }}/qualification-cells
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          OUTPUT: ${{ runner.temp }}/qualification-manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          expected_cells = {"install-ubuntu-3.11-wheel", "install-ubuntu-3.11-sdist", "install-ubuntu-3.12-wheel", "install-ubuntu-3.12-sdist", "install-ubuntu-3.13-wheel", "install-ubuntu-3.13-sdist", "install-ubuntu-3.14-wheel", "install-ubuntu-3.14-sdist", "install-macos-3.11-wheel", "install-macos-3.14-wheel", "install-windows-3.11-wheel", "install-windows-3.14-wheel", "gwpy-4.0.1-wheel", "gwpy-4.0.2-wheel", "sdist-3.12-claims", "conda-3.11", "conda-3.14", "scientific-3.11-wheel", "docs-en-ja-3.11-wheel"}
          payload = json.loads(Path(os.environ["PAYLOAD_MANIFEST"]).read_text(encoding="utf-8"))
          reports = [json.loads(path.read_text(encoding="utf-8")) for path in Path(os.environ["CELLS"]).rglob("qualification.json")]
          observed = {report["cell"] for report in reports}
          assert len(reports) == 19 and observed == expected_cells
          for report in reports:
              assert report == {"cell": report["cell"], "source_sha": os.environ["SOURCE_SHA"], "version": os.environ["VERSION"], "files": payload["files"], "status": "passed"}
          output = {"schema": "gwexpy-v022-qualification-evidence-v1", "source_sha": os.environ["SOURCE_SHA"], "version": os.environ["VERSION"], "files": payload["files"], "cells": sorted(observed)}
          Path(os.environ["OUTPUT"]).write_text(json.dumps(output, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Assert v0.2.3 skip and same-payload qualification ledger
        if: needs.verify.outputs.version == '0.2.3'
        env:
          CELLS: ${{ runner.temp }}/qualification-cells
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          OUTPUT: ${{ runner.temp }}/qualification-manifest.json
          EXPECTED_SKIPS: source/scripts/ci/v023_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py aggregate \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --reports-dir "$CELLS" \
            --output "$OUTPUT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Assert v0.2.4 skip and same-payload qualification ledger
        if: needs.verify.outputs.version == '0.2.4'
        env:
          CELLS: ${{ runner.temp }}/qualification-cells
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          OUTPUT: ${{ runner.temp }}/qualification-manifest.json
          EXPECTED_SKIPS: source/scripts/ci/v024_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py aggregate \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --reports-dir "$CELLS" \
            --output "$OUTPUT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Assert v0.2.5 skip and same-payload qualification ledger
        if: needs.verify.outputs.version == '0.2.5'
        env:
          CELLS: ${{ runner.temp }}/qualification-cells
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          OUTPUT: ${{ runner.temp }}/qualification-manifest.json
          EXPECTED_SKIPS: source/scripts/ci/v025_qualification_expected_skips.json
        run: |
          python source/scripts/ci/qualification_evidence.py aggregate \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --reports-dir "$CELLS" \
            --output "$OUTPUT" \
            --expected-skips "$EXPECTED_SKIPS"

      - name: Assert contract-selected future qualification ledger
        if: needs.verify.outputs.promotion_enabled == 'true'
        env:
          CELLS: ${{ runner.temp }}/qualification-cells
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          VERSION: ${{ needs.verify.outputs.version }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          OUTPUT: ${{ runner.temp }}/qualification-manifest.json
        run: |
          python source/scripts/ci/qualification_evidence.py aggregate \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --reports-dir "$CELLS" \
            --output "$OUTPUT"

      - name: Upload qualification manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.qualification_contract.outputs.artifact_prefix }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/qualification-manifest.json
          if-no-files-found: error
          retention-days: 90

  diaggui_qualification:
    name: Qualify installed DiagGUI routes (${{ matrix.cell }})
    needs: [verify, build]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && ((needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: base-wheel, mode: base, distribution: wheel}
          - {cell: base-sdist, mode: base, distribution: sdist}
          - {cell: dttxml-wheel, mode: dttxml, distribution: wheel}
          - {cell: dttxml-sdist, mode: dttxml, distribution: sdist}
    steps:
      - name: Check out verified DiagGUI qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Download the candidate payload and sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download detached candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Create an isolated candidate environment
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          DISTRIBUTION: ${{ matrix.distribution }}
          MODE: ${{ matrix.mode }}
        run: |
          python -m venv "${{ runner.temp }}/diaggui-venv"
          python="${{ runner.temp }}/diaggui-venv/bin/python"
          artifact_name="$(python source/scripts/ci/validate_release_payload.py \
            --payload-dir "${{ runner.temp }}/release-payload" \
            --manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" \
            --expected-version "$EXPECTED_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --kind "$DISTRIBUTION")"
          artifact="${{ runner.temp }}/release-payload/$artifact_name"
          "$python" -m pip install --disable-pip-version-check --no-cache-dir "$artifact" pytest
          if [[ "$MODE" == "dttxml" ]]; then
            "$python" -m pip install --disable-pip-version-check --no-cache-dir dttxml==1.1.8
          fi
          "$python" -m pip check
          "$python" -c "import importlib.util, gwexpy; assert gwexpy.__version__ == '$EXPECTED_VERSION'; assert 'site-packages' in gwexpy.__file__; expected = '$MODE' == 'dttxml'; present = importlib.util.find_spec('dttxml') is not None; assert present is expected; print(gwexpy.__file__)"

      - name: Run explicit installed DiagGUI qualification node list
        env:
          MODE: ${{ matrix.mode }}
          JUNIT: ${{ runner.temp }}/diaggui-report/pytest.xml
        run: |
          python="${{ runner.temp }}/diaggui-venv/bin/python"
          tests_dir="${{ runner.temp }}/diaggui-tests"
          mkdir -p "$tests_dir/io" "$(dirname "$JUNIT")"
          cp source/tests/io/test_dttxml_issue730.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_issue731.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_issue726.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_issue732.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_issue733.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_issue734.py "$tests_dir/io/"
          cp source/tests/io/test_dttxml_common.py "$tests_dir/io/"
          mapfile -t tests < <(python source/scripts/ci/diaggui_qualification_evidence.py test-nodes --mode "$MODE" | sed "s#^#diaggui-tests/#")
          cd "${{ runner.temp }}"
          "$python" -m pytest --import-mode=importlib --junitxml="$JUNIT" -q "${tests[@]}"

      - name: Record installed DiagGUI facts and skip set
        env:
          CELL: ${{ matrix.cell }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          DISTRIBUTION: ${{ matrix.distribution }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          JUNIT: ${{ runner.temp }}/diaggui-report/pytest.xml
          REPORT: ${{ runner.temp }}/diaggui-report/diaggui-qualification.json
        run: |
          python="${{ runner.temp }}/diaggui-venv/bin/python"
          artifact_name="$(python source/scripts/ci/validate_release_payload.py \
            --payload-dir "$PAYLOAD_DIR" \
            --manifest "$PAYLOAD_MANIFEST" \
            --expected-version "$EXPECTED_VERSION" \
            --source-sha "$SOURCE_SHA" \
            --kind "$DISTRIBUTION")"
          artifact="$PAYLOAD_DIR/$artifact_name"
          "$python" source/scripts/ci/diaggui_qualification_evidence.py record \
            --version "$EXPECTED_VERSION" \
            --cell "$CELL" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --artifact "$artifact" \
            --junit "$JUNIT" \
            --report "$REPORT"

      - name: Upload DiagGUI cell evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-diaggui-qualification-${{ needs.verify.outputs.source_sha }}-${{ matrix.cell }}
          path: ${{ runner.temp }}/diaggui-report/diaggui-qualification.json
          if-no-files-found: error
          retention-days: 90

  diaggui_qualification_evidence:
    name: Aggregate four DiagGUI qualification cells
    needs: [verify, build, diaggui_qualification]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && (!cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' && ((needs.verify.outputs.version != '0.2.4' && needs.verify.outputs.version != '0.2.5' && needs.verify.outputs.diaggui_qualification != 'true') || needs.diaggui_qualification.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark historical release as having no DiagGUI lane
        if: (needs.verify.outputs.version != '0.2.4' && needs.verify.outputs.version != '0.2.5' && needs.verify.outputs.diaggui_qualification != 'true')
        run: echo "DiagGUI qualification applies to v0.2.4 and v0.2.5 only"

      - name: Check out verified DiagGUI aggregate source
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python for DiagGUI aggregate
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Download all DiagGUI cell evidence
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-diaggui-qualification-${{ needs.verify.outputs.source_sha }}-*
          path: ${{ runner.temp }}/diaggui-cells

      - name: Download detached DiagGUI candidate manifest
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Assert four candidate-bound DiagGUI reports
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          REPORTS_DIR: ${{ runner.temp }}/diaggui-cells
          OUTPUT: ${{ runner.temp }}/diaggui-qualification-manifest.json
        run: |
          python source/scripts/ci/diaggui_qualification_evidence.py aggregate \
            --version "${{ needs.verify.outputs.version }}" \
            --source-sha "$SOURCE_SHA" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --reports-dir "$REPORTS_DIR" \
            --output "$OUTPUT"

      - name: Upload DiagGUI qualification manifest
        if: (needs.verify.outputs.version == '0.2.4' || needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.diaggui_qualification == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.verify.outputs.promotion_enabled == 'true' && 'gwexpy-diaggui-qualification-evidence-v1' || (needs.verify.outputs.version == '0.2.4' && 'v024-diaggui-qualification-evidence' || 'v025-diaggui-qualification-evidence') }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/diaggui-qualification-manifest.json
          if-no-files-found: error
          retention-days: 90

  cross_format_io:
    name: Qualify installed cross-format I/O (${{ matrix.cell }})
    needs: [verify, build]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && ((needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cell: base-3.11-wheel, mode: base, python: '3.11', distribution: wheel}
          - {cell: base-3.11-sdist, mode: base, python: '3.11', distribution: sdist}
          - {cell: base-3.12-wheel, mode: base, python: '3.12', distribution: wheel}
          - {cell: base-3.12-sdist, mode: base, python: '3.12', distribution: sdist}
          - {cell: optional-3.11-wheel, mode: optional, python: '3.11', distribution: wheel}
          - {cell: optional-3.11-sdist, mode: optional, python: '3.11', distribution: sdist}
          - {cell: optional-3.12-wheel, mode: optional, python: '3.12', distribution: wheel}
          - {cell: optional-3.12-sdist, mode: optional, python: '3.12', distribution: sdist}
    steps:
      - name: Check out verified I/O source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Download same-run candidate payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download detached candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Install digest-checked candidate and run selected public regressions
        env:
          CELL: ${{ matrix.cell }}
          MODE: ${{ matrix.mode }}
          DISTRIBUTION: ${{ matrix.distribution }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          JUNIT: ${{ runner.temp }}/cross-format-io-report/pytest.xml
          REPORT: ${{ runner.temp }}/cross-format-io-report/cross-format-io.json
        run: |
          python -m venv "${{ runner.temp }}/cross-format-io-venv"
          python="${{ runner.temp }}/cross-format-io-venv/bin/python"
          artifact_name="$(python source/scripts/ci/validate_release_payload.py \
            --payload-dir "$PAYLOAD_DIR" --manifest "$PAYLOAD_MANIFEST" \
            --expected-version "${{ needs.verify.outputs.version }}" --source-sha "$SOURCE_SHA" --kind "$DISTRIBUTION")"
          artifact="$PAYLOAD_DIR/$artifact_name"
          if [[ "$MODE" == optional ]]; then
            "$python" -m pip install --disable-pip-version-check --no-cache-dir "${artifact}[io,netcdf4,zarr]" pytest
          else
            "$python" -m pip install --disable-pip-version-check --no-cache-dir "$artifact" pytest
          fi
          "$python" -m pip check
          mkdir -p "${{ runner.temp }}/cross-format-io-tests/io" "$(dirname "$JUNIT")"
          cp source/tests/io/test_optional_deps.py source/tests/io/test_hdf5_manifest_collection_integrity.py \
            source/tests/io/test_gbd_gl500_header_validation.py \
            source/tests/io/test_netcdf4_matrix_validation.py source/tests/io/test_zarr_reader.py \
            source/tests/io/test_tdms_invalid_increment_contract.py \
            "${{ runner.temp }}/cross-format-io-tests/io/"
          mapfile -t tests < <(python source/scripts/ci/v025_cross_format_io_evidence.py --version "${{ needs.verify.outputs.version }}" test-nodes --mode "$MODE" | sed "s#^#cross-format-io-tests/#")
          cd "${{ runner.temp }}"
          GWEXPY_ALLOW_ZARR=1 "$python" -m pytest --import-mode=importlib --junitxml="$JUNIT" -q "${tests[@]}"
          "$python" "$GITHUB_WORKSPACE/source/scripts/ci/v025_cross_format_io_evidence.py" --version "${{ needs.verify.outputs.version }}" record \
            --cell "$CELL" --source-sha "$SOURCE_SHA" --payload-manifest "$PAYLOAD_MANIFEST" \
            --artifact "$artifact" --junit "$JUNIT" --report "$REPORT"

      - name: Upload cross-format I/O cell evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-cross-format-io-${{ needs.verify.outputs.source_sha }}-${{ matrix.cell }}
          path: ${{ runner.temp }}/cross-format-io-report/cross-format-io.json
          if-no-files-found: error
          retention-days: 90

  cross_format_io_evidence:
    name: Aggregate eight cross-format I/O cells
    needs: [verify, build, cross_format_io]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && (!cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' && ((needs.verify.outputs.version != '0.2.5' && needs.verify.outputs.cross_format_io != 'true') || needs.cross_format_io.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark historical release as having no cross-format I/O lane
        if: (needs.verify.outputs.version != '0.2.5' && needs.verify.outputs.cross_format_io != 'true')
        run: echo "Cross-format I/O qualification applies to v0.2.5 only"

      - name: Check out verified I/O aggregate source
        if: (needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Download all I/O cell reports
        if: (needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-cross-format-io-${{ needs.verify.outputs.source_sha }}-*
          path: ${{ runner.temp }}/cross-format-io-cells

      - name: Download detached candidate manifest
        if: (needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Assert eight candidate-bound I/O reports
        if: (needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')
        run: |
          python source/scripts/ci/v025_cross_format_io_evidence.py --version "${{ needs.verify.outputs.version }}" aggregate \
            --source-sha "${{ needs.verify.outputs.source_sha }}" \
            --payload-manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" \
            --reports-dir "${{ runner.temp }}/cross-format-io-cells" \
            --output "${{ runner.temp }}/cross-format-io-manifest.json"

      - name: Upload I/O qualification manifest
        if: (needs.verify.outputs.version == '0.2.5' || needs.verify.outputs.cross_format_io == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.verify.outputs.promotion_enabled == 'true' && 'gwexpy-cross-format-io-evidence-v1' || 'v025-cross-format-io-evidence' }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/cross-format-io-manifest.json
          if-no-files-found: error
          retention-days: 90

  historical_74_gate:
    name: Enforce v0.2.5 historical 62 passes and 12 owner dispositions
    needs: [verify, build]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact release source and historical probes
        if: needs.verify.outputs.version == '0.2.5'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up historical qualification Python
        if: needs.verify.outputs.version == '0.2.5'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install and verify ffmpeg for historical audio regressions
        if: needs.verify.outputs.version == '0.2.5'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          command -v ffmpeg
          ffmpeg -version

      - name: Download exact candidate payload
        if: needs.verify.outputs.version == '0.2.5'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download detached payload manifest
        if: needs.verify.outputs.version == '0.2.5'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Run historical probes and fixed regressions on both installed artifacts
        if: needs.verify.outputs.version == '0.2.5'
        env:
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          REVIEW_EVIDENCE: ${{ needs.verify.outputs.review_evidence }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          PAYLOAD_MANIFEST: ${{ runner.temp }}/release-sidecars/distribution-sha256.json
          HISTORICAL_WORK: ${{ runner.temp }}/historical-74
        run: |
          for kind in wheel sdist; do
            python source/scripts/ci/v025_historical_gate.py run \
              --source-root "$GITHUB_WORKSPACE/source" \
              --payload-dir "$PAYLOAD_DIR" \
              --payload-manifest "$PAYLOAD_MANIFEST" \
              --source-sha "$SOURCE_SHA" --kind "$kind" \
              --work "$HISTORICAL_WORK/$kind"
          done
          python source/scripts/ci/v025_historical_gate.py finalize \
            --source-root "$GITHUB_WORKSPACE/source" \
            --payload-dir "$PAYLOAD_DIR" \
            --payload-manifest "$PAYLOAD_MANIFEST" \
            --source-sha "$SOURCE_SHA" \
            --wheel-work "$HISTORICAL_WORK/wheel" \
            --sdist-work "$HISTORICAL_WORK/sdist" \
            --approval "$GITHUB_WORKSPACE/source/$REVIEW_EVIDENCE" \
            --output-dir "$HISTORICAL_WORK/evidence"

      - name: Upload exact-candidate historical gate evidence
        if: needs.verify.outputs.version == '0.2.5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v025-historical-74-gate-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/historical-74/evidence
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed historical regression JUnit diagnostics
        if: failure() && needs.verify.outputs.version == '0.2.5'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v025-historical-74-fixed-junit-diagnostics-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/historical-74/*/fixed.xml
          if-no-files-found: warn
          retention-days: 30

  evidence:
    name: Collect same-run integration evidence
    needs: [verify, build, smoke]
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out verified collector revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 1
          path: source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Download detached sidecars from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Download smoke reports from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-smoke-${{ needs.verify.outputs.source_sha }}-*
          path: ${{ runner.temp }}/release-smoke
          merge-multiple: true

      - name: Validate source review evidence again for aggregate binding
        if: needs.verify.outputs.promotion_enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python source/scripts/ci/verify_release_human_approval.py \
            --repo-root source --evidence "${{ needs.verify.outputs.review_evidence }}" \
            --expected-tag "v${{ needs.verify.outputs.version }}" --repository "${{ github.repository }}"

      - name: Assemble allowlisted aggregate
        run: |
          mkdir "${{ runner.temp }}/release-evidence"
          python source/scripts/ci/assemble_release_evidence.py \
            --payload-manifest "${{ runner.temp }}/release-sidecars/distribution-sha256.json" \
            --sidecars "${{ runner.temp }}/release-sidecars" \
            --smoke-dir "${{ runner.temp }}/release-smoke" \
            --source-sha "${{ needs.verify.outputs.source_sha }}" \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --workflow-sha "${{ github.workflow_sha }}" \
            --workflow-ref "${{ github.workflow_ref }}" \
            --expected-tag "${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.verify.outputs.promotion_enabled != 'true')) && inputs.expected_tag || github.ref_name }}" \
            --output "${{ runner.temp }}/release-evidence/aggregate.json"

      - name: Bind future aggregate to contract and approved review identity
        if: needs.verify.outputs.promotion_enabled == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python - "$VERSION" "${{ runner.temp }}/release-evidence/aggregate.json" <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "source/scripts/ci")
          from release_promotion import configured_contract, candidate_profile
          contract = configured_contract(sys.argv[1])
          profile = candidate_profile(contract)
          path = Path(sys.argv[2])
          aggregate = json.loads(path.read_bytes())
          review_path = contract["review_evidence_path"]
          raw = (Path("source") / review_path).read_bytes()
          review = json.loads(raw)
          aggregate["schema"] = profile["evidence_schemas"]["gwexpy-integration-evidence-v1"]
          aggregate["review_evidence"] = {"path": review_path, "sha256": hashlib.sha256(raw).hexdigest(), "human_approval": review["human_approval"]}
          path.write_text(json.dumps(aggregate, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PYCODE

      - name: Upload 90-day integration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ needs.verify.outputs.promotion_enabled == 'true' && 'gwexpy-integration-evidence-v1' || needs.verify.outputs.artifact_prefix }}-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-evidence/aggregate.json
          if-no-files-found: error
          retention-days: 90

  promotion_manifest:
    name: Finalize immutable candidate promotion manifest
    needs: [verify, build, smoke, qualify, qualification_evidence, diaggui_qualification, diaggui_qualification_evidence, cross_format_io, cross_format_io_evidence, evidence]
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && needs.verify.outputs.promotion_enabled == 'true' && needs.verify.result == 'success' && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.qualify.result == 'success' && needs.qualification_evidence.result == 'success' && needs.diaggui_qualification.result == 'success' && needs.diaggui_qualification_evidence.result == 'success' && needs.cross_format_io.result == 'success' && needs.cross_format_io_evidence.result == 'success' && needs.evidence.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out frozen finalizer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          path: control
      - name: Check out candidate review and release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          path: source
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Observe original immutable artifact IDs and verify their API archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          python control/scripts/ci/release_promotion.py finalize \
            --version "${{ needs.verify.outputs.version }}" --repo-root source \
            --output "${{ runner.temp }}/promotion-manifest/promotion-manifest.json"
      - name: Upload the sole new manifest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-promotion-manifest-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/promotion-manifest/promotion-manifest.json
          if-no-files-found: error
          retention-days: 90

  github_release:
    name: Create verified GitHub Release
    needs: [verify, build, smoke, qualify, qualification_evidence, diaggui_qualification_evidence, cross_format_io_evidence, historical_74_gate, evidence]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Confirm pushed annotated tag still resolves to verified source
        id: tag_identity
        working-directory: source
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.verify.outputs.tag_object_sha }}
        run: |
          git fetch --no-tags origin "refs/tags/$EXPECTED_TAG:refs/tags/$EXPECTED_TAG"
          if [[ "$(git cat-file -t "refs/tags/$EXPECTED_TAG")" != tag ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi
          actual_source_sha="$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")"
          if [[ "$actual_source_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "pushed tag no longer resolves to verified source" >&2
            exit 1
          fi
          actual_tag_object_sha="$(git rev-parse "refs/tags/$EXPECTED_TAG")"
          if [[ "$actual_tag_object_sha" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo "pushed annotated tag object changed after verification" >&2
            exit 1
          fi
          printf 'tag_object_sha=%s\n' "$actual_tag_object_sha" >> "$GITHUB_OUTPUT"

      - name: Download same-run payload and sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Download same-run sidecars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-sidecar-*-${{ needs.verify.outputs.source_sha }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-sidecars

      - name: Validate exact same-run assets and generate CHANGELOG notes
        working-directory: source
        env:
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          RELEASE_PAYLOAD: ${{ runner.temp }}/release-payload
          RELEASE_SIDECARS: ${{ runner.temp }}/release-sidecars
        run: |
          python scripts/ci/validate_release_payload.py \
            --payload-dir "$RELEASE_PAYLOAD" \
            --manifest "$RELEASE_SIDECARS/distribution-sha256.json" \
            --expected-version "$EXPECTED_VERSION"
          python - "$RELEASE_SIDECARS/distribution-sha256.json" "$EXPECTED_VERSION" "$EXPECTED_SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if manifest.get("version") != sys.argv[2] or manifest.get("source_sha") != sys.argv[3]:
              raise SystemExit("release sidecar does not match the verified source/version")
          PY
          python tools/gen_release_notes.py --version "$EXPECTED_VERSION"
          cp "release_notes/v$EXPECTED_VERSION.md" "$RUNNER_TEMP/release-notes.md"

      - name: Create Release and verify GitHub readback
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_PAYLOAD: ${{ runner.temp }}/release-payload
          RELEASE_SIDECARS: ${{ runner.temp }}/release-sidecars
          RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases-before.json"
          python - "$RUNNER_TEMP/releases-before.json" "$EXPECTED_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          from validate_github_release_readback import validate_no_conflicting_release

          validate_no_conflicting_release(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")), sys.argv[2])
          PY
          gh release create "$EXPECTED_TAG" \
            "$RELEASE_PAYLOAD"/*.whl \
            "$RELEASE_PAYLOAD"/*.tar.gz \
            "$RELEASE_SIDECARS/distribution-sha256.json" \
            "$RELEASE_SIDECARS/LICENSE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$EXPECTED_TAG" \
            --notes-file "$RELEASE_NOTES" \
            --target "$EXPECTED_SOURCE_SHA" \
            --verify-tag
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_TAG" > "$RUNNER_TEMP/release-readback.json"
          gh release download "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-download"
          git ls-remote origin "refs/tags/$EXPECTED_TAG" "refs/tags/$EXPECTED_TAG^{}" > "$RUNNER_TEMP/tag-readback.txt"
          python - "$RUNNER_TEMP/release-readback.json" "$EXPECTED_TAG" "$EXPECTED_SOURCE_SHA" "$RELEASE_PAYLOAD" "$RELEASE_SIDECARS" "$RUNNER_TEMP/release-download" "$RELEASE_NOTES" "$RUNNER_TEMP/tag-readback.txt" "${{ steps.tag_identity.outputs.tag_object_sha }}" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          from validate_github_release_readback import validate_release_readback, validate_tag_identity

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag_refs = {}
          for line in Path(sys.argv[8]).read_text(encoding="utf-8").splitlines():
              object_sha, ref = line.split("\t", 1)
              tag_refs[ref] = object_sha
          tag = sys.argv[2]
          validate_tag_identity(
              tag_object_sha=tag_refs.get(f"refs/tags/{tag}", ""),
              peeled_sha=tag_refs.get(f"refs/tags/{tag}^{{}}", ""),
              expected_tag_object_sha=sys.argv[9],
              expected_source_sha=sys.argv[3],
          )
          validate_release_readback(
              release=release,
              expected_tag=tag,
              expected_source_sha=sys.argv[3],
              notes=Path(sys.argv[7]).read_text(encoding="utf-8"),
              payload_dir=Path(sys.argv[4]),
              sidecars_dir=Path(sys.argv[5]),
              downloaded_dir=Path(sys.argv[6]),
          )
          PY

  publish:
    name: Publish verified artifacts to PyPI
    needs: [verify, build, smoke, qualify, qualification_evidence, diaggui_qualification_evidence, cross_format_io_evidence, historical_74_gate, evidence, github_release]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/gwexpy/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyPI payload only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-payload-${{ needs.verify.outputs.source_sha }}
          path: ${{ runner.temp }}/release-payload

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: ${{ runner.temp }}/release-payload
