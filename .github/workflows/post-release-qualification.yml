          retention-days: 30

  aggregate:
    name: Aggregate qualification evidence
    if: always()
    needs:
      - identity
      - install_matrix
      - gwpy_matrix
      - sdist_contract
      - conda_matrix
      - scientific_extras
      - docs_en_ja
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      all_passed: ${{ steps.final.outputs.all_passed }}
    env:
      CONTROL_ROOT: ${{ github.workspace }}/control
    steps:
      - name: Check out protected-main control revision
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Set up aggregate Python
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Prepare aggregate directories
        if: always()
        env:
          AGGREGATE_DIR: ${{ runner.temp }}/qualification-aggregate
          IDENTITY_DIR: ${{ runner.temp }}/identity-evidence
          PAYLOAD_DIR: ${{ runner.temp }}/public-payload
          REPORTS_DIR: ${{ runner.temp }}/qualification-reports
        run: |
          mkdir -p "$PAYLOAD_DIR" "$IDENTITY_DIR" "$REPORTS_DIR" "$AGGREGATE_DIR"

      - name: Download exact public payload
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: post-release-public-payload-5c91cf2d1087616c9815d0cbcc082c5f21bb36e9
          path: ${{ runner.temp }}/public-payload

      - name: Download identity evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: post-release-identity-evidence-5c91cf2d1087616c9815d0cbcc082c5f21bb36e9
          path: ${{ runner.temp }}/identity-evidence

      - name: Download all qualification reports
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: post-release-report-*
          path: ${{ runner.temp }}/qualification-reports
          merge-multiple: true

      - name: Aggregate exact nineteen-cell ledger
        if: always()
        env:
          AGGREGATE_DIR: ${{ runner.temp }}/qualification-aggregate
          IDENTITY_DIR: ${{ runner.temp }}/identity-evidence
          PAYLOAD_DIR: ${{ runner.temp }}/public-payload
          REPORTS_DIR: ${{ runner.temp }}/qualification-reports
        run: |
          set +e
          python "$CONTROL_ROOT/scripts/ci/qualify_published_release.py" aggregate \
            --claims "$CONTROL_ROOT/tests/qualification/v0.2.0-claims.json" \
            --artifact-dir "$PAYLOAD_DIR" \
            --reports-dir "$REPORTS_DIR" \
            --pypi-json "$IDENTITY_DIR/pypi.json" \
            --payload-sidecar "$IDENTITY_DIR/distribution-sha256.json" \
            --json-out "$AGGREGATE_DIR/aggregate.json" \
            --junit-out "$AGGREGATE_DIR/aggregate.xml"
          aggregate_status=$?
          set -e
          printf '%s\n' "$aggregate_status" > \
            "$AGGREGATE_DIR/aggregate-exit-code.txt"

      - name: Upload aggregate qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: post-release-qualification-aggregate
          path: |
            ${{ runner.temp }}/qualification-aggregate/aggregate.json
            ${{ runner.temp }}/qualification-aggregate/aggregate.xml
            ${{ runner.temp }}/qualification-aggregate/aggregate-exit-code.txt
          if-no-files-found: error
          retention-days: 30

      - name: Assert complete qualification ledger
        id: final
        if: always()
        env:
          AGGREGATE_DIR: ${{ runner.temp }}/qualification-aggregate
          IDENTITY_RESULT: ${{ needs.identity.result }}
          INSTALL_MATRIX_RESULT: ${{ needs.install_matrix.result }}
          GWPY_MATRIX_RESULT: ${{ needs.gwpy_matrix.result }}
          SDIST_CONTRACT_RESULT: ${{ needs.sdist_contract.result }}
          CONDA_MATRIX_RESULT: ${{ needs.conda_matrix.result }}
          SCIENTIFIC_EXTRAS_RESULT: ${{ needs.scientific_extras.result }}
          DOCS_EN_JA_RESULT: ${{ needs.docs_en_ja.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          aggregate_dir = Path(os.environ["AGGREGATE_DIR"])
          try:
              exit_code = int(
                  (aggregate_dir / "aggregate-exit-code.txt")
                  .read_text(encoding="ascii")
                  .strip()
              )
              aggregate = json.loads(
                  (aggregate_dir / "aggregate.json").read_text(encoding="utf-8")
              )
              passed = (
                  aggregate["passed"] is True
                  and len(aggregate["required_cells"]) == 19
                  and len(set(aggregate["required_cells"])) == 19
              )
          except (OSError, ValueError, KeyError, TypeError, json.JSONDecodeError):
              exit_code = -1
              passed = False

          results = {
              "identity": os.environ["IDENTITY_RESULT"],
              "install_matrix": os.environ["INSTALL_MATRIX_RESULT"],
              "gwpy_matrix": os.environ["GWPY_MATRIX_RESULT"],
              "sdist_contract": os.environ["SDIST_CONTRACT_RESULT"],
              "conda_matrix": os.environ["CONDA_MATRIX_RESULT"],
              "scientific_extras": os.environ["SCIENTIFIC_EXTRAS_RESULT"],
              "docs_en_ja": os.environ["DOCS_EN_JA_RESULT"],
          }
          needs_passed = all(value == "success" for value in results.values())
          all_passed = exit_code == 0 and passed and needs_passed
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"all_passed={'true' if all_passed else 'false'}\n")
          if not all_passed:
              raise SystemExit(
                  f"qualification failed: exit={exit_code}, passed={passed}, needs={results}"
              )
          PY

  qualification_gate:
    name: Qualification gate
    if: always()
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGGREGATE_RESULT: ${{ needs.aggregate.result }}
      ALL_PASSED: ${{ needs.aggregate.outputs.all_passed }}
    steps:
      - name: Require successful literal qualification result
        run: |
          [[ "$AGGREGATE_RESULT" == "success" ]]
          [[ "$ALL_PASSED" == "true" ]]
