name: Test (gwpy-compat)

on:
  pull_request:
    branches: [main]
    # Limit PR runs to the TimeSeries dependency cone (verified via import grep):
    # interop/io/types are core deps; plot is reached via gwexpy/types' plot mixin.
    # Unrelated PRs outside this dependency and proxy-contract cone skip this
    # gate; main push and manual dispatch keep full coverage.
    paths:
      - "gwexpy/timeseries/**"
      - "gwexpy/frequencyseries/**"
      - "gwexpy/spectrogram/**"
      - "gwexpy/signal/**"
      - "gwexpy/types/**"
      - "gwexpy/interop/**"
      - "gwexpy/io/**"
      - "gwexpy/fitting/**"
      - "gwexpy/plot/**"
      - "gwexpy/utils/**"
      - "gwexpy/table/**"
      - "tests/timeseries/**"
      - "tests/table/**"
      - "tests/interop/**"
      - "tests/test_gwpy4_proxy_contract.py"
      - "docs/developers/contracts/public_io_contract.*"
      - "pyproject.toml"
      - "requirements*.txt"
      - "environment.yml"
      - ".github/workflows/test-compat-gwpy.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gwpy-compat:
    name: GWpy compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gwexpy
          create-args: >-
            python=3.11
            pip
          init-shell: bash
          cache-environment: true
          cache-downloads: true

      - name: Provision compatibility environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.0" "scipy<1.14" "astropy<7.0" pandas matplotlib h5py "gwpy>=4.0.0,<5.0.0"
          python -m pip install lalsuite
          python -m pip install pytest pytest-forked
          python -m pip install -e . --no-deps

      - name: Record compatibility versions
        run: |
          python - <<'PY'
          from importlib.metadata import version

          print("gwpy=" + version("gwpy"))
          print("lalsuite=" + version("lalsuite"))
          PY

      - name: Run focused compatibility tests
        run: |
          pytest -q \
            tests/timeseries/test_transfer_function_compat.py \
            tests/timeseries/test_collections_spectral_compat.py \
            tests/timeseries/test_fft_param_compat.py

      - name: Run GWpy 4 proxy compatibility tests
        run: pytest -q tests/test_gwpy4_proxy_contract.py tests/table/test_table.py tests/interop/test_interop_lal.py

      - name: Run full timeseries suite
        run: pytest -q tests/timeseries
