name: Test (gwpy-compat)

on:
  pull_request:
    branches: [main]
    # Limit PR runs to the TimeSeries dependency cone (verified via import grep):
    # interop/io/types are core deps; plot is reached via gwexpy/types' plot mixin.
    # Unrelated PRs outside this dependency and proxy-contract cone skip this
    # gate; main push and manual dispatch keep full coverage.
    paths:
      - "gwexpy/**"
      - "gwexpy/timeseries/**"
      - "gwexpy/frequencyseries/**"
      - "gwexpy/spectrogram/**"
      - "gwexpy/signal/**"
      - "gwexpy/types/**"
      - "gwexpy/interop/**"
      - "gwexpy/io/**"
      - "gwexpy/fitting/**"
      - "gwexpy/plot/**"
      - "gwexpy/utils/**"
      - "gwexpy/table/**"
      - "tests/timeseries/**"
      - "tests/**"
      - "tests/table/**"
      - "tests/interop/**"
      - "tests/test_gwpy4_proxy_contract.py"
      - "tests/test_gwpy_override_inventory.py"
      - "scripts/audit_gwpy_overrides.py"
      - "docs/developers/plans/manifests/audit-manifest-v0.2.3-gwpy-overrides.json"
      - "docs/developers/contracts/public_io_contract.*"
      - "pyproject.toml"
      - "requirements*.txt"
      - "environment.yml"
      - ".github/workflows/test-compat-gwpy.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gwpy-compat:
    name: GWpy compatibility (${{ matrix.gwpy }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gwpy: ["4.0.1", "4.0.2"]
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      PYTHONFAULTHANDLER: "1"
      GWPY_VERSION: ${{ matrix.gwpy }}
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}

      - name: Verify checked-out source
        run: |
          actual_source_sha="$(git rev-parse HEAD)"
          test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: gwexpy
          create-args: >-
            python=3.11
            pip
          init-shell: bash
          cache-environment: true
          cache-downloads: true

      - name: Provision compatibility environment
        run: |
          python -m pip install --upgrade pip
          # The reviewed inventory records Matplotlib-generated set() signatures.
          # Matplotlib 3.11 moves the _Unset sentinel and changes that evidence
          # even on the unchanged base; keep the reference environment explicit.
          python -m pip install "numpy<2.0" "scipy<1.14" "astropy<7.0" pandas "matplotlib==3.10.8" h5py "gwpy==$GWPY_VERSION"
          python -m pip install lalsuite
          python -m pip install pytest pytest-forked PyYAML iminuit
          python -m pip install -e . --no-deps

      - name: Record compatibility versions
        run: |
          mkdir -p "${RUNNER_TEMP}/gwpy-compat-evidence"
          python - <<'PY' | tee "${RUNNER_TEMP}/gwpy-compat-evidence/versions.txt"
          import os
          import sys
          from importlib.metadata import version

          expected_gwpy = os.environ["GWPY_VERSION"]
          actual_gwpy = version("gwpy")
          if actual_gwpy != expected_gwpy:
              raise SystemExit(
                  f"installed gwpy={actual_gwpy}, expected gwpy={expected_gwpy}"
              )

          print("gwpy=" + actual_gwpy)
          print("python=" + sys.version)
          print("source_sha=" + os.environ["EXPECTED_SOURCE_SHA"])
          print("lalsuite=" + version("lalsuite"))
          for package in ("numpy", "scipy", "astropy", "pandas", "matplotlib", "iminuit"):
              print(package + "=" + version(package))
          PY

      - name: Check GWpy override inventory
        timeout-minutes: 12
        run: |
          python scripts/audit_gwpy_overrides.py --check --require-terminal --execute-evidence \
            --manifest docs/developers/plans/manifests/audit-manifest-v0.2.3-gwpy-overrides.json \
            --oracle-python "$GWPY_VERSION=@current" \
            2>&1 | tee "${RUNNER_TEMP}/gwpy-compat-evidence/inventory.log"

      - name: Run focused compatibility tests
        run: |
          pytest -q --junitxml="${RUNNER_TEMP}/gwpy-compat-evidence/focused.xml" \
            tests/timeseries/test_transfer_function_compat.py \
            tests/timeseries/test_collections_spectral_compat.py \
            tests/timeseries/test_fft_param_compat.py \
            2>&1 | tee "${RUNNER_TEMP}/gwpy-compat-evidence/focused.log"

      - name: Run GWpy 4 proxy compatibility tests
        run: |
          pytest -q --junitxml="${RUNNER_TEMP}/gwpy-compat-evidence/proxy.xml" \
            tests/test_gwpy4_proxy_contract.py tests/table/test_table.py tests/interop/test_interop_lal.py \
            2>&1 | tee "${RUNNER_TEMP}/gwpy-compat-evidence/proxy.log"

      - name: Run full timeseries suite
        run: |
          pytest -q --junitxml="${RUNNER_TEMP}/gwpy-compat-evidence/timeseries.xml" tests/timeseries \
            2>&1 | tee "${RUNNER_TEMP}/gwpy-compat-evidence/timeseries.log"

      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gwpy-compat-evidence-${{ matrix.gwpy }}
          path: ${{ runner.temp }}/gwpy-compat-evidence/
          retention-days: 14
