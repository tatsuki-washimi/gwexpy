name: Post-release reconciliation

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_run:
    workflows: [Publish release]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Existing successful Publish release run ID (no publication rerun)
        required: true
        type: string
      release_tag:
        description: Existing final release tag, for example v0.2.6
        required: true
        type: string

permissions:
  contents: read

# Serialize automatic and manual entries together. Per-version Git ref CAS also
# protects writes by other callers; no running reconciliation is cancelled.
concurrency:
  group: post-release-persistence
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Resolve exact successful publication and recheck published bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=(--release-run-id "$RELEASE_RUN_ID" --output "$RUNNER_TEMP/post-release.json")
          if [[ "$EVENT" == workflow_run ]]; then
            args+=(--automatic)
          else
            args+=(--release-tag "$RELEASE_TAG")
          fi
          python scripts/ci/post_release.py resolve "${args[@]}"
      - name: Observe independent external services
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/post_release.py observe --record "$RUNNER_TEMP/post-release.json" --output "$RUNNER_TEMP/post-release.json"
      - name: Transfer verified record to persistence job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-post-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-release.json
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Download same-run verified record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-post-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified
      - name: Persist version manifest and reuse review PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/post_release.py persist --record "$RUNNER_TEMP/verified/post-release.json"

  resume:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out trusted default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Resume durable pending records through version branch CAS
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/post_release.py resume
