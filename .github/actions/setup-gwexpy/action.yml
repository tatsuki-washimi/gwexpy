name: Set up gwexpy environment
description: >-
  Provision the gwexpy conda environment via micromamba and install the standard
  test/runtime stack (Qt bindings, plotting, fitting). Centralizes provisioning
  so every job shares one definition and cannot drift out of sync.

inputs:
  python-version:
    description: Python version to create in the micromamba environment.
    required: false
    default: "3.11"
  extras:
    description: >-
      Optional, space-separated list of extra pip packages to install for a
      specific gate (e.g. "zarr" or "freezegun xarray netCDF4").
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        environment-name: gwexpy
        create-args: >-
          python=${{ inputs.python-version }}
        init-shell: bash

    - name: Provision gwexpy environment
      shell: bash -leo pipefail {0}
      run: |
        python -m pip install --upgrade pip build
        python -m pip install -e . --no-deps
        python -m pip install PyQt5 qtpy pyqtgraph iminuit

    - name: Install extras
      if: ${{ inputs.extras != '' }}
      shell: bash -leo pipefail {0}
      run: |
        python -m pip install ${{ inputs.extras }}
